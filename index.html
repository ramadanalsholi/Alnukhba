// ---------- helpers ----------
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const todayISO = () => new Date().toISOString().slice(0, 10);
const roundMoney = (n) => Math.round((Number(n || 0) + Math.sign(Number(n || 0)) * Number.EPSILON) * 100) / 100;
const fmt = (n) => roundMoney(n || 0).toLocaleString("en-US", { maximumFractionDigits: 2 });
const positiveNumber = (value) => Number.isFinite(Number(value)) && Number(value) > 0;
const nonNegativeNumber = (value) => Number.isFinite(Number(value)) && Number(value) >= 0;
const getInvoicePaidAmount = (invoice) => Number(invoice.paidAmount ?? (invoice.paymentStatus === "paid" || (!invoice.paymentStatus && !invoice.debtTransactionId) ? invoice.amount : 0));
const getInvoiceInitialPaidAmount = (invoice, customers = [], suppliers = []) => Number(invoice.initialPaidAmount ?? Math.max(0, getInvoicePaidAmount(invoice) - getInvoiceLaterPaymentsAmount(invoice, customers, suppliers)));
const getInvoiceLaterPaymentsAmount = (invoice, customers = [], suppliers = []) => {
  const customer = customers.find((item) => item.id === (invoice.customerId || invoice.contactId));
  const supplier = suppliers.find((item) => item.id === (invoice.supplierId || invoice.contactId));
  const customerTotal = (customer?.transactions || []).filter((transaction) => transaction.customerPayment).reduce((sum, transaction) => sum + (Array.isArray(transaction.allocations) && transaction.allocations.length ? transaction.allocations.filter((allocation) => allocation.invoiceId === invoice.id).reduce((allocationSum, allocation) => allocationSum + Number(allocation.amount || 0), 0) : transaction.invoiceId === invoice.id ? Number(transaction.amount || 0) : 0), 0);
  const supplierTotal = (supplier?.transactions || []).filter((transaction) => transaction.supplierPayment || transaction.supplierReceipt).reduce((sum, transaction) => sum + (transaction.allocations || []).filter((allocation) => allocation.invoiceId === invoice.id).reduce((allocationSum, allocation) => allocationSum + Number(allocation.amount || 0), 0), 0);
  return roundMoney(customerTotal + supplierTotal);
};
const getInvoiceReturnedAmount = (invoiceId, invoices = []) => invoices.filter((invoice) => invoice.isReturn && invoice.returnForInvoiceId === invoiceId).reduce((sum, invoice) => sum + Number(invoice.amount || 0), 0);
const getInvoiceOutstanding = (invoice, invoices = []) => roundMoney(Math.max(0, Number(invoice.amount || 0) - getInvoicePaidAmount(invoice) - getInvoiceReturnedAmount(invoice.id, invoices)));
const getInvoicePaymentStatus = (invoice, invoices = []) => getInvoiceOutstanding(invoice, invoices) === 0 ? "paid" : getInvoicePaidAmount(invoice) > 0 ? "partial" : "unpaid";
const monthKey = (iso) => (iso || "").slice(0, 7);
const normalizeName = (value) => String(value || "").trim().replace(/\s+/g, " ").toLocaleLowerCase("ar");
const hasDuplicateName = (items, name, currentId = null) => (items || []).some((item) => item.id !== currentId && normalizeName(item.name) === normalizeName(name));
const contactBalance = (c) => roundMoney((c.transactions || []).reduce((s, t) => s + (t.type === "debit" ? Number(t.amount) : t.type === "credit" ? -Number(t.amount) : 0), 0));
const getCustomerProjects = (customer, projects) => projects.filter((p) => p.customerId === customer.id || (!p.customerId && p.customerName === customer.name));
const getCustomerOutstanding = (customer, projects, income) => {
  const ledger = contactBalance(customer);
  const sums = getCustomerProjects(customer, projects).map((project) => getProjectSummary(project, income));
  const projectsRemaining = sums.reduce((sum, summary) => sum + summary.remaining, 0);
  const projectsSurplus = sums.reduce((sum, summary) => sum + summary.surplus, 0);
  return { ledger, projectsRemaining, projectsSurplus, total: ledger + projectsRemaining - projectsSurplus };
};
const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[ch]));
function numberToArabicWords(value) {
  const num = Math.round(Number(value) || 0);
  if (num === 0) return "صفر";
  if (num < 0) return "سالب " + numberToArabicWords(-num);

  const ones = ["", "واحد", "اثنان", "ثلاثة", "أربعة", "خمسة", "ستة", "سبعة", "ثمانية", "تسعة"];
  const teens = ["عشرة", "أحد عشر", "اثنا عشر", "ثلاثة عشر", "أربعة عشر", "خمسة عشر", "ستة عشر", "سبعة عشر", "ثمانية عشر", "تسعة عشر"];
  const tens = ["", "", "عشرون", "ثلاثون", "أربعون", "خمسون", "ستون", "سبعون", "ثمانون", "تسعون"];
  const hundreds = ["", "مائة", "مئتان", "ثلاثمائة", "أربعمائة", "خمسمائة", "ستمائة", "سبعمائة", "ثمانمائة", "تسعمائة"];

  const threeDigits = (n) => {
    const parts = [];
    const h = Math.floor(n / 100);
    const rem = n % 100;
    if (h > 0) parts.push(hundreds[h]);
    if (rem > 0) {
      if (rem < 10) parts.push(ones[rem]);
      else if (rem < 20) parts.push(teens[rem - 10]);
      else {
        const t = Math.floor(rem / 10);
        const o = rem % 10;
        parts.push(o > 0 ? ones[o] + " و" + tens[t] : tens[t]);
      }
    }
    return parts.join(" و");
  };

  const groups = [
    { value: 1000000000, singular: "مليار", dual: "ملياران", plural: "مليارات" },
    { value: 1000000, singular: "مليون", dual: "مليونان", plural: "ملايين" },
    { value: 1000, singular: "ألف", dual: "ألفان", plural: "آلاف" },
  ];

  let n = num;
  const resultParts = [];
  for (const group of groups) {
    const count = Math.floor(n / group.value);
    n = n % group.value;
    if (count > 0) {
      if (count === 1) resultParts.push(group.singular);
      else if (count === 2) resultParts.push(group.dual);
      else if (count <= 10) resultParts.push(threeDigits(count) + " " + group.plural);
      else resultParts.push(threeDigits(count) + " " + group.singular);
    }
  }
  if (n > 0) resultParts.push(threeDigits(n));
  return resultParts.join(" و");
}
const getProjectPayments = (project, income = []) => {
  const embeddedPayments = (project.payments || []).map((payment) => ({
    ...payment,
    paymentId: payment.paymentId || payment.id,
    projectId: project.id,
  }));
  const incomePayments = income
    .filter((entry) => entry.projectId === project.id)
    .map((entry) => ({ ...entry, paymentId: entry.paymentId || entry.id }));
  const unique = new Map();
  [...embeddedPayments, ...incomePayments].forEach((payment) => {
    const key = payment.paymentId || payment.id;
    if (key) unique.set(key, payment);
  });
  return Array.from(unique.values());
};
const projectCost = (project) => (project.measurements || []).reduce((sum, measurement) => sum + Number(measurement.totalAmount || 0), 0);
const getProjectSummary = (project, income = []) => {
  const cost = projectCost(project);
  const paid = getProjectPayments(project, income).reduce((sum, payment) => sum + Number(payment.amount || 0), 0);
  const waived = Math.min(cost, Math.max(0, Number(project.waivedAmount || 0)));
  const completed = project.status === "مكتمل";
  const hasMeasure = (project.measurements || []).length > 0;
  const net = Math.round((cost - waived - paid) * 1000) / 1000;
  const extra = Math.max(0, -net);
  return { cost, paid, waived, completed, hasMeasure, remaining: Math.max(0, net), surplus: completed ? extra : 0, advance: completed ? 0 : extra, settled: completed && hasMeasure && net <= 0 };
};
const getUniqueIncome = (income = []) => {
  const unique = new Map();
  income.forEach((entry) => {
    const key = entry.projectId ? (entry.paymentId || entry.id) : entry.id;
    if (key) unique.set(key, entry);
  });
  return Array.from(unique.values());
};
const getAllProjectIncome = (projects = [], income = []) => {
  const unique = new Map();
  getUniqueIncome(income.filter((entry) => !entry.projectId)).forEach((entry) => unique.set(entry.id, entry));
  projects.forEach((project) => {
    getProjectPayments(project, income).forEach((payment) => {
      const key = payment.paymentId || payment.id;
      if (key) unique.set(key, { ...payment, customerName: payment.customerName || project.customerName, projectId: project.id });
    });
  });
  return Array.from(unique.values());
};
const upsertSupplierDebt = (supplier, transaction) => {
  const transactions = supplier.transactions || [];
  const exists = transactions.some((item) => item.id === transaction.id);
  return {
    ...supplier,
    transactions: exists ? transactions.map((item) => item.id === transaction.id ? { ...item, ...transaction } : item) : [transaction, ...transactions],
  };
};
const getSupplierDebtInvoices = (supplierId, invoices = []) => invoices
  .filter((invoice) => invoice.supplierId === supplierId && invoice.debtTransactionId && positiveNumber(invoice.amount))
  .sort((a, b) => (a.date || '').localeCompare(b.date || '') || String(a.id).localeCompare(String(b.id)));
const getInvoiceReturnedQuantity = (invoiceId, itemId, invoices = []) => invoices
  .filter((invoice) => invoice.isReturn && invoice.returnForInvoiceId === invoiceId)
  .reduce((sum, invoice) => sum + (invoice.items || []).filter((item) => item.inventoryId === itemId).reduce((itemSum, item) => itemSum + Number(item.quantity || 0), 0), 0);
const getRemainingInvoiceLines = (source, invoices = [], currentReturn = null) => {
  if (!source) return [];
  const grouped = (source.items || []).reduce((lines, line) => {
    const existing = lines.get(line.inventoryId);
    const quantity = Number(line.quantity || 0);
    lines.set(line.inventoryId, existing
      ? { ...existing, quantity: Number(existing.quantity || 0) + quantity, total: Number(existing.total || 0) + Number(line.total || 0), costTotal: Number(existing.costTotal || 0) + quantity * Number(line.costUnitPrice || 0) }
      : { ...line, costTotal: quantity * Number(line.costUnitPrice || 0) });
    return lines;
  }, new Map());
  return [...grouped.values()].map((line) => {
    const alreadyReturned = getInvoiceReturnedQuantity(source.id, line.inventoryId, invoices);
    const currentQuantity = currentReturn?.isReturn && currentReturn.returnForInvoiceId === source.id
      ? (currentReturn.items || []).filter((item) => item.inventoryId === line.inventoryId).reduce((sum, item) => sum + Number(item.quantity || 0), 0)
      : 0;
    return {
      ...line,
      unitPrice: Number(line.quantity || 0) ? roundMoney(Number(line.total || 0) / Number(line.quantity)) : Number(line.unitPrice || 0),
      costUnitPrice: Number(line.quantity || 0) ? roundMoney(Number(line.costTotal || 0) / Number(line.quantity)) : Number(line.costUnitPrice || 0),
      returnable: Math.max(0, Number(line.quantity || 0) - alreadyReturned + currentQuantity),
    };
  }).filter((line) => line.returnable > 0);
};
const getSupplierStatement = (supplier, invoices = []) => {
  const debtInvoices = getSupplierDebtInvoices(supplier.id, invoices);
  const transactions = supplier.transactions || [];
  const paidByInvoice = new Map();
  let allocatedPaymentTotal = 0;
  let allocatedReceiptTotal = 0;
  transactions.filter((transaction) => (transaction.supplierPayment || transaction.supplierReceipt) && Array.isArray(transaction.allocations)).forEach((transaction) => {
    transaction.allocations.forEach((allocation) => {
      const amount = Math.max(0, Number(allocation.amount || 0));
      if (!amount || !debtInvoices.some((invoice) => invoice.id === allocation.invoiceId)) return;
      paidByInvoice.set(allocation.invoiceId, (paidByInvoice.get(allocation.invoiceId) || 0) + amount);
      if (transaction.supplierPayment) allocatedPaymentTotal += amount;
      if (transaction.supplierReceipt) allocatedReceiptTotal += amount;
    });
  });
  const rows = debtInvoices.map((invoice) => ({
    invoice,
    paid: Math.min(Number(invoice.amount || 0), paidByInvoice.get(invoice.id) || 0),
    remaining: Math.max(0, Number(invoice.amount || 0) - Math.min(Number(invoice.amount || 0), paidByInvoice.get(invoice.id) || 0)),
  }));
  const supplierPaymentTotal = transactions
    .filter((transaction) => transaction.supplierPayment)
    .reduce((sum, transaction) => sum + Math.max(0, Number(transaction.amount || 0)), 0);
  const supplierReceiptTotal = transactions
    .filter((transaction) => transaction.supplierReceipt)
    .reduce((sum, transaction) => sum + Math.max(0, Number(transaction.amount || 0)), 0);
  let unallocatedCredits = transactions
    .filter((transaction) => transaction.type === "credit" && !transaction.supplierPayment && !transaction.supplierReceipt)
    .reduce((sum, transaction) => sum + Math.max(0, Number(transaction.amount || 0)), 0)
    + Math.max(0, supplierPaymentTotal - allocatedPaymentTotal)
    + Math.max(0, supplierReceiptTotal - allocatedReceiptTotal);
  rows.forEach((row) => {
    const extra = Math.min(row.remaining, unallocatedCredits);
    row.paid += extra;
    row.remaining -= extra;
    unallocatedCredits -= extra;
  });
  const invoiceDebt = rows.reduce((sum, row) => sum + Number(row.remaining || 0), 0);
  const invoicePaid = rows.reduce((sum, row) => sum + Number(row.paid || 0), 0);
  const invoiceDebtTransactionIds = new Set(debtInvoices.map((invoice) => invoice.debtTransactionId));
  const manualBalance = transactions
    .filter((transaction) => !invoiceDebtTransactionIds.has(transaction.id) && !transaction.supplierPayment && transaction.type === "debit")
    .reduce((sum, transaction) => sum + Math.max(0, Number(transaction.amount || 0)), 0);
  const paymentExcess = unallocatedCredits;
  const net = invoiceDebt + manualBalance - paymentExcess;
  return { rows, invoiceDebt, invoicePaid, manualBalance, paymentExcess, owed: Math.max(0, net), credit: Math.max(0, -net), totalInvoices: debtInvoices.reduce((sum, invoice) => sum + Number(invoice.amount || 0), 0) };
};
const allocateSupplierPayment = (supplier, invoices, amount) => {
  const statement = getSupplierStatement(supplier, invoices);
  let remaining = Number(amount || 0);
  return statement.rows.filter((row) => row.remaining > 0).map((row) => {
    const allocated = Math.min(row.remaining, remaining);
    remaining -= allocated;
    return allocated > 0 ? { invoiceId: row.invoice.id, amount: allocated } : null;
  }).filter(Boolean);
};
const getCustomerDebtInvoices = (customer, invoices = []) => invoices
  .filter((invoice) => (invoice.direction || (invoice.type === "شراء" ? "purchase" : "sale")) === "sale" && (invoice.customerId || invoice.contactId) === customer.id && !invoice.isReturn)
  .map((invoice) => ({ invoice, remaining: getInvoiceOutstanding(invoice, invoices) }))
  .filter((row) => row.remaining > 0)
  .sort((a, b) => (a.invoice.date || "").localeCompare(b.invoice.date || "") || String(a.invoice.id).localeCompare(String(b.invoice.id)));
const allocateCustomerPayment = (customer, invoices, amount) => {
  let remaining = Number(amount || 0);
  return getCustomerDebtInvoices(customer, invoices).map(({ invoice, remaining: due }) => {
    const allocated = Math.min(due, remaining);
    remaining -= allocated;
    return allocated > 0 ? { invoiceId: invoice.id, amount: roundMoney(allocated) } : null;
  }).filter(Boolean);
};

// ---------- persistence layer ----------
function useFactoryData(organizationId) {
  const [downloadsNs, setDownloadsNs] = useState(null);
  const [reloadToken, setReloadToken] = useState(0);
  const [ready, setReady] = useState(false);
  const [usingLocal, setUsingLocal] = useState(false);
  const [error, setError] = useState("");
  const remoteLoadVersion = useRef(0);
  const initial = {};
  COLLECTIONS.forEach((c) => (initial[c] = []));
  const [data, setData] = useState(initial);

  useEffect(() => {
    let cancelled = false;
    const loadLocal = () => {
      setUsingLocal(true);
      const loaded = {};
      COLLECTIONS.forEach((name) => { try { loaded[name] = JSON.parse(localStorage.getItem(LOCAL_PREFIX + name) || "[]"); } catch (e) { loaded[name] = []; } });
      setData(loaded);
      setReady(true);
    };
    const loadRemote = async () => {
      const requestVersion = ++remoteLoadVersion.current;
      const { data: rows, error: queryError } = await supabaseClient.from("app_records").select("collection,id,payload").eq("organization_id", organizationId);
      if (queryError) { if (!cancelled && requestVersion === remoteLoadVersion.current) { setError(queryError.message); setReady(true); } return; }
      const loaded = {};
      COLLECTIONS.forEach((name) => (loaded[name] = []));
      (rows || []).forEach((row) => { if (loaded[row.collection]) loaded[row.collection].push({ id: row.id, ...(row.payload || {}) }); });
      if (!cancelled && requestVersion === remoteLoadVersion.current) { setData(loaded); setReady(true); }
    };
    if (!hasSupabaseConfig || !organizationId) { loadLocal(); return () => { cancelled = true; }; }
    loadRemote();
    const channel = supabaseClient.channel("factory-records-" + organizationId)
      .on("postgres_changes", { event: "*", schema: "public", table: "app_records", filter: "organization_id=eq." + organizationId }, loadRemote)
      .subscribe();
    return () => { cancelled = true; supabaseClient.removeChannel(channel); };
  }, [organizationId, reloadToken]);

  const saveLocal = (name, list) => { try { localStorage.setItem(LOCAL_PREFIX + name, JSON.stringify(list)); } catch (e) { console.error(e); } };

  const upsert = async (name, docObj, options = {}) => {
    if (supabaseClient && organizationId) {
      const { error: upsertError } = await supabaseClient.from("app_records").upsert({ organization_id: organizationId, collection: name, id: docObj.id, payload: docObj }, { onConflict: "organization_id,collection,id" });
      if (upsertError) {
        setError(upsertError.message);
        if (options.throwOnError) throw upsertError;
        return false;
      }
      setData((prev) => {
        const list = prev[name] || [];
        const idx = list.findIndex((d) => d.id === docObj.id);
        const next = idx === -1 ? [docObj, ...list] : list.map((d) => (d.id === docObj.id ? docObj : d));
        return { ...prev, [name]: next };
      });
      return true;
    } else {
      setData((prev) => {
        const list = prev[name] || [];
        const idx = list.findIndex((d) => d.id === docObj.id);
        const next = idx === -1 ? [docObj, ...list] : list.map((d) => (d.id === docObj.id ? docObj : d));
        saveLocal(name, next);
        return { ...prev, [name]: next };
      });
      return true;
    }
  };
  const upsertBatch = async (records) => {
    if (!Array.isArray(records) || records.length === 0) return true;
    if (supabaseClient && organizationId) {
      const { error: batchError } = await supabaseClient.rpc("upsert_app_records_batch", {
        p_organization_id: organizationId,
        p_records: records.map(({ collection, record }) => ({ collection, id: record.id, payload: record })),
      });
      if (batchError) { setError(batchError.message); return false; }
      remoteLoadVersion.current += 1;
    }
    setData((prev) => {
      const next = { ...prev };
      records.forEach(({ collection, record }) => {
        const list = next[collection] || [];
        const index = list.findIndex((item) => item.id === record.id);
        next[collection] = index < 0 ? [record, ...list] : list.map((item) => item.id === record.id ? record : item);
      });
      if (!supabaseClient || !organizationId) records.forEach(({ collection }) => saveLocal(collection, next[collection] || []));
      return next;
    });
    return true;
  };
  const remove = async (name, id) => {
    if (supabaseClient && organizationId) {
      const { error: deleteError } = await supabaseClient.from("app_records").delete().eq("organization_id", organizationId).eq("collection", name).eq("id", id);
      if (deleteError) { setError(deleteError.message); return; }
      setData((prev) => ({ ...prev, [name]: (prev[name] || []).filter((d) => d.id !== id) }));
    } else {
      setData((prev) => { const next = (prev[name] || []).filter((d) => d.id !== id); saveLocal(name, next); return { ...prev, [name]: next }; });
    }
  };

  const reload = () => setReloadToken((value) => value + 1);
  const importBackup = async (backup) => {
    const validationError = validateJsonBackup(backup);
    if (validationError) throw new Error(validationError);
    downloadJsonBackup(data, "نسخة-احتياطية-كاملة-المطحن-" + todayISO() + "-قبل-الاستيراد.json");
    let added = 0;
    let updated = 0;
    for (const name of COLLECTIONS) {
      const currentIds = new Set((data[name] || []).map((record) => record.id));
      for (const record of backup.collections[name]) {
        if (currentIds.has(record.id)) updated += 1;
        else added += 1;
        await upsert(name, record, { throwOnError: true });
      }
    }
    reload();
    return { added, updated };
  };

  return { ready, usingLocal, data, upsert, upsertBatch, remove, downloadsNs, error, reload, importBackup };
}

async function exportBackup(downloadsNs, data) {
  if (!window.XLSX) { notify("تعذر تحميل مكتبة التصدير، حاول تحديث الصفحة."); return; }
  const wb = XLSX.utils.book_new();
  const sheets = {
    "المشتريات والمبيعات": data.invoices.map((i) => ({ "رقم الفاتورة": i.invoiceNumber || "", الاتجاه: i.direction, الجهة: i.contactName || i.supplierName || i.customerName || "", المبلغ: i.amount, التاريخ: i.date, الوصف: i.description })),
    "المخزون": data.inventory.map((i) => ({ الصنف: i.name, الكمية: i.quantity, الوحدة: i.unit, "حد التنبيه": i.minThreshold })),
    "حركات المخزن": data.inventoryMovements.map((m) => ({ الصنف: m.itemName, الاتجاه: m.direction === "in" ? "قبض" : "صرف", الكمية: m.quantity, التاريخ: m.date, المصدر: m.note })),
    "الخزينة الرئيسية": (data.treasury[0]?.transactions || []).map((t) => ({ الاتجاه: t.direction === "in" ? "قبض" : "صرف", المبلغ: t.amount, التاريخ: t.date, الوصف: t.note })),
    "العملاء": data.customers.map((c) => ({ الاسم: c.name, الهاتف: c.phone, الرصيد: contactBalance(c), ملاحظات: c.notes })),
    "العمال": data.workers.map((c) => ({ الاسم: c.name, الهاتف: c.phone, الرصيد: contactBalance(c), ملاحظات: c.notes })),
    "الموردون": data.suppliers.map((c) => ({ الاسم: c.name, الهاتف: c.phone, الرصيد: contactBalance(c), ملاحظات: c.notes })),
    "الحضور": data.attendance.map((a) => ({ العامل: a.workerName, التاريخ: a.date, الحالة: a.status })),
  };
  Object.entries(sheets).forEach(([name, rows]) => {
    const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ "لا توجد بيانات": "" }]);
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
  });
  const buf = XLSX.write(wb, { type: "array", bookType: "xlsx" });
  const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const filename = "نسخة-احتياطية-المطحن-" + todayISO() + ".xlsx";
  if (downloadsNs) { try { await downloadsNs.save({ filename, data: blob }); } catch (e) { console.error("export failed", e); } }
  else downloadBlob(blob, filename);
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url; link.download = filename; link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const buildJsonBackup = (data) => ({
  schemaVersion: 1,
  exportedAt: new Date().toISOString(),
  collections: Object.fromEntries(COLLECTIONS.map((name) => [name, data[name] || []])),
});

function downloadJsonBackup(data, filename = "نسخة-احتياطية-كاملة-المطحن-" + todayISO() + ".json") {
  const json = JSON.stringify(buildJsonBackup(data), null, 2);
  downloadBlob(new Blob([json], { type: "application/json;charset=utf-8" }), filename);
}

function validateJsonBackup(value) {
  if (!value || typeof value !== "object" || Array.isArray(value)) return "ملف النسخة يجب أن يحتوي على كائن JSON.";
  if (value.schemaVersion !== 1) return "إصدار النسخة غير مدعوم.";
  if (!value.collections || typeof value.collections !== "object" || Array.isArray(value.collections)) return "قسم collections غير موجود أو غير صالح.";
  for (const name of COLLECTIONS) {
    const records = value.collections[name];
    if (!Array.isArray(records)) return `مجموعة ${name} غير موجودة أو ليست مصفوفة.`;
    const ids = new Set();
    for (const record of records) {
      if (!record || typeof record !== "object" || Array.isArray(record)) return `يوجد سجل تالف في مجموعة ${name}.`;
      if (typeof record.id !== "string" || !record.id.trim()) return `يوجد سجل بلا معرف في مجموعة ${name}.`;
      if (ids.has(record.id)) return `المعرف ${record.id} مكرر داخل مجموعة ${name}.`;
      ids.add(record.id);
      if (["invoices", "expenses", "income", "personalLog"].includes(name) && !positiveNumber(record.amount)) return `المبلغ في مجموعة ${name} يجب أن يكون موجبًا.`;
      if (name === "projects") {
        for (const payment of record.payments || []) if (!payment || !positiveNumber(payment.amount)) return `دفعة غير صالحة في المشروع ${record.id}.`;
      }
      for (const transaction of record.transactions || []) if (!transaction || !positiveNumber(transaction.amount)) return `معاملة غير صالحة في السجل ${record.id}.`;
    }
  }
  return "";
}

function useAuth() {
  const [session, setSession] = useState(null);
  const [organization, setOrganization] = useState(null);
  const [loading, setLoading] = useState(hasSupabaseConfig);
  const [error, setError] = useState("");

  const loadOrganization = async (currentSession) => {
    if (!currentSession) { setError(""); setSession(null); setOrganization(null); setLoading(false); return; }
    setError("");
    setSession(currentSession);
    const organizationName = currentSession.user.user_metadata?.organization_name || "شركة القصر";
    const organizationCode = currentSession.user.user_metadata?.organization_code || "";
    const { data, error: organizationError } = await supabaseClient.rpc("get_or_create_my_organization", { p_name: organizationName, p_code: organizationCode });
    if (organizationError) setError(organizationError.message);
    else setOrganization(Array.isArray(data) ? data[0] : data);
    setLoading(false);
  };

  useEffect(() => {
    if (!hasSupabaseConfig) return undefined;
    supabaseClient.auth.getSession().then(({ data }) => loadOrganization(data.session));
    const { data: listener } = supabaseClient.auth.onAuthStateChange((_event, nextSession) => loadOrganization(nextSession));
    return () => listener.subscription.unsubscribe();
  }, []);

  const signIn = (email, password) => supabaseClient.auth.signInWithPassword({ email, password });
  const signUp = (email, password, organizationName, organizationCode) => supabaseClient.auth.signUp({ email, password, options: { data: { organization_name: organizationName, organization_code: organizationCode } } });
  const signOut = () => supabaseClient.auth.signOut();
  return { session, organization, loading, error, signIn, signUp, signOut };
}

    setBusy(false);
    if (result.error) setMessage(result.error.message);
    else if (mode === "signup" && !result.data.session) setMessage("تم إنشاء الحساب. افحص بريدك لتأكيد الحساب ثم سجّل الدخول.");

          {mode === "signup" && <>
            <div><FieldLabel>اسم الشركة</FieldLabel><TextInput value={organizationName} onChange={(e) => setOrganizationName(e.target.value)} /></div>

          <div><FieldLabel>كلمة المرور</FieldLabel><TextInput type="password" value={password} onChange={(e) => setPassword(e.target.value)} /></div>
          <PrimaryButton onClick={submit} full disabled={busy || !email.trim() || password.length < 6}>{busy ? "جارٍ التنفيذ..." : mode === "signin" ? "تسجيل الدخول" : "إنشاء الحساب"}</PrimaryButton>
          {message && <div className="text-xs rounded-lg p-2" style={{ background: "var(--warn-bg)", color: "#A34632" }}>{message}</div>}
          <button onClick={() => { setMode(mode === "signin" ? "signup" : "signin"); setMessage(""); }} className="text-xs" style={{ color: "var(--accent)" }}>{mode === "signin" ? "إنشاء حساب جديد" : "لديك حساب؟ سجّل الدخول"}</button>
        </div>
      </div>
    </div>
  );
}

function FactoryApp({ organizationId, organizationCode, email, onSignOut }) {
  const { ready, usingLocal, data, upsert, upsertBatch, remove, downloadsNs, error, importBackup } = useFactoryData(organizationId);
  const { invoices, inventory, inventoryMovements, customers, suppliers, workers, attendance, treasury, expenses } = data;

  const [tab, setTab] = useState("dashboard");
  const [accountsSub, setAccountsSub] = useState("customers");
  const [reportMonth, setReportMonth] = useState(monthKey(todayISO()));
  const importInputRef = useRef(null);

  const lowStock = useMemo(() => inventory.filter((i) => Number(i.quantity) <= Number(i.minThreshold || 0)), [inventory]);
  const thisMonth = monthKey(todayISO());
  const monthInvoices = useMemo(() => invoices.filter((x) => monthKey(x.date) === thisMonth).reduce((s, x) => s + Number(x.amount || 0) * (x.isReturn ? -1 : 1), 0), [invoices, thisMonth]);
  const customerDebt = useMemo(() => customers.reduce((s, c) => s + Math.max(0, contactBalance(c)), 0), [customers]);
  const supplierDebt = useMemo(() => suppliers.reduce((sum, supplier) => sum + getSupplierStatement(supplier, invoices).owed, 0), [suppliers, invoices]);

  const handleImportBackup = async (event) => {
    const file = event.target.files?.[0];
    event.target.value = "";
    if (!file) return;
    try {
      const backup = JSON.parse(await file.text());
      const result = await importBackup(backup);
      notify(`تم استيراد النسخة بنجاح: ${result.added} سجل جديد و${result.updated} سجل محدث.`, "success");
    } catch (importError) {
      notify("توقف الاستيراد عند فشل حفظ أحد السجلات. قد تكون بعض السجلات السابقة قد حُفظت؛ استخدم نسخة ما قبل الاستيراد للاسترجاع." + (importError?.message ? " التفاصيل: " + importError.message : ""));
    }
  };

  const NAV = [
    { key: "dashboard", label: "لوحة التحكم", icon: "dashboard" },
    { key: "purchases", label: "المشتريات", icon: "truck" },
    { key: "sales", label: "المبيعات", icon: "receipt" },
    { key: "cashflow", label: "القبض والصرف", icon: "wallet" },
    { key: "treasury", label: "الخزينة الرئيسية", icon: "wallet" },
    { key: "expenses", label: "المصروفات اليومية", icon: "trendDown" },
    { key: "accounts", label: "الحسابات والديون", icon: "users" },
    { key: "inventory", label: "المخزون", icon: "package" },
    { key: "reports", label: "التقارير الشهرية", icon: "barChart" },
  ];

  if (!ready) {
    return <div dir="rtl" className="min-h-[500px] flex items-center justify-center" style={{ background: "var(--bg)", fontFamily: "'Cairo', sans-serif" }}><div className="text-sm" style={{ color: "var(--text-muted)" }}>جارِ تحميل البيانات...</div></div>;
  }

  return (
    <div dir="rtl" className="w-full min-h-screen flex" style={{ background: "var(--bg)", fontFamily: "'Cairo', sans-serif" }}>
      <aside className="w-[220px] shrink-0 hidden sm:flex sticky top-0 h-screen overflow-y-auto flex-col py-5 px-3 gap-1" style={{ background: "#2B2A27" }}>
        <div className="px-2 pb-5 flex items-center gap-2">
          <CompanyBadge size={36} variant="dark" />
          <div>
            <div className="text-white font-bold text-sm" style={{ fontFamily: "'El Messiri', sans-serif" }}>شركة القصر</div>
            <div className="text-[11px] text-stone-400">إدارة المحاسبة</div>
          </div>
        </div>
        <div className="flex flex-col gap-1 overflow-y-auto">
          {NAV.map((n) => {
            const active = tab === n.key;
            return (
              <button key={n.key} onClick={() => setTab(n.key)} className="flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-sm transition text-right"
                style={{ background: active ? "var(--accent)" : "transparent", color: active ? "white" : "#C9C4BB" }}>
                <Icon name={n.icon} size={17} />{n.label}
              </button>
            );
          })}
        </div>
        <div className="mt-auto pt-3 flex flex-col gap-2">
          <button onClick={() => exportBackup(downloadsNs, data)} className="flex items-center gap-2 px-3 py-2.5 rounded-xl text-xs border border-stone-600 text-stone-300 hover:text-white transition">
            <Icon name="download" size={14} /> نسخة احتياطية (Excel)
          </button>
          <button onClick={() => downloadJsonBackup(data)} className="flex items-center gap-2 px-3 py-2.5 rounded-xl text-xs border border-stone-600 text-stone-300 hover:text-white transition">
            <Icon name="download" size={14} /> نسخة احتياطية كاملة (JSON)
          </button>
          <button onClick={() => importInputRef.current?.click()} className="flex items-center gap-2 px-3 py-2.5 rounded-xl text-xs border border-stone-600 text-stone-300 hover:text-white transition">
            <Icon name="upload" size={14} /> استيراد نسخة JSON
          </button>
          <input ref={importInputRef} type="file" accept=".json,application/json" onChange={handleImportBackup} className="hidden" />
          <div className="px-2 text-[10px] leading-relaxed text-stone-500">الاستيراد يدمج البيانات ويحدّث السجلات ذات المعرف نفسه.</div>
          {usingLocal && <div className="px-2 text-[10px] leading-relaxed text-stone-500">يعمل التطبيق حاليًا بتخزين محلي على هذا المتصفح فقط.</div>}
          {organizationCode && <div className="px-2 text-[10px] leading-relaxed text-stone-400">رمز مشاركة الشركة: {organizationCode}</div>}
          {email && <button onClick={onSignOut} className="px-3 py-2 text-xs text-right text-stone-300 hover:text-white">تسجيل الخروج ({email})</button>}
        </div>
      </aside>

      <div className="sm:hidden fixed bottom-0 inset-x-0 z-40 flex justify-around py-2 overflow-x-auto" style={{ background: "#2B2A27" }}>
        {NAV.map((n) => {
          const active = tab === n.key;
          return (
            <button key={n.key} onClick={() => setTab(n.key)} className="flex flex-col items-center gap-0.5 px-2 py-1 shrink-0">
              <Icon name={n.icon} size={18} color={active ? "var(--accent)" : "#8b8880"} />
              <span className="text-[8px]" style={{ color: active ? "var(--accent)" : "#8b8880" }}>{n.label}</span>
            </button>
          );
        })}
      </div>

      <main className="flex-1 min-w-0 p-4 sm:p-6 pb-24 sm:pb-6">
        <div className="sm:hidden mb-4 rounded-xl border px-3 py-3 flex items-center gap-3" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
          <CompanyBadge size={36} variant="default" />
          <div className="min-w-0 flex-1">
            <div className="text-sm font-bold truncate" style={{ fontFamily: "'El Messiri', sans-serif", color: "var(--text-strong)" }}>شركة القصر</div>
            <div className="text-[10px] truncate" style={{ color: "var(--text-muted)" }}>{email || "حساب الشركة"}{organizationCode ? " · رمز الشركة: " + organizationCode : ""}</div>
          </div>
          {email && <button onClick={onSignOut} className="shrink-0 text-xs px-2.5 py-1.5 rounded-lg border" style={{ color: "var(--text-body)", borderColor: "var(--card-border)" }}>تسجيل الخروج</button>}
        </div>
        {error && <div className="mb-4 rounded-lg px-3 py-2 text-xs" style={{ background: "var(--warn-bg)", color: "#A34632" }}>تعذر مزامنة البيانات: {error}</div>}
        <div className="sm:hidden mb-4 rounded-xl border p-3 flex flex-col gap-2" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
          <div className="text-xs font-semibold" style={{ color: "var(--text-body)" }}>النسخ الاحتياطي</div>
          <div className="grid grid-cols-1 gap-2">
            <button onClick={() => exportBackup(downloadsNs, data)} className="flex items-center justify-center gap-2 px-3 py-2.5 rounded-lg text-xs border" style={{ borderColor: "var(--card-border)", color: "var(--text-body)" }}><Icon name="download" size={14} /> نسخة احتياطية (Excel)</button>
            <button onClick={() => downloadJsonBackup(data)} className="flex items-center justify-center gap-2 px-3 py-2.5 rounded-lg text-xs border" style={{ borderColor: "var(--card-border)", color: "var(--text-body)" }}><Icon name="download" size={14} /> نسخة احتياطية كاملة (JSON)</button>
            <button onClick={() => importInputRef.current?.click()} className="flex items-center justify-center gap-2 px-3 py-2.5 rounded-lg text-xs border" style={{ borderColor: "var(--card-border)", color: "var(--text-body)" }}><Icon name="upload" size={14} /> استيراد نسخة JSON</button>
          </div>
          <div className="text-[10px] leading-relaxed" style={{ color: "var(--text-muted)" }}>الاستيراد يدمج البيانات ويحدّث السجلات ذات المعرف نفسه.</div>
        </div>
        {tab === "dashboard" && (
          <Dashboard invoices={invoices} lowStock={lowStock} customerDebt={customerDebt} supplierDebt={supplierDebt} monthInvoices={monthInvoices} treasury={treasury} goInvoices={() => setTab("purchases")} />
        )}
        {tab === "purchases" && <InvoicesTab mode="purchase" invoices={invoices} inventory={inventory} suppliers={suppliers} customers={customers} treasury={treasury} upsert={upsert} remove={remove} />}
        {tab === "sales" && <InvoicesTab mode="sale" invoices={invoices} inventory={inventory} suppliers={suppliers} customers={customers} treasury={treasury} upsert={upsert} remove={remove} />}
        {tab === "cashflow" && <CashflowTab customers={customers} suppliers={suppliers} invoices={invoices} treasury={treasury} upsert={upsert} upsertBatch={upsertBatch} remove={remove} />}
        {tab === "treasury" && <TreasuryTab treasury={treasury} upsert={upsert} remove={remove} />}
        {tab === "expenses" && <DailyExpensesTab expenses={expenses} treasury={treasury} upsert={upsert} remove={remove} />}
        {tab === "accounts" && (
          <AccountsTab sub={accountsSub} setSub={setAccountsSub}
            customers={customers} suppliers={suppliers} workers={workers} invoices={invoices} treasury={treasury} upsert={upsert} remove={remove} />
        )}
        {tab === "inventory" && <InventoryTab inventory={inventory} inventoryMovements={inventoryMovements} invoices={invoices} upsert={upsert} remove={remove} />}
        {tab === "reports" && <MillReportsTab month={reportMonth} setMonth={setReportMonth} invoices={invoices} expenses={expenses} customers={customers} suppliers={suppliers} inventory={inventory} inventoryMovements={inventoryMovements} treasury={treasury} />}
      </main>
    </div>
  );
}

// ---------- Dashboard ----------
function Dashboard({ invoices, lowStock, customerDebt, supplierDebt, monthInvoices, treasury, goInvoices }) {
  const recentInvoices = [...invoices].sort((a, b) => (b.date || "").localeCompare(a.date || "")).slice(0, 5);
  const cashBalance = Number(treasury?.[0]?.openingBalance || 0) + (treasury?.[0]?.transactions || []).reduce((sum, tx) => sum + Number(tx.direction === "in" ? tx.amount : -tx.amount), 0);
  const purchasesTotal = invoices.filter((invoice) => invoice.direction === "purchase" && !invoice.isReturn).reduce((sum, invoice) => sum + Number(invoice.amount || 0), 0);
  const salesTotal = invoices.filter((invoice) => invoice.direction === "sale" && !invoice.isReturn).reduce((sum, invoice) => sum + Number(invoice.amount || 0), 0);

  return (
    <div className="flex flex-col gap-6">
      <div>
        <h1 className="text-xl font-bold" style={{ fontFamily: "'El Messiri', sans-serif", color: "var(--text-strong)" }}>لوحة التحكم</h1>
        <p className="text-sm mt-0.5" style={{ color: "var(--text-muted)" }}>نظرة عامة على شركة القصر اليوم</p>
      </div>

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <StatCard icon="wallet" label="رصيد الخزينة الرئيسية" value={fmt(cashBalance)} accent="#6E8F72" />
        <StatCard icon="truck" label="إجمالي قيمة فواتير المشتريات" value={fmt(purchasesTotal)} accent="#C69C4B" />
        <StatCard icon="receipt" label="إجمالي قيمة فواتير المبيعات" value={fmt(salesTotal)} accent="#8A6A32" />
        <StatCard icon="alert" label="مواد ناقصة بالمخزون" value={lowStock.length} accent="#A34632" />
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-3">
        <StatCard icon="users" label="مستحقات على العملاء" value={fmt(customerDebt)} accent="#A6673B" />
        <StatCard icon="briefcase" label="مستحقات الموردين" value={fmt(supplierDebt)} accent="#5C4A38" />
        <div className="rounded-2xl border p-4 lg:col-span-2" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
          <h3 className="font-semibold text-sm mb-3" style={{ color: "var(--text-body)" }}>تنبيهات المخزون</h3>
          {lowStock.length === 0 ? <EmptyState icon="package" title="المخزون ضمن الحد الطبيعي" /> : (
            <div className="flex flex-col gap-2">
              {lowStock.map((i) => (
                <div key={i.id} className="flex items-center justify-between rounded-xl px-3 py-2.5" style={{ background: "var(--warn-bg)" }}>
                  <div className="text-sm" style={{ color: "var(--text-body)" }}>{i.name}</div>
                  <div className="text-xs font-medium" style={{ color: "#A34632" }}>{fmt(i.quantity)} {i.unit} متبقٍ</div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>

      <div className="rounded-2xl border p-4" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
        <div className="flex items-center justify-between mb-3"><h3 className="font-semibold text-sm" style={{ color: "var(--text-body)" }}>أحدث الفواتير</h3><button onClick={goInvoices} className="text-xs" style={{ color: "var(--accent)" }}>عرض المشتريات</button></div>
        {recentInvoices.length === 0 ? <EmptyState icon="receipt" title="لا توجد فواتير مسجّلة بعد" /> : (
          <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
            {recentInvoices.map((inv) => (
              <div key={inv.id} className="flex items-center justify-between py-2.5" style={{ borderColor: "var(--divider)" }}>
                <div><div className="text-sm" style={{ color: "var(--text-body)" }}>{inv.contactName || inv.supplierName || inv.customerName || inv.type}</div><div className="text-xs" style={{ color: "var(--text-muted)" }}>{inv.isReturn ? "مرتجع " : ""}{inv.type} · {inv.date}</div></div>
                <div className="text-sm font-semibold" style={{ color: "var(--text-strong)" }}>{inv.isReturn ? "−" : ""}{fmt(inv.amount)}</div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- Projects ----------
function Projects({ projects, onOpen, onNew }) {
  const [query, setQuery] = useState("");
  const [statusFilter, setStatusFilter] = useState("الكل");
  const normalizedQuery = normalizeName(query);
  const filtered = projects.filter((p) => {
    const workerNames = (p.measurements || []).map((measurement) => measurement.workerName || "");
    const searchable = [p.customerName, p.location, ...workerNames].map(normalizeName);
    const matchQ = !normalizedQuery || searchable.some((value) => value.includes(normalizedQuery));
    const matchS = statusFilter === "الكل" || p.status === statusFilter;
    return matchQ && matchS;
  });
  return (
    <div className="flex flex-col gap-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div><h1 className="text-xl font-bold" style={{ fontFamily: "'El Messiri', sans-serif", color: "var(--text-strong)" }}>المشاريع</h1><p className="text-sm mt-0.5" style={{ color: "var(--text-muted)" }}>إدارة الزبائن، البضاعة المرسلة، والمكاييل</p></div>
        <PrimaryButton onClick={onNew}><Icon name="plus" size={16} /> مشروع جديد</PrimaryButton>
      </div>
      <div className="flex items-center gap-3 flex-wrap">
        <div className="relative flex-1 min-w-[180px]">
          <span className="absolute right-3 top-1/2 -translate-y-1/2" style={{ color: "var(--text-muted)" }}><Icon name="search" size={15} /></span>
          <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="بحث باسم الزبون أو الموقع أو العامل..." className="w-full rounded-lg border pr-9 pl-3 py-2 text-sm outline-none" style={{ background: "var(--input-bg)", borderColor: "var(--card-border)", color: "var(--text-strong)" }} />
        </div>
        <div className="flex gap-1.5 flex-wrap">
          {["الكل", ...STATUSES].map((s) => (
            <button key={s} onClick={() => setStatusFilter(s)} className="text-xs px-3 py-2 rounded-lg border transition" style={statusFilter === s ? { background: "var(--accent)", borderColor: "var(--accent)", color: "white" } : { background: "var(--card-bg)", borderColor: "var(--card-border)", color: "var(--text-body)" }}>{s}</button>
          ))}
        </div>
      </div>
      {filtered.length === 0 ? <EmptyState icon="factory" title="لا توجد مشاريع مطابقة" sub="أضف مشروعًا جديدًا للبدء" /> : (
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
          {filtered.map((p) => {
            const totalMeasured = (p.measurements || []).reduce((s, m) => s + Number(m.totalAmount || 0), 0);
            return (
              <button key={p.id} onClick={() => onOpen(p.id)} className="text-right rounded-2xl border p-4 hover:shadow-sm transition flex flex-col gap-3" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
                <div className="flex items-start justify-between">
                  <div><div className="font-semibold" style={{ color: "var(--text-strong)" }}>{p.customerName}</div><div className="text-xs flex items-center gap-1 mt-1" style={{ color: "var(--text-muted)" }}><Icon name="mappin" size={11} /> {p.location || "بدون موقع"}</div></div>
                  <Badge bg={STATUS_COLOR[p.status].bg} fg={STATUS_COLOR[p.status].fg}>{p.status}</Badge>
                </div>
                <div className="flex items-center justify-between text-xs pt-2 border-t" style={{ color: "var(--text-muted)", borderColor: "var(--divider)" }}><span>{p.productType}</span><span>{totalMeasured > 0 ? fmt(totalMeasured) + " إجمالي" : p.dateCreated}</span></div>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function CompanyBadge({ size = 36, variant = "default" }) {
  const bg = variant === "dark" ? "linear-gradient(135deg, #5d2c1e, #8c5b3a)" : "linear-gradient(135deg, #f3e4d6, #d7b99f)";
  return (
    <div className="flex items-center justify-center overflow-hidden rounded-xl" style={{ width: size, height: size, minWidth: size, background: bg, boxShadow: "inset 0 0 0 2px rgba(255,255,255,0.2)" }}>
      <img src={COMPANY_LOGO_PATH} alt="شعار شركة القصر" style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
    </div>
  );
}

function SearchablePicker({ items, value, onSelect, getLabel, getSearchText, placeholder, emptyText = "لا توجد نتائج مطابقة" }) {
  const [query, setQuery] = useState("");
  const [open, setOpen] = useState(false);
  const selected = items.find((item) => item.id === value);
  const normalizedQuery = normalizeName(query);
  const filtered = items.filter((item) => !normalizedQuery || normalizeName(getSearchText(item)).includes(normalizedQuery));

  return (
    <div className="relative">
      <TextInput
        value={open ? query : (selected ? getLabel(selected) : "")}
        placeholder={placeholder}
        onFocus={() => { setOpen(true); setQuery(""); }}
        onChange={(e) => { setQuery(e.target.value); setOpen(true); }}
        onBlur={() => window.setTimeout(() => setOpen(false), 150)}
      />
      {open && (
        <div className="absolute inset-x-0 top-full z-20 mt-1 max-h-56 overflow-y-auto rounded-lg border shadow-lg" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
          {filtered.length === 0 ? <div className="px-3 py-2 text-xs" style={{ color: "var(--text-muted)" }}>{emptyText}</div> : filtered.map((item) => (
            <button key={item.id} type="button" onMouseDown={(e) => e.preventDefault()} onClick={() => { onSelect(item.id); setQuery(""); setOpen(false); }} className="w-full px-3 py-2 text-right text-sm border-b last:border-b-0" style={{ color: "var(--text-body)", borderColor: "var(--divider)" }}>
              {getLabel(item)}
            </button>
          ))}
        </div>
      )}
      {selected && <button type="button" onClick={() => { onSelect(null); setQuery(""); setOpen(false); }} className="absolute left-2 top-1/2 -translate-y-1/2 text-xs" style={{ color: "var(--text-muted)" }}>مسح</button>}
    </div>
  );
}

function CustomerPicker({ customers, customerId, customerName, onSelect, onCreateNew }) {
  const [addingNew, setAddingNew] = useState(false);
  const [newName, setNewName] = useState("");
  const [newPhone, setNewPhone] = useState("");

  const confirmNew = () => {
    if (!newName.trim() || hasDuplicateName(customers, newName)) { notify("اسم العميل موجود مسبقًا أو غير صالح."); return; }
    const c = { id: uid(), name: newName.trim(), phone: newPhone.trim(), notes: "", transactions: [] };
    onCreateNew(c);
    setAddingNew(false);
  };

  return (
    <div className="flex flex-col gap-2">
      {!addingNew && <SearchablePicker items={customers} value={customerId} onSelect={onSelect} placeholder="ابحث باسم العميل أو الهاتف..." getLabel={(c) => c.name + (c.phone ? " — " + c.phone : "")} getSearchText={(c) => [c.name, c.phone].filter(Boolean).join(" ")} />}
      {!addingNew && <button type="button" onClick={() => { setAddingNew(true); setNewName(""); setNewPhone(""); }} className="text-xs self-start" style={{ color: "var(--accent)" }}>+ إضافة عميل جديد</button>}
      {addingNew && (
        <div className="rounded-lg border p-2.5 flex flex-col gap-2" style={{ borderColor: "var(--card-border)" }}>
          <TextInput placeholder="اسم العميل الجديد" value={newName} onChange={(e) => setNewName(e.target.value)} />
          <TextInput placeholder="رقم الهاتف (اختياري)" value={newPhone} onChange={(e) => setNewPhone(e.target.value)} />
          <div className="flex gap-2">
            <PrimaryButton onClick={confirmNew} disabled={!newName.trim()}><Icon name="plus" size={14} /> إضافة واختيار</PrimaryButton>
            <GhostButton onClick={() => setAddingNew(false)}>إلغاء</GhostButton>
          </div>
        </div>
      )}
      {!addingNew && customerName && !customerId && (
        <div className="text-xs" style={{ color: "var(--text-muted)" }}>هذا المشروع مرتبط باسم قديم غير مسجّل كعميل بعد: «{customerName}» — اختر عميلاً من القائمة أعلاه لربطه.</div>
      )}
    </div>
  );
}

function NewProjectModal({ onClose, onCreate, customers, upsert }) {
  const [customerId, setCustomerId] = useState("");
  const [phone, setPhone] = useState("");
  const [dateCreated, setDateCreated] = useState(todayISO());
  const [initialPayment, setInitialPayment] = useState("");
  const [initialPaymentDate, setInitialPaymentDate] = useState(todayISO());
  const [initialPaymentNote, setInitialPaymentNote] = useState("");
  const [location, setLocation] = useState("");
  const [productType, setProductType] = useState("قهوة");
  const [notes, setNotes] = useState("");
  const [createdCustomer, setCreatedCustomer] = useState(null);

  const handleCreateCustomer = (c) => { upsert("customers", c); setCreatedCustomer(c); setCustomerId(c.id); if (!phone) setPhone(c.phone || ""); };

  const submit = () => {
    const customer = customers.find((c) => c.id === customerId) || createdCustomer;
    if (!customer) return;
    if (initialPayment !== "" && !positiveNumber(initialPayment)) { notify("مبلغ الدفعة الأولى يجب أن يكون موجبًا."); return; }
    if (positiveNumber(initialPayment)) {
      if (!initialPaymentDate) { notify("اختر تاريخ الدفعة الأولى."); return; }
      if (!dateCreated) { notify("اختر تاريخ إنشاء المشروع."); return; }
      if (initialPaymentDate < dateCreated) { notify("لا يمكن أن تسبق الدفعة تاريخ إنشاء المشروع."); return; }
    }
    const payment = positiveNumber(initialPayment) ? { id: uid(), date: initialPaymentDate, amount: Number(initialPayment), description: initialPaymentNote.trim() || "دفعة عند إنشاء المشروع" } : null;
    onCreate({ id: uid(), customerId: customer.id, customerName: customer.name, phone: (phone.trim() || customer.phone || ""), location: location.trim(), productType, status: "جديد", dateCreated, notes: notes.trim(), items: [], measurements: [], payments: payment ? [payment] : [], completedAt: null });
  };
  return (
    <Modal title="مشروع جديد" onClose={onClose}>
      <div className="flex flex-col gap-3">
        <div><FieldLabel>العميل</FieldLabel><CustomerPicker customers={customers} customerId={customerId} onSelect={setCustomerId} onCreateNew={handleCreateCustomer} /></div>
        <div><FieldLabel>رقم هاتف خاص بهذا المشروع (اختياري)</FieldLabel><TextInput value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="اتركه فارغًا لاستخدام هاتف العميل" /></div>
        <div className="grid grid-cols-2 gap-3"><div><FieldLabel>تاريخ إنشاء المشروع</FieldLabel><TextInput type="date" value={dateCreated} onChange={(e) => setDateCreated(e.target.value)} /></div><div><FieldLabel>تاريخ الدفعة الأولى</FieldLabel><TextInput type="date" value={initialPaymentDate} onChange={(e) => setInitialPaymentDate(e.target.value)} /></div></div>
        <div><FieldLabel>الواصل من الزبون عند إنشاء المشروع (اختياري)</FieldLabel><TextInput type="number" value={initialPayment} onChange={(e) => setInitialPayment(e.target.value)} placeholder="اتركه فارغًا إذا لم يدفع" /></div>
        {positiveNumber(initialPayment) && <div><FieldLabel>ملاحظة الدفعة (اختياري)</FieldLabel><TextInput value={initialPaymentNote} onChange={(e) => setInitialPaymentNote(e.target.value)} /></div>}
        <div><FieldLabel>موقع المشروع</FieldLabel><TextInput value={location} onChange={(e) => setLocation(e.target.value)} placeholder="الحي / المنطقة" /></div>
        <div><FieldLabel>نوع المنتج المطلوب</FieldLabel><Select value={productType} onChange={(e) => setProductType(e.target.value)}>{PRODUCT_TYPES.map((t) => <option key={t}>{t}</option>)}</Select></div>
        <div><FieldLabel>ملاحظات (اختياري)</FieldLabel><textarea value={notes} onChange={(e) => setNotes(e.target.value)} rows={2} className="w-full rounded-lg border px-3 py-2 text-sm outline-none" style={{ background: "var(--input-bg)", borderColor: "var(--card-border)", color: "var(--text-strong)" }} /></div>
        <PrimaryButton onClick={submit} full disabled={!customerId}><Icon name="plus" size={16} /> إنشاء المشروع</PrimaryButton>
      </div>
    </Modal>
  );
}

function printAccountStatement(contact, transactions = [], label = "العميل", startDate = "", endDate = "") {
  const printWindow = window.open("", "_blank", "width=1000,height=800");
  if (!printWindow) { notify("يرجى السماح بالنوافذ المنبثقة لطباعة كشف الحساب."); return; }
  const escapeHtml = (value) => String(value ?? "").replace(/[&<>\"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[character]);
  const rows = [...transactions].filter((row) => (!startDate || (row.date || "") >= startDate) && (!endDate || (row.date || "") <= endDate)).sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  let runningDebit = 0;
  let runningCredit = 0;
  let runningBalance = 0;
  const totalDebit = rows.reduce((sum, row) => sum + (row.type === "debit" ? Number(row.amount || 0) : 0), 0);
  const totalCredit = rows.reduce((sum, row) => sum + (row.type === "credit" ? Number(row.amount || 0) : 0), 0);
  const finalBalance = totalDebit - totalCredit;
  const rowsHtml = rows.length ? rows.map((row, index) => {
    const debit = row.type === "debit" ? Number(row.amount || 0) : 0;
    const credit = row.type === "credit" ? Number(row.amount || 0) : 0;
    runningDebit += debit;
    runningCredit += credit;
    runningBalance += debit - credit;
    const kind = row.customerPayment ? "قبض" : row.supplierPayment ? "صرف" : row.invoiceDebt ? "فاتورة" : row.invoiceReturn ? "مرتجع" : row.type === "debit" ? "مدين" : "دائن";
    return `<tr><td>${index + 1}</td><td>${escapeHtml(row.id || "-")}</td><td>${escapeHtml(kind)}</td><td>${fmt(debit)}</td><td>${fmt(credit)}</td><td>${escapeHtml(row.date || "-")}</td><td>${fmt(runningDebit)}</td><td>${fmt(runningCredit)}</td><td>${fmt(runningBalance)}</td><td>${escapeHtml(row.note || "-")}</td></tr>`;
  }).join("") : `<tr><td colspan="10" style="text-align:center;padding:20px;color:#6b645b;">لا توجد حركات في هذه المدة</td></tr>`;
  const logoMarkup = `<img src="${COMPANY_LOGO_PATH}" alt="شعار شركة القصر" style="width:58px;height:58px;border-radius:16px;object-fit:cover;display:block" />`;
  const printHtml = `<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>كشف حساب ${escapeHtml(contact.name || label)}</title><style>body{font-family:Arial,sans-serif;margin:22px;color:#1f1b16;background:#fff}table{width:100%;border-collapse:collapse;border:1px solid #e3dbd0}th,td{border:1px solid #e3dbd0;padding:8px 6px;text-align:center;font-size:12px}th{background:#7a4423;color:#fff}tr:nth-child(even) td{background:#faf7f4}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:2px solid #7a4423;padding-bottom:12px;margin-bottom:16px}.logo{width:58px;height:58px;border-radius:16px;overflow:hidden}.meta{margin:10px 0}.meta .row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #d8cfc5}.totals{margin-top:14px;display:flex;justify-content:space-between;gap:10px;font-weight:700}.totals div{padding:8px 10px;border:1px solid #e3dbd0;border-radius:8px;background:#faf7f4}</style></head><body><div class="top"><div class="logo">${logoMarkup}</div><div><div style="font-size:26px;font-weight:800;color:#7a4423">شركة القصر</div><div style="font-size:12px;color:#6b645b">إدارة المحاسبة</div></div><div style="text-align:left"><div>كشف حساب</div><div style="font-weight:700">${escapeHtml(label === "موردون" ? "المورد" : "العميل")}</div></div></div><div class="meta"><div class="row"><span>الاسم</span><b>${escapeHtml(contact.name || "-")}</b></div><div class="row"><span>المدة</span><b>${escapeHtml(startDate || "-")} إلى ${escapeHtml(endDate || "-")}</b></div></div><table><thead><tr><th>#</th><th>رقم السند</th><th>النوع</th><th>مدين</th><th>دائن</th><th>التاريخ</th><th>رصيد المدين</th><th>رصيد الدائن</th><th>الرصيد</th><th>ملاحظات</th></tr></thead><tbody>${rowsHtml}</tbody></table><div class="totals"><div>إجمالي المدين: ${fmt(totalDebit)}</div><div>إجمالي الدائن: ${fmt(totalCredit)}</div><div>الرصيد: ${fmt(finalBalance)}</div></div></body></html>`;
  printWindow.document.open();
  printWindow.document.write(printHtml);
  printWindow.document.close();
  const triggerPrint = () => { try { printWindow.focus(); printWindow.print(); } catch (error) { console.error("Statement print failed:", error); } };
  printWindow.onload = triggerPrint;
  window.setTimeout(triggerPrint, 700);
}

function WaiveInline({ remaining, waived, onApply, onReset }) {
  const [amount, setAmount] = useState("");
  const [note, setNote] = useState("");
  if (remaining <= 0 && waived <= 0) return null;
  const apply = () => {
    if (!positiveNumber(amount) || Number(amount) > remaining) { notify("أدخل مبلغًا موجبًا لا يتجاوز الباقي."); return; }
    onApply(Number(amount), note.trim());
    setAmount(""); setNote("");
  };
  return <div className="rounded-xl border p-3 flex flex-col gap-2" style={{ borderColor: "var(--card-border)" }}><div className="text-sm font-medium" style={{ color: "var(--text-body)" }}>التغاضي عن جزء من المبلغ</div>{remaining > 0 && <><div className="flex gap-2"><TextInput type="number" placeholder={`المبلغ (الباقي ${fmt(remaining)})`} value={amount} onChange={(e) => setAmount(e.target.value)} /><TextInput placeholder="سبب (اختياري)" value={note} onChange={(e) => setNote(e.target.value)} /></div><div className="flex gap-2 flex-wrap"><GhostButton onClick={apply}>تغاضي عن المبلغ</GhostButton><GhostButton onClick={() => setAmount(String(remaining))}>كامل الباقي</GhostButton></div></>}{waived > 0 && <div className="flex items-center justify-between text-xs" style={{ color: "var(--text-muted)" }}><span>إجمالي المتغاضى عنه: {fmt(waived)}</span><button onClick={onReset} style={{ color: "#A34632" }}>إلغاء التغاضي</button></div>}</div>;
}

function ProjectDetail({ project, onClose, onSave, onDelete, onAddPayment, customers, upsertCustomer, income = [] }) {
  const [sub, setSub] = useState("info");
  const [local, setLocal] = useState(project);
  const [confirmDelete, setConfirmDelete] = useState(false);
  useEffect(() => setLocal(project), [project.id]);

  const sm = getProjectSummary(local, income);
  const projectPayments = getProjectPayments(local, income);

    const next = { ...local, payments: [payment, ...(local.payments || [])] };
    setLocal(next);
    onAddPayment(next, payment);

  const waive = (amount, note) => update({ waivedAmount: Math.min(sm.cost, Number(local.waivedAmount || 0) + amount), waiveNote: note || local.waiveNote || "" });
  const projectStatusLabel = sm.remaining > 0 ? "الباقي" : sm.surplus > 0 ? "رصيد للزبون" : sm.advance > 0 ? "مقدّم زائد" : "الحالة";
  const projectStatusValue = sm.remaining > 0 ? fmt(sm.remaining) : sm.surplus > 0 ? fmt(sm.surplus) : sm.advance > 0 ? fmt(sm.advance) : sm.settled ? "خالص" : "بانتظار الكيل";

  const projectStatusBg = sm.remaining > 0 ? "var(--warn-bg)" : "var(--good-bg)";

  return (

function RecordIncomeInline({ project, onAdd }) {
  const [amount, setAmount] = useState("");
  const [note, setNote] = useState("");
  const submit = () => {
    if (!positiveNumber(amount)) { notify("أدخل مبلغًا موجبًا."); return; }
    onAdd({ id: uid(), date: todayISO(), amount: roundMoney(Number(amount)), description: note.trim() || "دفعة من الزبون" });
    setAmount(""); setNote("");
  };
  return (
    <div className="rounded-xl border p-3 flex flex-col gap-2" style={{ borderColor: "var(--card-border)" }}>
      <div className="text-sm font-medium flex items-center gap-1.5" style={{ color: "var(--text-body)" }}><Icon name="wallet" size={14} /> تسجيل وارد من الزبون</div>
      <div className="flex gap-2"><TextInput type="number" placeholder="المبلغ المستلم" value={amount} onChange={(e) => setAmount(e.target.value)} /><TextInput placeholder="ملاحظة (اختياري)" value={note} onChange={(e) => setNote(e.target.value)} /></div>
      <GhostButton onClick={submit}><Icon name="plus" size={14} /> إضافة الدفعة</GhostButton>

}

    if (!name.trim() || !positiveNumber(quantity)) { notify("أدخل كمية موجبة."); return; }
    const entry = { id: uid(), date: todayISO(), direction, name: name.trim(), quantity: Number(quantity), unit };
    const patch = { items: [entry, ...items] };

    setName(""); setQuantity("");
  };
  const removeItem = (id) => { update({ items: items.filter((i) => i.id !== id) }); setPendingDelete(null); };
  const DIR_ICON = { "إرسال": { icon: "truck", fg: "#4B6350" }, "مرتجع": { icon: "rotate", fg: "#A34632" }, "إضافة": { icon: "plus", fg: "#8A6A32" } };

    <div className="flex flex-col gap-4">

          <Select value={unit} onChange={(e) => setUnit(e.target.value)}><option>كيس</option><option>كجم</option><option>طن</option><option>لتر</option><option>م</option><option>قطعة</option></Select>

      </div>
      {items.length === 0 ? <EmptyState icon="truck" title="لا توجد حركات بضاعة مسجّلة" /> : (
        <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>

                <div className="flex items-center gap-3 shrink-0">

function ProjectMeasurements({ project, update }) {
  const [workerName, setWorkerName] = useState("");
  const [entries, setEntries] = useState([{ label: "صنف", quantity: "", unitPrice: "", total: "" }]);
  const [pendingDelete, setPendingDelete] = useState(null);
  const measurements = project.measurements || [];
  const setEntry = (idx, patch) => setEntries((prev) => prev.map((e, i) => { if (i !== idx) return e; const next = { ...e, ...patch }; if (next.quantity && next.unitPrice) next.total = String(Number(next.quantity) * Number(next.unitPrice)); return next; }));
  const addRow = () => setEntries((prev) => [...prev, { label: "", quantity: "", unitPrice: "", total: "" }]);
  const removeRow = (idx) => setEntries((prev) => prev.filter((_, i) => i !== idx));
  const sum = entries.reduce((s, e) => s + Number(e.total || 0), 0);
  const submit = () => {
    if (!workerName.trim()) { notify("أدخل اسم العامل."); return; }
    const cleanEntries = entries.filter((e) => e.label.trim() && positiveNumber(e.total) && nonNegativeNumber(e.quantity || 0) && nonNegativeNumber(e.unitPrice || 0)).map((e) => ({ ...e, quantity: Number(e.quantity || 0), unitPrice: Number(e.unitPrice || 0), total: Number(e.total) }));
    if (cleanEntries.length === 0) { notify("أدخل بنود قياس صحيحة وبقيم غير سالبة."); return; }
    const record = { id: uid(), date: todayISO(), workerName: workerName.trim(), entries: cleanEntries, totalAmount: cleanEntries.reduce((s, e) => s + e.total, 0) };
    const patch = { measurements: [record, ...measurements] };
    if (project.status !== "مكتمل") { patch.status = "مكتمل"; patch.completedAt = project.completedAt || todayISO(); }
    update(patch);
    setWorkerName(""); setEntries([{ label: "صنف", quantity: "", unitPrice: "", total: "" }]);
  };
  const removeMeasurement = (id) => { update({ measurements: measurements.filter((m) => m.id !== id) }); setPendingDelete(null); };
  return (
    <div className="flex flex-col gap-4">
      <div className="rounded-xl border p-3 flex flex-col gap-3" style={{ borderColor: "var(--card-border)" }}>
        <div><FieldLabel>اسم العامل (الذي كال العمل)</FieldLabel><TextInput value={workerName} onChange={(e) => setWorkerName(e.target.value)} placeholder="اسم العامل" /></div>
        <div className="flex flex-col gap-2">
          {entries.map((e, idx) => (
            <div key={idx} className="grid grid-cols-2 sm:grid-cols-12 gap-1.5 items-center">
              <div className="col-span-2 sm:col-span-3 min-w-0"><TextInput list="measure-suggestions" placeholder="البند" value={e.label} onChange={(ev) => setEntry(idx, { label: ev.target.value })} /></div>
              <div className="col-span-1 sm:col-span-3 min-w-0"><TextInput type="number" placeholder="الكمية (م)" value={e.quantity} onChange={(ev) => setEntry(idx, { quantity: ev.target.value })} /></div>
              <div className="col-span-1 sm:col-span-3 min-w-0"><TextInput type="number" placeholder="سعر الوحدة" value={e.unitPrice} onChange={(ev) => setEntry(idx, { unitPrice: ev.target.value })} /></div>
              <div className="col-span-1 sm:col-span-2 min-w-0"><TextInput type="number" placeholder="المجموع" value={e.total} onChange={(ev) => setEntry(idx, { total: ev.target.value })} /></div>
              <div className="col-span-2 sm:col-span-1 flex justify-center">{entries.length > 1 && <button onClick={() => removeRow(idx)} style={{ color: "var(--text-muted)" }}><Icon name="x" size={14} /></button>}</div>
            </div>
          ))}
          <datalist id="measure-suggestions">{["بن أخضر", "بن محمص", "تعبئة", "عبوات"].map((s) => <option key={s} value={s} />)}</datalist>
          <button onClick={addRow} className="text-xs flex items-center gap-1 self-start" style={{ color: "var(--accent)" }}><Icon name="plus" size={12} /> إضافة بند</button>
        </div>
        <div className="flex items-center justify-between border-t pt-2" style={{ borderColor: "var(--divider)" }}><span className="text-sm" style={{ color: "var(--text-muted)" }}>مجموع هذا الكيل</span><span className="font-bold" style={{ color: "var(--text-strong)" }}>{fmt(sum)}</span></div>
        <PrimaryButton onClick={submit} full><Icon name="plus" size={16} /> حفظ الكيل</PrimaryButton>
      </div>
      {measurements.length === 0 ? <EmptyState icon="ruler" title="لا توجد مكاييل مسجّلة بعد" /> : (
        <div className="flex flex-col gap-2">
          {measurements.map((m) => (
            <div key={m.id} className="rounded-xl border p-3" style={{ borderColor: "var(--card-border)" }}>
              <div className="flex items-center justify-between mb-2">
                <div className="text-sm font-medium flex items-center gap-1.5" style={{ color: "var(--text-body)" }}><Icon name="user" size={13} /> {m.workerName}<span style={{ color: "var(--text-muted)" }}>·</span><span className="font-normal flex items-center gap-1" style={{ color: "var(--text-muted)" }}><Icon name="calendar" size={11} /> {m.date}</span></div>
                {pendingDelete === m.id ? <ConfirmInline onConfirm={() => removeMeasurement(m.id)} onCancel={() => setPendingDelete(null)} /> : <button onClick={() => setPendingDelete(m.id)} style={{ color: "var(--text-muted)" }}><Icon name="trash" size={14} /></button>}
              </div>
              <div className="flex flex-col gap-1">{m.entries.map((e, i) => <div key={i} className="flex items-center justify-between text-xs" style={{ color: "var(--text-muted)" }}><span>{e.label} {e.quantity ? `(${fmt(e.quantity)} × ${fmt(e.unitPrice)})` : ""}</span><span className="font-medium" style={{ color: "var(--text-body)" }}>{fmt(e.total)}</span></div>)}</div>
              <div className="flex items-center justify-between border-t mt-2 pt-2 text-sm" style={{ borderColor: "var(--divider)" }}><span style={{ color: "var(--text-muted)" }}>المجموع</span><span className="font-bold" style={{ color: "var(--text-strong)" }}>{fmt(m.totalAmount)}</span></div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
