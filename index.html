// ---------- Invoices (with line items) ----------
function InvoicesTab({ mode, invoices, inventory, suppliers, customers, treasury, upsert, remove }) {
  const [showAdd, setShowAdd] = useState(false);
  const [creatingReturn, setCreatingReturn] = useState(false);
  const [editingInvoice, setEditingInvoice] = useState(null);
  const [contactQuery, setContactQuery] = useState("");
  const [invoiceNumberQuery, setInvoiceNumberQuery] = useState("");
  const [pendingDelete, setPendingDelete] = useState(null);
  const [expanded, setExpanded] = useState(null);

  const normalizedContactQuery = normalizeName(contactQuery);
  const normalizedInvoiceNumberQuery = normalizeName(invoiceNumberQuery);
  const filtered = invoices.filter((i) => {
    const matchContact = !normalizedContactQuery || normalizeName(i.contactName || i.supplierName || i.customerName).includes(normalizedContactQuery);
    const matchInvoiceNumber = !normalizedInvoiceNumberQuery || normalizeName(i.invoiceNumber).includes(normalizedInvoiceNumberQuery);
    return matchContact && matchInvoiceNumber && (i.direction || (mode === "purchase" ? "purchase" : "sale")) === mode;
  });
  const total = filtered.reduce((s, i) => s + Number(i.amount || 0) * (i.isReturn ? -1 : 1), 0);
  const sorted = [...filtered].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const deleteInvoice = (invoice) => {
    if (invoices.some((record) => record.isReturn && record.returnForInvoiceId === invoice.id)) {
      notify("لا يمكن حذف الفاتورة الأصلية قبل حذف أو معالجة مرتجعاتها.");
      return false;
    }
    const linkedCustomerPayments = customers.find((item) => item.id === (invoice.customerId || invoice.contactId))?.transactions || [];
    const linkedSupplierPayments = suppliers.find((item) => item.id === (invoice.supplierId || invoice.contactId))?.transactions || [];
    if (linkedCustomerPayments.some((transaction) => transaction.customerPayment && transaction.id !== "invoice-payment-" + invoice.id && (transaction.invoiceId === invoice.id || (transaction.allocations || []).some((allocation) => allocation.invoiceId === invoice.id)))
      || linkedSupplierPayments.some((transaction) => (transaction.supplierPayment || transaction.supplierReceipt) && transaction.id !== "invoice-payment-" + invoice.id && (transaction.allocations || []).some((allocation) => allocation.invoiceId === invoice.id))) {
      notify("لا يمكن حذف الفاتورة قبل حذف دفعاتها المرتبطة.");
      return false;
    }
    const stockChanges = new Map();
    const inventoryValueChanges = new Map();
    (invoice.items || []).forEach((line) => {
      const item = inventory.find((entry) => entry.id === line.inventoryId || (!line.inventoryId && normalizeName(entry.name) === normalizeName(line.name)));
      if (!item) return;
      const delta = (mode === "purchase" ? -Number(line.quantity || 0) : Number(line.quantity || 0)) * (invoice.isReturn ? -1 : 1);
      stockChanges.set(item.id, (stockChanges.get(item.id) || 0) + delta);
      const cost = Number(line.costUnitPrice ?? (mode === "purchase" ? line.unitPrice : item.averageCost) ?? 0);
      inventoryValueChanges.set(item.id, (inventoryValueChanges.get(item.id) || 0) - Number(line.quantity || 0) * cost * (mode === "purchase" ? 1 : -1) * (invoice.isReturn ? -1 : 1));
    });
    for (const [itemId, delta] of stockChanges) {
      const item = inventory.find((entry) => entry.id === itemId);
      if (Number(item.quantity || 0) + delta < 0) {
        notify(`لا يمكن حذف الفاتورة: مخزون «${item.name}» سيصبح سالبًا.`);
        return false;
      }
    }
    remove("invoices", invoice.id);
    for (const [itemId, delta] of stockChanges) {
      const item = inventory.find((entry) => entry.id === itemId);
      const quantity = roundMoney(Number(item.quantity || 0) + delta);
      const inventoryValue = Number(item.quantity || 0) * Number(item.averageCost || 0) + (inventoryValueChanges.get(itemId) || 0);
      upsert("inventory", { ...item, quantity, averageCost: quantity > 0 ? roundMoney(Math.max(0, inventoryValue) / quantity) : 0 });
      upsert("inventoryMovements", { id: uid(), date: todayISO(), itemId: item.id, itemName: item.name, direction: delta > 0 ? "in" : "out", quantity: Math.abs(delta), source: "invoice-delete", invoiceId: invoice.id, note: "عكس حذف الفاتورة" });
    }
    const currentTreasury = treasury?.[0];
    if (currentTreasury) upsert("treasury", { ...currentTreasury, transactions: (currentTreasury.transactions || []).filter((tx) => tx.invoiceId !== invoice.id) });
    const supplier = suppliers.find((item) => item.id === invoice.supplierId);
    if (supplier) upsert("suppliers", { ...supplier, transactions: (supplier.transactions || []).filter((t) => t.invoiceId !== invoice.id && t.id !== invoice.debtTransactionId && t.id !== invoice.contactTransactionId && !(t.date === invoice.date && Number(t.amount) === Number(invoice.amount) && String(t.note || "").includes("فاتورة شراء"))) });
    const customer = customers.find((item) => item.id === invoice.customerId);
    if (customer) upsert("customers", { ...customer, transactions: (customer.transactions || []).filter((t) => t.invoiceId !== invoice.id && t.id !== invoice.contactTransactionId && !(t.date === invoice.date && Number(t.amount) === Number(invoice.amount) && String(t.note || "").includes("فاتورة بيع"))) });
  };
  const syncSupplierDebt = (supplierId, transactionId, transaction) => {
    if (!supplierId || !transactionId) return;
    const supplier = suppliers.find((s) => s.id === supplierId);
    if (supplier) upsert("suppliers", upsertSupplierDebt(supplier, transaction));
  };
  const saveInvoice = (invoice) => {
    const previous = editingInvoice;
    const currentTreasury = treasury?.[0] || { id: "main", openingBalance: 0, transactions: [] };
    const paidAmount = Math.min(Number(invoice.amount || 0), Math.max(0, Number(invoice.paidAmount || 0)));
    const laterPaidAmount = getInvoiceLaterPaymentsAmount(invoice, customers, suppliers);
    const initialPaidAmount = Math.min(Number(invoice.amount || 0), Math.max(0, Number(invoice.initialPaidAmount ?? (paidAmount - laterPaidAmount))));
    const balanceWithoutInvoiceCash = Number(currentTreasury.openingBalance || 0) + (currentTreasury.transactions || []).filter((tx) => !(tx.invoiceId === invoice.id && (tx.source === "invoice" || tx.source === "invoice-return"))).reduce((sum, tx) => sum + Number(tx.direction === "in" ? tx.amount : -tx.amount), 0);
    const cashSign = (mode === "purchase" ? -1 : 1) * (invoice.isReturn ? -1 : 1);
    if (balanceWithoutInvoiceCash + cashSign * initialPaidAmount < 0) { notify("لا يمكن تسجيل الدفعة: رصيد الخزينة لا يكفي."); return false; }
    const previousItems = previous?.items || [];
    const nextItems = invoice.items || [];
    const stockChanges = new Map();
    const inventoryValueChanges = new Map();
    const addStockChange = (line, multiplier) => {
      const item = inventory.find((entry) => entry.id === line.inventoryId || (!line.inventoryId && normalizeName(entry.name) === normalizeName(line.name)));
      if (!item) return;
      stockChanges.set(item.id, (stockChanges.get(item.id) || 0) + multiplier * Number(line.quantity || 0) * (mode === "purchase" ? 1 : -1) * (invoice.isReturn ? -1 : 1));
      const cost = Number(line.costUnitPrice ?? (mode === "purchase" ? line.unitPrice : item.averageCost) ?? 0);
      inventoryValueChanges.set(item.id, (inventoryValueChanges.get(item.id) || 0) + multiplier * Number(line.quantity || 0) * cost * (mode === "purchase" ? 1 : -1) * (invoice.isReturn ? -1 : 1));
    };
    previousItems.forEach((item) => addStockChange(item, -1));
    nextItems.forEach((item) => addStockChange(item, 1));
    for (const [itemId, delta] of stockChanges) {
      const item = inventory.find((entry) => entry.id === itemId);
      if (Number(item.quantity || 0) + delta < 0) {
        notify(`لا يمكن حفظ الفاتورة: مخزون «${item.name}» سيصبح سالبًا.`);
        return;
      }
    }
    for (const [itemId, delta] of stockChanges) {
      const item = inventory.find((entry) => entry.id === itemId);
      const valueChange = inventoryValueChanges.get(itemId) || 0;
      if (!delta && !valueChange) continue;
      const quantity = roundMoney(Number(item.quantity || 0) + delta);
      const inventoryValue = Number(item.quantity || 0) * Number(item.averageCost || 0) + valueChange;
      upsert("inventory", { ...item, quantity, averageCost: quantity > 0 ? roundMoney(Math.max(0, inventoryValue) / quantity) : 0 });
      if (delta) upsert("inventoryMovements", { id: uid(), date: invoice.date, itemId: item.id, itemName: item.name, direction: delta > 0 ? "in" : "out", quantity: Math.abs(delta), source: invoice.isReturn ? "invoice-return" : "invoice", invoiceId: invoice.id, note: invoice.isReturn ? "مرتجع فاتورة" : mode === "purchase" ? "فاتورة شراء" : "فاتورة بيع" });
    }
    const previousCash = (currentTreasury.transactions || []).filter((tx) => !(tx.invoiceId === invoice.id && (tx.source === "invoice" || tx.source === "invoice-return")));
    const cashDirection = mode === "purchase" ? "out" : "in";
    const effectiveCashDirection = invoice.isReturn ? (cashDirection === "in" ? "out" : "in") : cashDirection;
    const treasuryTransactions = initialPaidAmount > 0 ? [{ id: "invoice-payment-" + invoice.id, date: invoice.date, direction: effectiveCashDirection, amount: initialPaidAmount, source: invoice.isReturn ? "invoice-return" : "invoice", invoiceId: invoice.id, note: invoice.isReturn ? "تسوية نقدية لمرتجع" : mode === "purchase" ? "دفعة فاتورة شراء" : "دفعة فاتورة بيع" }, ...previousCash] : previousCash;
    upsert("treasury", { ...currentTreasury, transactions: treasuryTransactions });
    if (mode === "sale" && invoice.contactId) {
      const customerIds = [...new Set([previous?.contactId, invoice.contactId].filter(Boolean))];
      customerIds.forEach((customerId) => {
        const customer = customers.find((item) => item.id === customerId);
        if (!customer) return;
        const isLegacyInvoiceMovement = (transaction) => previous && transaction.date === previous.date && Number(transaction.amount) === Number(previous.amount) && String(transaction.note || "").includes("فاتورة بيع");
        const recordedPaidAmount = (customer.transactions || []).filter((transaction) => transaction.customerPayment).reduce((sum, transaction) => sum + (Array.isArray(transaction.allocations) && transaction.allocations.length ? transaction.allocations.filter((allocation) => allocation.invoiceId === invoice.id).reduce((allocationSum, allocation) => allocationSum + Number(allocation.amount || 0), 0) : transaction.invoiceId === invoice.id ? Number(transaction.amount || 0) : 0), 0);
        const unrecordedPayment = Math.max(0, paidAmount - recordedPaidAmount);
        const remaining = (customer.transactions || []).filter((transaction) => transaction.id !== invoice.contactTransactionId && !isLegacyInvoiceMovement(transaction) && !(transaction.invoiceId === invoice.id && (transaction.invoiceDebt || transaction.invoiceReturn)));
        const invoiceTransactions = customerId === invoice.contactId
          ? invoice.isReturn
            ? [
                ...(paidAmount > 0 ? [{ id: "invoice-return-refund-" + invoice.id, invoiceId: invoice.id, invoiceReturn: true, date: invoice.date, type: "debit", amount: paidAmount, note: "مبلغ معاد نقدًا عن مرتجع" }] : []),
                { id: "invoice-return-" + invoice.id, invoiceId: invoice.id, invoiceReturn: true, date: invoice.date, type: "credit", amount: Number(invoice.amount), note: "مرتجع مبيعات" },
              ]
            : [
                ...(unrecordedPayment > 0 ? [{ id: "invoice-payment-" + invoice.id, invoiceId: invoice.id, customerPayment: true, date: invoice.date, type: "credit", amount: unrecordedPayment, note: "دفعة عند إصدار الفاتورة" }] : []),
                { id: invoice.contactTransactionId, invoiceId: invoice.id, invoiceDebt: true, date: invoice.date, type: "debit", amount: Number(invoice.amount), note: "فاتورة بيع" },
              ]
          : [];
        const nextTransactions = [...invoiceTransactions, ...remaining];
        upsert("customers", { ...customer, transactions: nextTransactions });
      });
    }
    upsert("invoices", invoice);
    if (mode === "purchase") {
      const supplierIds = [...new Set([previous?.contactId || previous?.supplierId, invoice.contactId].filter(Boolean))];
      supplierIds.forEach((supplierId) => {
        const supplier = suppliers.find((item) => item.id === supplierId);
        if (!supplier) return;
        const recordedPaidAmount = (supplier.transactions || []).filter((transaction) => transaction.supplierPayment || transaction.supplierReceipt).reduce((sum, transaction) => sum + (transaction.allocations || []).filter((allocation) => allocation.invoiceId === invoice.id).reduce((allocationSum, allocation) => allocationSum + Number(allocation.amount || 0), 0), 0);
        const unrecordedPayment = Math.max(0, paidAmount - recordedPaidAmount);
        const remaining = (supplier.transactions || []).filter((transaction) => transaction.id !== (previous?.debtTransactionId || invoice.debtTransactionId) && transaction.id !== previous?.contactTransactionId && !(transaction.invoiceId === invoice.id && (transaction.invoiceDebt || transaction.invoiceReturn)));
        if (supplierId === invoice.contactId && invoice.isReturn) {
          if (paidAmount > 0) remaining.unshift({ id: "invoice-return-refund-" + invoice.id, invoiceId: invoice.id, invoiceReturn: true, date: invoice.date, type: "debit", amount: paidAmount, note: "مبلغ مستلم نقدًا عن مرتجع" });
          remaining.unshift({ id: "invoice-return-" + invoice.id, invoiceId: invoice.id, invoiceReturn: true, date: invoice.date, type: "credit", amount: invoice.amount, note: "مرتجع مشتريات" });
        } else if (supplierId === invoice.contactId) {
          if (unrecordedPayment > 0) remaining.unshift({ id: "invoice-payment-" + invoice.id, invoiceId: invoice.id, supplierPayment: true, date: invoice.date, type: "credit", amount: unrecordedPayment, note: "دفعة عند إصدار الفاتورة", allocations: [{ invoiceId: invoice.id, amount: unrecordedPayment }] });
          remaining.unshift({ id: invoice.debtTransactionId || invoice.contactTransactionId, invoiceId: invoice.id, invoiceDebt: true, date: invoice.date, type: "debit", amount: invoice.amount, note: "فاتورة شراء" });
        }
        upsert("suppliers", { ...supplier, transactions: remaining });
      });
    }
    setEditingInvoice(null);
    return true;
  };

  return (
    <div className="flex flex-col gap-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div><h1 className="text-xl font-bold" style={{ fontFamily: "'El Messiri', sans-serif", color: "var(--text-strong)" }}>{mode === "purchase" ? "فواتير المشتريات" : "فواتير المبيعات"}</h1><p className="text-sm mt-0.5" style={{ color: "var(--text-muted)" }}>{mode === "purchase" ? "فواتير الموردين والبنود الداخلة إلى المخزن" : "فواتير العملاء والبنود الخارجة من المخزن"}</p></div>
        <div className="flex gap-2"><GhostButton onClick={() => { setCreatingReturn(true); setShowAdd(true); }}><Icon name="rotate" size={15} /> مرتجع {mode === "purchase" ? "شراء" : "بيع"}</GhostButton><PrimaryButton onClick={() => { setCreatingReturn(false); setShowAdd(true); }}><Icon name="plus" size={16} /> فاتورة {mode === "purchase" ? "شراء" : "بيع"}</PrimaryButton></div>
      </div>
      <div className="flex items-center gap-3 flex-wrap">
        <div className="relative min-w-[180px] flex-1"><span className="absolute right-3 top-1/2 -translate-y-1/2" style={{ color: "var(--text-muted)" }}><Icon name="search" size={15} /></span><TextInput value={contactQuery} onChange={(e) => setContactQuery(e.target.value)} placeholder={`بحث باسم ${mode === "purchase" ? "المورد" : "العميل"}...`} className="pr-9" /></div>
        <div className="relative min-w-[150px] flex-1"><span className="absolute right-3 top-1/2 -translate-y-1/2" style={{ color: "var(--text-muted)" }}>#</span><TextInput value={invoiceNumberQuery} onChange={(e) => setInvoiceNumberQuery(e.target.value)} placeholder="بحث برقم الفاتورة..." className="pr-8" /></div>
        <div className="mr-auto rounded-lg px-4 py-2 text-sm" style={{ background: "var(--divider)" }}><span className="ml-1" style={{ color: "var(--text-muted)" }}>الإجمالي:</span><span className="font-bold" style={{ color: "var(--text-strong)" }}>{fmt(total)}</span></div>
      </div>
      {sorted.length === 0 ? <EmptyState icon="receipt" title="لا توجد فواتير" sub="أضف أول فاتورة لتبدأ" /> : (
        <div className="rounded-2xl border overflow-hidden" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
          <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
            {sorted.map((inv) => (
              <div key={inv.id} style={{ borderColor: "var(--divider)" }}>
                <button onClick={() => setExpanded(expanded === inv.id ? null : inv.id)} className="w-full flex items-center justify-between px-4 py-3 gap-2 text-right">
                  <div className="min-w-0">
                    <div className="text-sm font-medium truncate flex items-center gap-1.5" style={{ color: "var(--text-body)" }}>
                      {inv.contactName || inv.supplierName || inv.customerName || "بدون اسم"} {inv.invoiceNumber && <span className="text-xs font-normal" style={{ color: "var(--text-muted)" }}>#{inv.invoiceNumber}</span>}
                    </div>
                    <div className="text-xs flex items-center gap-1.5 mt-0.5 flex-wrap" style={{ color: "var(--text-muted)" }}>
                      {inv.isReturn && <Badge bg="var(--warn-bg)" fg="#A34632">مرتجع</Badge>}
                      {!inv.isReturn && <Badge bg={getInvoicePaymentStatus(inv, invoices) === "paid" ? "var(--good-bg)" : "var(--warn-bg)"} fg={getInvoicePaymentStatus(inv, invoices) === "paid" ? "#4B6350" : "#A34632"}>{getInvoicePaymentStatus(inv, invoices) === "paid" ? "مسددة" : getInvoicePaymentStatus(inv, invoices) === "partial" ? "جزئية" : "غير مسددة"}</Badge>}
                      {inv.date}
                      {(inv.items || []).length > 0 && <span>· {inv.items.length} بند</span>}
                    </div>
                  </div>
                  <span className="font-semibold shrink-0" style={{ color: "var(--text-strong)" }}>{fmt(inv.amount)}</span>
                </button>
                {expanded === inv.id && (
                  <div className="px-4 pb-3 flex flex-col gap-2">
                    {inv.description && <div className="text-xs" style={{ color: "var(--text-muted)" }}>{inv.description}</div>}
                    {Number(inv.discount || 0) > 0 && <div className="text-xs" style={{ color: "var(--text-muted)" }}>خصم: {fmt(inv.discount)}</div>}
                    {!inv.isReturn && <div className="text-xs" style={{ color: "var(--text-muted)" }}>المسدد: {fmt(getInvoicePaidAmount(inv))} · المتبقي بعد المرتجعات: {fmt(getInvoiceOutstanding(inv, invoices))}</div>}
                    {inv.isReturn && <div className="text-xs" style={{ color: "var(--text-muted)" }}>مرتجع للفاتورة #{invoices.find((item) => item.id === inv.returnForInvoiceId)?.invoiceNumber || inv.returnForInvoiceId} · النقدي المسوى: {fmt(inv.paidAmount || 0)}</div>}
                    {(inv.items || []).length > 0 && (
                      <div className="rounded-lg p-2.5 flex flex-col gap-1" style={{ background: "var(--divider)" }}>
                        {inv.items.map((it, idx) => (
                          <div key={idx} className="flex items-center justify-between text-xs" style={{ color: "var(--text-body)" }}>
                            <span>{it.name} {it.quantity ? `(${fmt(it.quantity)} ${it.unit || ""} × ${fmt(it.unitPrice)})` : ""}</span>
                            <span className="font-medium">{fmt(it.total)}</span>
                          </div>
                        ))}
                      </div>
                    )}
                    <div className="flex justify-end">
                      {pendingDelete === inv.id ? <ConfirmInline onConfirm={() => { deleteInvoice(inv); setPendingDelete(null); }} onCancel={() => setPendingDelete(null)} /> : <div className="flex items-center gap-3">{mode === "sale" && <button onClick={() => printInvoiceDocument(inv, invoices)} className="text-xs" style={{ color: "var(--text-body)" }}>طباعة الفاتورة</button>}<button onClick={() => setEditingInvoice(inv)} className="text-xs" style={{ color: "var(--accent)" }}>تعديل الفاتورة</button><button onClick={() => setPendingDelete(inv.id)} className="text-xs flex items-center gap-1" style={{ color: "#A34632" }}><Icon name="trash" size={13} /> حذف الفاتورة</button></div>}
                    </div>
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      )}
      {showAdd && <Modal title={creatingReturn ? `مرتجع ${mode === "purchase" ? "شراء" : "بيع"}` : `فاتورة ${mode === "purchase" ? "شراء" : "بيع"}`} onClose={() => setShowAdd(false)} wide><AddInvoiceForm mode={mode} inventory={inventory} invoices={invoices} contacts={mode === "purchase" ? suppliers : customers} customers={customers} suppliers={suppliers} upsert={upsert} startAsReturn={creatingReturn} onAdd={(inv) => { if (saveInvoice(inv)) setShowAdd(false); }} /></Modal>}
      {editingInvoice && <Modal title={editingInvoice.isReturn ? "تعديل المرتجع" : "تعديل الفاتورة"} onClose={() => setEditingInvoice(null)} wide><AddInvoiceForm mode={mode} inventory={inventory} invoices={invoices} contacts={mode === "purchase" ? suppliers : customers} customers={customers} suppliers={suppliers} upsert={upsert} initialInvoice={editingInvoice} onAdd={saveInvoice} /></Modal>}
    </div>
  );
}

function InvoiceContactPicker({ mode, contacts, contactId, contactName, onSelect, onCreate }) {
  const [adding, setAdding] = useState(false);
  const [newName, setNewName] = useState("");
  const [newPhone, setNewPhone] = useState("");
  const label = mode === "purchase" ? "المورد" : "العميل";
  const addContact = () => {
    if (!newName.trim()) { notify(`أدخل اسم ${label}.`); return; }
    if (hasDuplicateName(contacts, newName)) { notify(`اسم ${label} موجود مسبقًا.`); return; }
    const contact = { id: uid(), name: newName.trim(), phone: newPhone.trim(), notes: "", transactions: [] };
    onCreate(contact);
    setAdding(false); setNewName(""); setNewPhone("");
  };
  return <div className="flex flex-col gap-2">
    {!adding && <SearchablePicker items={contacts} value={contactId} onSelect={onSelect} placeholder={`ابحث باسم ${label} أو الهاتف...`} getLabel={(item) => item.name + (item.phone ? " — " + item.phone : "")} getSearchText={(item) => [item.name, item.phone].filter(Boolean).join(" ")} />}
    {!adding && <button type="button" onClick={() => setAdding(true)} className="text-xs self-start" style={{ color: "var(--accent)" }}>+ إضافة {label} جديد</button>}
    {adding && <div className="rounded-lg border p-2.5 flex flex-col gap-2" style={{ borderColor: "var(--card-border)" }}><TextInput placeholder={`اسم ${label} الجديد`} value={newName} onChange={(e) => setNewName(e.target.value)} /><TextInput placeholder="رقم الهاتف (اختياري)" value={newPhone} onChange={(e) => setNewPhone(e.target.value)} /><div className="flex gap-2"><PrimaryButton onClick={addContact}><Icon name="plus" size={14} /> إضافة واختيار</PrimaryButton><GhostButton onClick={() => setAdding(false)}>إلغاء</GhostButton></div></div>}
    {!adding && contactName && !contactId && <div className="text-xs" style={{ color: "var(--text-muted)" }}>الاسم الحالي غير مرتبط ببطاقة، اختر جهة من البحث.</div>}
  </div>;
}

function AddInvoiceForm({ onAdd, mode, inventory, invoices = [], contacts, customers = [], suppliers = [], upsert, initialInvoice = null, startAsReturn = false }) {
  const [invoiceNumber, setInvoiceNumber] = useState(initialInvoice?.invoiceNumber || "");
  const [contactId, setContactId] = useState(initialInvoice?.contactId || initialInvoice?.supplierId || "");
  const [contactName, setContactName] = useState(initialInvoice?.contactName || initialInvoice?.supplierName || initialInvoice?.customerName || "");
  const [amount, setAmount] = useState(initialInvoice?.amount ? String(initialInvoice.amount) : "");
  const [date, setDate] = useState(initialInvoice?.date || todayISO());
  const [description, setDescription] = useState(initialInvoice?.description || "");
  const [paymentStatus, setPaymentStatus] = useState(initialInvoice ? initialInvoice.paymentStatus || (initialInvoice.debtTransactionId ? "unpaid" : "paid") : "unpaid");
  const [discount, setDiscount] = useState(String(initialInvoice?.discount || 0));
  const [paidAmount, setPaidAmount] = useState(String(initialInvoice ? getInvoiceInitialPaidAmount(initialInvoice, customers, suppliers) : 0));
  const [isReturn, setIsReturn] = useState(Boolean(initialInvoice?.isReturn || startAsReturn));
  const [returnForInvoiceId, setReturnForInvoiceId] = useState(initialInvoice?.returnForInvoiceId || "");
  const [items, setItems] = useState(initialInvoice?.items?.length ? initialInvoice.items : [{ inventoryId: "", name: "", quantity: "", unit: "كيس", unitPrice: "", total: "" }]);

  const setItem = (idx, patch) => setItems((prev) => prev.map((it, i) => { if (i !== idx) return it; const next = { ...it, ...patch }; if (next.quantity && next.unitPrice && nonNegativeNumber(next.quantity) && nonNegativeNumber(next.unitPrice)) next.total = String(roundMoney(Number(next.quantity) * Number(next.unitPrice))); return next; }));
  const addRow = () => setItems((prev) => [...prev, { inventoryId: "", name: "", quantity: "", unit: "كيس", unitPrice: "", total: "" }]);
  const removeRow = (idx) => setItems((prev) => prev.filter((_, i) => i !== idx));
  const itemsTotal = roundMoney(items.reduce((s, it) => s + Number(it.total || 0), 0));
  const subtotal = itemsTotal > 0 ? itemsTotal : Number(amount || 0);
  const effectiveAmount = roundMoney(Math.max(0, subtotal - Number(discount || 0)));
  const returnSource = invoices.find((invoice) => invoice.id === returnForInvoiceId && !invoice.isReturn && (invoice.direction || (invoice.type === "شراء" ? "purchase" : "sale")) === mode);
  const returnLines = getRemainingInvoiceLines(returnSource, invoices, initialInvoice);

  useEffect(() => {
    const contact = contacts.find((item) => item.id === contactId);
    if (contact) setContactName(contact.name);
  }, [contactId, contacts]);
  useEffect(() => {
    if (!initialInvoice && paymentStatus === "paid") setPaidAmount(String(effectiveAmount));
  }, [effectiveAmount, paymentStatus, initialInvoice]);

  const submit = () => {
    if (!positiveNumber(effectiveAmount) || Number(effectiveAmount) < 0) { notify("مبلغ الفاتورة يجب أن يكون موجبًا."); return; }
    if (!nonNegativeNumber(discount) || Number(discount) > subtotal) { notify("الخصم يجب أن يكون غير سالب ولا يتجاوز إجمالي الفاتورة."); return; }
    if (!nonNegativeNumber(paidAmount) || Number(paidAmount) > effectiveAmount) { notify("المبلغ المدفوع يجب أن يكون بين صفر وإجمالي الفاتورة."); return; }
    if (initialInvoice && getInvoicePaidAmount(initialInvoice) + getInvoiceReturnedAmount(initialInvoice.id, invoices) > effectiveAmount) { notify("لا يمكن تخفيض قيمة الفاتورة إلى أقل من المسدد والمرتجعات المسجلة."); return; }
    if (!contactId) { notify(`اختر ${mode === "purchase" ? "المورد" : "العميل"} أولًا.`); return; }
    if (isReturn && !returnSource) { notify("اختر الفاتورة الأصلية للمرتجع."); return; }
    const purchaseCostFactor = mode === "purchase" && !isReturn && subtotal > 0 ? effectiveAmount / subtotal : 1;
    const cleanItems = items.filter((it) => it.inventoryId && positiveNumber(it.quantity) && positiveNumber(it.total)).map((it) => {
      const inventoryItem = inventory.find((entry) => entry.id === it.inventoryId);
      const costUnitPrice = mode === "purchase"
        ? isReturn ? Number(it.costUnitPrice ?? it.unitPrice ?? 0) : roundMoney(Number(it.total || 0) / Number(it.quantity || 1) * purchaseCostFactor)
        : Number(it.costUnitPrice ?? inventoryItem?.averageCost ?? 0);
      return { inventoryId: it.inventoryId, name: it.name.trim(), quantity: Number(it.quantity), unit: it.unit, unitPrice: Number(it.unitPrice || 0), total: roundMoney(Number(it.total)), costUnitPrice };
    });
    if (!cleanItems.length) { notify("اختر صنفًا من المخزن وأدخل كمية وسعرًا صحيحين."); return; }
    if (isReturn) {
      const returned = new Map();
      cleanItems.forEach((line) => returned.set(line.inventoryId, (returned.get(line.inventoryId) || 0) + line.quantity));
      for (const [itemId, quantity] of returned) {
        const sourceQuantity = (returnSource.items || []).filter((line) => line.inventoryId === itemId).reduce((sum, line) => sum + Number(line.quantity || 0), 0);
        const alreadyReturned = getInvoiceReturnedQuantity(returnSource.id, itemId, invoices) - Number((initialInvoice?.items || []).filter((line) => line.inventoryId === itemId).reduce((sum, line) => sum + Number(line.quantity || 0), 0));
        if (quantity > sourceQuantity - alreadyReturned) { notify(`كمية المرتجع تتجاوز المتبقي من «${inventory.find((item) => item.id === itemId)?.name || "الصنف"}».`); return; }
      }
      const alreadyReturnedValue = invoices.filter((invoice) => invoice.isReturn && invoice.returnForInvoiceId === returnSource.id && invoice.id !== initialInvoice?.id).reduce((sum, invoice) => sum + Number(invoice.amount || 0), 0);
      if (effectiveAmount > Number(returnSource.amount || 0) - alreadyReturnedValue) { notify("قيمة المرتجع تتجاوز المتبقي من قيمة الفاتورة الأصلية."); return; }
      const sourcePaid = getInvoicePaidAmount(returnSource);
      const alreadyRefunded = invoices.filter((invoice) => invoice.isReturn && invoice.returnForInvoiceId === returnSource.id && invoice.id !== initialInvoice?.id).reduce((sum, invoice) => sum + Number(invoice.paidAmount || 0), 0);
      if (Number(paidAmount) > sourcePaid - alreadyRefunded) { notify("المبلغ النقدي المعاد يتجاوز ما دُفع على الفاتورة الأصلية."); return; }
    } else if (initialInvoice) {
      const returns = invoices.filter((invoice) => invoice.isReturn && invoice.returnForInvoiceId === initialInvoice.id);
      if (returns.reduce((sum, invoice) => sum + Number(invoice.amount || 0), 0) > effectiveAmount) { notify("لا يمكن تخفيض قيمة الفاتورة إلى أقل من قيمة مرتجعاتها المسجلة."); return; }
      const returnedByItem = new Map();
      returns.forEach((invoice) => (invoice.items || []).forEach((line) => returnedByItem.set(line.inventoryId, (returnedByItem.get(line.inventoryId) || 0) + Number(line.quantity || 0))));
      for (const [itemId, quantity] of returnedByItem) {
        if (cleanItems.filter((line) => line.inventoryId === itemId).reduce((sum, line) => sum + line.quantity, 0) < quantity) { notify("لا يمكن حذف أو تقليل صنف له مرتجعات مسجلة."); return; }
      }
    }
    const stockById = new Map(inventory.map((item) => [item.id, item]));
    if ((mode === "sale" && !isReturn) || (mode === "purchase" && isReturn)) {
      const requested = new Map();
      cleanItems.forEach((item) => requested.set(item.inventoryId, (requested.get(item.inventoryId) || 0) + item.quantity));
      for (const [id, quantity] of requested) if (!stockById.has(id) || Number(stockById.get(id).quantity || 0) + (initialInvoice?.items || []).filter((item) => item.inventoryId === id).reduce((sum, item) => sum + Number(item.quantity || 0), 0) < quantity) { notify(`الكمية المطلوبة من «${stockById.get(id)?.name || "الصنف"}» غير متوفرة في المخزن.`); return; }
    }
    const invoiceId = initialInvoice?.id || uid();
    const actualPaidAmount = initialInvoice ? getInvoicePaidAmount(initialInvoice) : roundMoney(Number(paidAmount));
    const initialPaidAmount = initialInvoice ? getInvoiceInitialPaidAmount(initialInvoice, customers, suppliers) : roundMoney(Number(paidAmount));
    const actualPaymentStatus = isReturn
      ? actualPaidAmount >= effectiveAmount ? "paid" : actualPaidAmount > 0 ? "partial" : "unpaid"
      : getInvoicePaymentStatus({ id: invoiceId, amount: effectiveAmount, paidAmount: actualPaidAmount }, invoices);
    const debtTransactionId = mode === "purchase" && !isReturn && contactId ? (initialInvoice?.debtTransactionId || "invoice-debt-" + invoiceId) : null;
    const inv = {
      id: invoiceId, invoiceNumber: invoiceNumber.trim(), type: mode === "purchase" ? "شراء" : "بيع", direction: mode, contactId: contactId || null, contactName: contactName.trim(),
      supplierId: mode === "purchase" ? (contactId || null) : null, supplierName: mode === "purchase" ? contactName.trim() : "", customerId: mode === "sale" ? (contactId || null) : null, customerName: mode === "sale" ? contactName.trim() : "",
      amount: effectiveAmount, subtotal: roundMoney(subtotal), discount: roundMoney(Number(discount)), paidAmount: actualPaidAmount, initialPaidAmount, date, description: description.trim(), items: cleanItems, paymentStatus: actualPaymentStatus, debtTransactionId, contactTransactionId: initialInvoice?.contactTransactionId || "invoice-contact-" + invoiceId, isReturn, returnForInvoiceId: isReturn ? returnForInvoiceId : null,
    };
    onAdd(inv);
  };

  return (

      {isReturn && <div><FieldLabel>الفاتورة الأصلية</FieldLabel><Select value={returnForInvoiceId} disabled={Boolean(initialInvoice)} onChange={(e) => {
        const id = e.target.value;
        const source = invoices.find((invoice) => invoice.id === id);

        if (!source) return;
        const sourceContactId = source.contactId || source.supplierId || source.customerId;
        setContactId(sourceContactId || "");
        setContactName(source.contactName || source.supplierName || source.customerName || "");
        const lines = getRemainingInvoiceLines(source, invoices);
        setItems(lines.map((line) => ({ inventoryId: line.inventoryId, name: line.name, quantity: "", unit: line.unit, unitPrice: String(line.unitPrice || 0), total: "", costUnitPrice: Number(line.costUnitPrice || 0) })));
        setDiscount("0"); setPaidAmount("0"); setPaymentStatus("unpaid");
      }}><option value="">اختر الفاتورة الأصلية</option>{invoices.filter((invoice) => !invoice.isReturn && (invoice.direction || (invoice.type === "شراء" ? "purchase" : "sale")) === mode).map((invoice) => <option key={invoice.id} value={invoice.id}>#{invoice.invoiceNumber || invoice.id} · {invoice.date} · {fmt(invoice.amount)}</option>)}</Select></div>}
      <div><FieldLabel>{mode === "purchase" ? "المورد" : "العميل"}</FieldLabel>{isReturn || initialInvoice ? <TextInput value={contactName} disabled /> : <InvoiceContactPicker mode={mode} contacts={contacts} contactId={contactId} contactName={contactName} onSelect={(id) => { const contact = contacts.find((item) => item.id === id); setContactId(id || ""); setContactName(contact?.name || ""); }} onCreate={(contact) => { upsert(mode === "purchase" ? "suppliers" : "customers", contact); setContactId(contact.id); setContactName(contact.name); }} />}</div>
      <div className="flex items-center gap-3 text-xs" style={{ color: "var(--text-body)" }}>
        <span>{isReturn ? "تسوية المرتجع:" : "حالة السداد:"}</span>
        <label className="flex items-center gap-1"><input type="radio" name="invoice-payment-status" checked={paymentStatus === "paid"} disabled={Boolean(initialInvoice)} onChange={() => { setPaymentStatus("paid"); setPaidAmount(String(effectiveAmount)); }} /> مسددة</label>
        <label className="flex items-center gap-1"><input type="radio" name="invoice-payment-status" checked={paymentStatus === "partial"} disabled={Boolean(initialInvoice)} onChange={() => { setPaymentStatus("partial"); setPaidAmount(""); }} /> دفعة جزئية</label>
        <label className="flex items-center gap-1"><input type="radio" name="invoice-payment-status" checked={paymentStatus === "unpaid"} disabled={Boolean(initialInvoice)} onChange={() => { setPaymentStatus("unpaid"); setPaidAmount("0"); }} /> غير مسددة</label>
      </div>

      <div className="rounded-xl border p-3 flex flex-col gap-2" style={{ borderColor: "var(--card-border)" }}>
          <FieldLabel>بنود الفاتورة من المخزن</FieldLabel>
        {items.map((it, idx) => (
          <div key={idx} className="grid grid-cols-2 sm:grid-cols-12 gap-1.5 items-center">
            <div className="col-span-2 sm:col-span-3 min-w-0"><Select value={it.inventoryId} onChange={(e) => { const item = inventory.find((entry) => entry.id === e.target.value); const returnLine = returnLines.find((line) => line.inventoryId === e.target.value); setItem(idx, { inventoryId: e.target.value, name: item?.name || returnLine?.name || "", unit: returnLine?.unit || item?.unit || "كيس", unitPrice: isReturn ? String(returnLine?.unitPrice || 0) : it.unitPrice, costUnitPrice: Number(returnLine?.costUnitPrice ?? item?.averageCost ?? 0) }); }}><option value="">اختر من المخزن</option>{(isReturn ? returnLines : inventory).map((item) => <option key={item.inventoryId || item.id} value={item.inventoryId || item.id}>{item.name} ({isReturn ? `متاح ${fmt(item.returnable)} ${item.unit}` : `${fmt(item.quantity)} ${item.unit}`})</option>)}</Select></div>
            <div className="col-span-1 sm:col-span-2 min-w-0"><TextInput type="number" placeholder="كمية" value={it.quantity} onChange={(e) => setItem(idx, { quantity: e.target.value })} /></div>
            <div className="col-span-1 sm:col-span-2 min-w-0"><TextInput placeholder="وحدة" value={it.unit} onChange={(e) => setItem(idx, { unit: e.target.value })} /></div>

            <div className="col-span-2 sm:col-span-1 flex justify-center">{items.length > 1 && <button onClick={() => removeRow(idx)} style={{ color: "var(--text-muted)" }}><Icon name="x" size={14} /></button>}</div>

        <button onClick={addRow} className="text-xs flex items-center gap-1 self-start" style={{ color: "var(--accent)" }}><Icon name="plus" size={12} /> إضافة بند</button>
      </div>

      <div className="grid grid-cols-2 gap-3">
        <div><FieldLabel>{itemsTotal > 0 ? "المبلغ الإجمالي (محسوب من البنود)" : "المبلغ الإجمالي"}</FieldLabel><TextInput type="number" value={itemsTotal > 0 ? itemsTotal : amount} onChange={(e) => setAmount(e.target.value)} disabled={itemsTotal > 0} /></div>
        <div><FieldLabel>التاريخ</FieldLabel><TextInput type="date" value={date} onChange={(e) => setDate(e.target.value)} /></div>

        <div><FieldLabel>الخصم</FieldLabel><TextInput type="number" min="0" value={discount} onChange={(e) => setDiscount(e.target.value)} /></div>
        <div><FieldLabel>صافي الفاتورة</FieldLabel><TextInput type="number" value={effectiveAmount} disabled /></div>
      </div>
      <div><FieldLabel>{isReturn ? "المبلغ المعاد / المستلم نقدًا" : "المبلغ المقبوض / المدفوع الآن"}</FieldLabel><TextInput type="number" min="0" max={effectiveAmount} value={paidAmount} disabled={Boolean(initialInvoice)} onChange={(e) => { setPaidAmount(e.target.value); setPaymentStatus(Number(e.target.value) >= effectiveAmount ? "paid" : Number(e.target.value) > 0 ? "partial" : "unpaid"); }} /></div>

}

// ---------- Finance ----------
function FinanceTab({ expenses, income, projects, upsert, remove }) {
  const [sub, setSub] = useState("expenses");
  const [showAdd, setShowAdd] = useState(false);
  const [editingExpense, setEditingExpense] = useState(null);
  const [editingIncome, setEditingIncome] = useState(null);
  const [pendingDelete, setPendingDelete] = useState(null);
  const list = sub === "expenses" ? expenses : income;
  const sorted = [...list].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const totalExpenses = expenses.reduce((s, x) => s + Number(x.amount || 0), 0);
  const totalIncome = income.reduce((s, x) => s + Number(x.amount || 0), 0);
  const saveIncome = (nextIncome) => {
    const previousProjectId = editingIncome?.projectId;
    if (previousProjectId && previousProjectId !== nextIncome.projectId) {
      const previousProject = projects.find((project) => project.id === previousProjectId);
      if (previousProject) upsert("projects", { ...previousProject, payments: (previousProject.payments || []).filter((payment) => (payment.paymentId || payment.id) !== (editingIncome.paymentId || editingIncome.id)) });
    }
    if (nextIncome.projectId) {
      const nextProject = projects.find((project) => project.id === nextIncome.projectId);
      if (nextProject) {
        const payment = { id: nextIncome.paymentId || nextIncome.id, paymentId: nextIncome.paymentId || nextIncome.id, date: nextIncome.date, amount: nextIncome.amount, description: nextIncome.description };
        const payments = nextProject.payments || [];
        const paymentKey = payment.paymentId || payment.id;
        const nextPayments = payments.some((item) => (item.paymentId || item.id) === paymentKey)
          ? payments.map((item) => (item.paymentId || item.id) === paymentKey ? { ...item, ...payment } : item)
          : [payment, ...payments];
        upsert("projects", { ...nextProject, payments: nextPayments });
      }
    }
    upsert("income", nextIncome);
    setEditingIncome(null);
  };
  const deleteIncome = (entry) => {
    if (entry.projectId) {
      const project = projects.find((item) => item.id === entry.projectId);
      if (project) upsert("projects", { ...project, payments: (project.payments || []).filter((payment) => (payment.paymentId || payment.id) !== (entry.paymentId || entry.id)) });
    }
    remove("income", entry.id);
  };
  return (
    <div className="flex flex-col gap-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div><h1 className="text-xl font-bold" style={{ fontFamily: "'El Messiri', sans-serif", color: "var(--text-strong)" }}>المصاريف والواردات</h1><p className="text-sm mt-0.5" style={{ color: "var(--text-muted)" }}>مصاريف تشغيل المصنع، وواردات المشاريع</p></div>
        <PrimaryButton onClick={() => setShowAdd(true)}><Icon name="plus" size={16} /> {sub === "expenses" ? "مصروف جديد" : "وارد جديد"}</PrimaryButton>
      </div>
      <div className="grid grid-cols-3 gap-3">
        <StatCard icon="trendDown" label="إجمالي المصاريف" value={fmt(totalExpenses)} accent="#A34632" />
        <StatCard icon="trendUp" label="إجمالي الواردات" value={fmt(totalIncome)} accent="#4B6350" />
        <StatCard icon="wallet" label="الصافي" value={fmt(totalIncome - totalExpenses)} accent="#8A6A32" />
      </div>
      <div className="flex gap-1.5">
        <button onClick={() => setSub("expenses")} className="text-sm px-4 py-2 rounded-lg border transition" style={sub === "expenses" ? { background: "var(--accent)", borderColor: "var(--accent)", color: "white" } : { background: "var(--card-bg)", borderColor: "var(--card-border)", color: "var(--text-body)" }}>مصاريف المصنع</button>
        <button onClick={() => setSub("income")} className="text-sm px-4 py-2 rounded-lg border transition" style={sub === "income" ? { background: "var(--accent)", borderColor: "var(--accent)", color: "white" } : { background: "var(--card-bg)", borderColor: "var(--card-border)", color: "var(--text-body)" }}>واردات المشاريع</button>
      </div>
      {sorted.length === 0 ? <EmptyState icon="wallet" title={sub === "expenses" ? "لا توجد مصاريف مسجّلة" : "لا توجد واردات مسجّلة"} /> : (
        <div className="rounded-2xl border overflow-hidden" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
          <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
            {sorted.map((x) => (
              <div key={x.id} className="flex items-center justify-between px-4 py-3 gap-2" style={{ borderColor: "var(--divider)" }}>
                <div className="min-w-0"><div className="text-sm font-medium" style={{ color: "var(--text-body)" }}>{sub === "expenses" ? x.type : (x.customerName || "وارد")}</div><div className="text-xs mt-0.5" style={{ color: "var(--text-muted)" }}>{x.date} {x.projectId ? "· " + (projects.find((project) => project.id === x.projectId)?.customerName || "مشروع") : ""} {x.description ? "· " + x.description : ""}</div></div>
                <div className="flex items-center gap-3 shrink-0">
                  <span className="font-semibold" style={{ color: sub === "expenses" ? "#A34632" : "#4B6350" }}>{sub === "expenses" ? "−" : "+"}{fmt(x.amount)}</span>
                  {pendingDelete === x.id ? <ConfirmInline onConfirm={() => { sub === "expenses" ? remove("expenses", x.id) : deleteIncome(x); setPendingDelete(null); }} onCancel={() => setPendingDelete(null)} /> : <div className="flex items-center gap-3"><button onClick={() => sub === "expenses" ? setEditingExpense(x) : setEditingIncome(x)} className="text-xs" style={{ color: "var(--accent)" }}>تعديل</button><button onClick={() => setPendingDelete(x.id)} style={{ color: "var(--text-muted)" }}><Icon name="trash" size={14} /></button></div>}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
      {showAdd && sub === "expenses" && <Modal title="مصروف جديد" onClose={() => setShowAdd(false)}><AddExpenseForm onAdd={(e) => { upsert("expenses", e); setShowAdd(false); }} /></Modal>}
      {showAdd && sub === "income" && <Modal title="وارد جديد" onClose={() => setShowAdd(false)}><AddIncomeForm projects={projects} onAdd={(e) => { upsert("income", e); setShowAdd(false); }} /></Modal>}
      {editingExpense && <Modal title="تعديل المصروف" onClose={() => setEditingExpense(null)}><AddExpenseForm initialExpense={editingExpense} onAdd={(e) => { upsert("expenses", e); setEditingExpense(null); }} /></Modal>}
      {editingIncome && <Modal title="تعديل الوارد" onClose={() => setEditingIncome(null)}><AddIncomeForm initialIncome={editingIncome} projects={projects} onAdd={saveIncome} /></Modal>}
    </div>
  );
}
function AddExpenseForm({ onAdd, initialExpense = null }) {
  const [type, setType] = useState(initialExpense?.type || EXPENSE_TYPES[0]);
  const [amount, setAmount] = useState(initialExpense?.amount ? String(initialExpense.amount) : "");
  const [date, setDate] = useState(initialExpense?.date || todayISO());
  const [description, setDescription] = useState(initialExpense?.description || "");
  const submit = () => { if (!positiveNumber(amount) || Number(amount) < 0) { notify("المبلغ يجب أن يكون موجبًا."); return; } onAdd({ id: initialExpense?.id || uid(), type, amount: roundMoney(Number(amount)), date, description: description.trim() }); };
  return (
    <div className="flex flex-col gap-3">
      <div><FieldLabel>نوع المصروف</FieldLabel><Select value={type} onChange={(e) => setType(e.target.value)}>{EXPENSE_TYPES.map((t) => <option key={t}>{t}</option>)}</Select></div>
      <div className="grid grid-cols-2 gap-3"><div><FieldLabel>المبلغ</FieldLabel><TextInput type="number" value={amount} onChange={(e) => setAmount(e.target.value)} /></div><div><FieldLabel>التاريخ</FieldLabel><TextInput type="date" value={date} onChange={(e) => setDate(e.target.value)} /></div></div>
      <div><FieldLabel>وصف (اختياري)</FieldLabel><TextInput value={description} onChange={(e) => setDescription(e.target.value)} /></div>
      <PrimaryButton onClick={submit} full disabled={!amount}><Icon name="plus" size={16} /> {initialExpense ? "حفظ تعديل المصروف" : "حفظ المصروف"}</PrimaryButton>
    </div>
  );
}
function AddIncomeForm({ onAdd, projects, initialIncome = null }) {
  const [projectId, setProjectId] = useState(initialIncome?.projectId || "");
  const [customerName, setCustomerName] = useState(initialIncome?.customerName || "");

  return (
    <div className="flex flex-col gap-3">
      <div>
        <FieldLabel>المشروع (اختياري)</FieldLabel>
        <SearchablePicker
          items={projects}
          value={projectId}
          onSelect={setProjectId}
          placeholder="ابحث باسم الزبون أو موقع المشروع..."
          getLabel={(project) => project.customerName + (project.location ? " — " + project.location : "")}

        />
      </div>
      {!projectId && <div><FieldLabel>اسم الزبون</FieldLabel><TextInput value={customerName} onChange={(e) => setCustomerName(e.target.value)} /></div>}
      <div className="grid grid-cols-2 gap-3"><div><FieldLabel>المبلغ</FieldLabel><TextInput type="number" value={amount} onChange={(e) => setAmount(e.target.value)} /></div><div><FieldLabel>التاريخ</FieldLabel><TextInput type="date" value={date} onChange={(e) => setDate(e.target.value)} /></div></div>
      <div><FieldLabel>وصف (اختياري)</FieldLabel><TextInput value={description} onChange={(e) => setDescription(e.target.value)} /></div>
      <PrimaryButton onClick={submit} full disabled={!amount}><Icon name="plus" size={16} /> {initialIncome ? "حفظ تعديل الوارد" : "حفظ الوارد"}</PrimaryButton>
    </div>
  );
}

      )}
      {showAdd && <Modal title={`إضافة ${label.replace(/ون$|اء$/, "")}`} onClose={() => setShowAdd(false)}><AddContactForm existing={data} onAdd={(c) => { upsert(collection, c); setShowAdd(false); }} /></Modal>}
      {open && <ContactDetail contact={open} label={label} icon={icon} invoices={invoices} treasury={treasury} upsert={upsert} canDelete={!hasLinkedInvoices(open)} onClose={() => setOpenId(null)} onSave={(c) => upsert(collection, c)} onTreasurySave={(record) => upsert("treasury", record)} onInvoiceSave={(invoice) => upsert("invoices", invoice)} onDelete={() => { remove(collection, open.id); setOpenId(null); }} relatedProjects={relatedProjects} income={income} onOpenProject={onOpenProject} existing={data.filter((d) => d.id !== open.id)} />}
    </div>
  );
}

function AddContactForm({ onAdd, existing = [] }) {
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [notes, setNotes] = useState("");
  const submit = () => {
    if (!name.trim()) return;
    if (hasDuplicateName(existing, name)) { notify("هذا الاسم مسجل مسبقًا."); return; }
    onAdd({ id: uid(), name: name.trim(), phone: phone.trim(), notes: notes.trim(), transactions: [] });
  };
  return (
    <div className="flex flex-col gap-3">
      <div><FieldLabel>الاسم</FieldLabel><TextInput value={name} onChange={(e) => setName(e.target.value)} /></div>
      <div><FieldLabel>رقم الهاتف (اختياري)</FieldLabel><TextInput value={phone} onChange={(e) => setPhone(e.target.value)} /></div>
      <div><FieldLabel>ملاحظات (اختياري)</FieldLabel><TextInput value={notes} onChange={(e) => setNotes(e.target.value)} /></div>
      <PrimaryButton onClick={submit} full disabled={!name.trim()}><Icon name="plus" size={16} /> إضافة</PrimaryButton>
    </div>
  );
}

function ContactDetail({ contact, label, icon, invoices = [], treasury, upsert, canDelete = true, onClose, onSave, onTreasurySave, onInvoiceSave, onDelete, relatedProjects, income = [], onOpenProject, existing = [] }) {
  const [local, setLocal] = useState(contact);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [statementStart, setStatementStart] = useState("");
  const [statementEnd, setStatementEnd] = useState("");
  const [showStatement, setShowStatement] = useState(false);
  const [expandedInvoiceId, setExpandedInvoiceId] = useState(null);
  const [pendingTxDelete, setPendingTxDelete] = useState(null);
  useEffect(() => setLocal(contact), [contact.id]);
  const update = (patch) => { const next = { ...local, ...patch }; setLocal(next); onSave(next); };
  const balance = contactBalance(local);
  const transactions = local.transactions || [];
  const linkedInvoices = (invoices || []).filter((invoice) => {
    const invoiceContactId = invoice.contactId || invoice.customerId || invoice.supplierId;
    if (!invoiceContactId || invoiceContactId !== local.id) return false;
    if (label === "عملاء") return (invoice.direction || "sale") === "sale";
    if (label === "موردون") return (invoice.direction || "purchase") === "purchase";
    return true;
  }).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const expandedInvoice = linkedInvoices.find((invoice) => invoice.id === expandedInvoiceId) || null;
  const supplierStatement = label === "موردون" ? getSupplierStatement(local, invoices) : null;
  const isDuplicateName = hasDuplicateName(existing, local.name);
  const projectTotals = (relatedProjects || []).reduce((summary, project) => {
    const sm = getProjectSummary(project, income);
    return { cost: summary.cost + sm.cost, paid: summary.paid + sm.paid, remaining: summary.remaining + sm.remaining, surplus: summary.surplus + sm.surplus };
  }, { cost: 0, paid: 0, remaining: 0, surplus: 0 });
  const projectRemaining = projectTotals.remaining;
  const grandTotal = balance + projectRemaining - projectTotals.surplus;

  const removeTx = (id) => {
    const transaction = transactions.find((item) => item.id === id);
    if (!transaction || transaction.invoiceDebt) { setPendingTxDelete(null); return; }
    const remainingTransactions = transactions.filter((t) => t.id !== id);
    update({ transactions: remainingTransactions });
    if (transaction.customerPayment || transaction.supplierPayment || transaction.customerRefund || transaction.supplierReceipt) {
      const record = treasury?.[0];
      if (record) onTreasurySave({ ...record, transactions: (record.transactions || []).filter((item) => item.paymentId !== id && item.id !== id) });
      const allocations = Array.isArray(transaction.allocations) && transaction.allocations.length ? transaction.allocations : (transaction.invoiceId ? [{ invoiceId: transaction.invoiceId, amount: transaction.amount }] : []);
      const allocationTotals = new Map();
      allocations.forEach((allocation) => allocationTotals.set(allocation.invoiceId, (allocationTotals.get(allocation.invoiceId) || 0) + Number(allocation.amount || 0)));
      allocationTotals.forEach((allocatedAmount, invoiceId) => {
        const invoice = invoices.find((item) => item.id === invoiceId);
        if (!invoice) return;
        const paidAmount = roundMoney(Math.max(0, getInvoicePaidAmount(invoice) - allocatedAmount));
        const initialPaidAmount = getInvoiceInitialPaidAmount(invoice, transaction.customerPayment ? [local] : [], transaction.supplierPayment || transaction.supplierReceipt ? [local] : []);
        const adjustedInitialPaidAmount = transaction.id === "invoice-payment-" + invoice.id
          ? roundMoney(Math.max(0, initialPaidAmount - allocatedAmount))
          : initialPaidAmount;
        onInvoiceSave({
          ...invoice,
          paidAmount,
          initialPaidAmount: adjustedInitialPaidAmount,
          paymentStatus: getInvoicePaymentStatus({ ...invoice, paidAmount }, invoices),
        });
      });
    }
    setPendingTxDelete(null);
  };

  return (
    <Modal title={local.name} onClose={onClose} wide>
      <div className="flex flex-col gap-4">
        <div className="grid sm:grid-cols-2 gap-3">
          <div><FieldLabel>الاسم</FieldLabel><TextInput value={local.name} onChange={(e) => update({ name: e.target.value })} />{isDuplicateName && <div className="text-xs mt-1" style={{ color: "#A34632" }}>يوجد اسم مطابق مسجّل مسبقًا — تأكد أنه ليس تكرارًا لنفس الجهة.</div>}</div>
          <div><FieldLabel>رقم الهاتف</FieldLabel><TextInput value={local.phone} onChange={(e) => update({ phone: e.target.value })} /></div>
        </div>
        <div><FieldLabel>ملاحظات</FieldLabel><TextInput value={local.notes} onChange={(e) => update({ notes: e.target.value })} /></div>

        <div className="rounded-xl p-3 flex items-center justify-between" style={{ background: balance > 0 ? "var(--warn-bg)" : balance < 0 ? "var(--good-bg)" : "var(--divider)" }}>
          <span className="text-sm" style={{ color: "var(--text-body)" }}>{label === "موردون" ? "الرصيد اليدوي للمورد" : "الرصيد اليدوي للعميل"}</span>
          <span className="font-bold text-lg" style={{ color: balance > 0 ? "#A34632" : balance < 0 ? "#4B6350" : "var(--text-strong)" }}>
            {balance === 0 ? "لا يوجد" : balance > 0 ? (label === "موردون" ? `علينا ${fmt(balance)}` : `عليه ${fmt(balance)}`) : (label === "موردون" ? `لنا ${fmt(-balance)}` : `له ${fmt(-balance)}`)}
          </span>
        </div>

        <div className="rounded-xl border p-3 flex flex-col gap-3" style={{ borderColor: "var(--card-border)" }}>
          <div className="flex items-center justify-between gap-2 flex-wrap">
            <FieldLabel>كشف الحساب</FieldLabel>
            <button
              className="text-xs"
              style={{ color: "var(--accent)" }}
              onClick={() => setShowStatement(!showStatement)}
            >
              {showStatement ? "إخفاء كشف الحساب" : "عرض كشف الحساب"}
            </button>
          </div>

          <div className="grid grid-cols-2 gap-2">
            <div><FieldLabel>من تاريخ</FieldLabel><TextInput type="date" value={statementStart} onChange={(e) => setStatementStart(e.target.value)} /></div>
            <div><FieldLabel>إلى تاريخ</FieldLabel><TextInput type="date" value={statementEnd} onChange={(e) => setStatementEnd(e.target.value)} /></div>
          </div>

          {showStatement && (
            <div className="flex flex-col gap-3">
              <div className="flex items-center justify-between gap-2 flex-wrap">
                <div className="text-sm font-medium" style={{ color: "var(--text-body)" }}>معاينة كشف الحساب</div>
                <button
                  className="text-xs"
                  style={{ color: "var(--accent)" }}
                  onClick={() => {
                    const rows = [...transactions].filter((row) => (!statementStart || (row.date || "") >= statementStart) && (!statementEnd || (row.date || "") <= statementEnd)).sort((a, b) => (a.date || "").localeCompare(b.date || ""));
                    printAccountStatement(local, rows, label, statementStart || "", statementEnd || "");
                  }}
                >
                  عرض/طباعة كشف الحساب
                </button>
              </div>
              <div className="overflow-auto rounded-lg border" style={{ borderColor: "var(--card-border)" }}>
                <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 860 }}>
                  <thead>
                    <tr style={{ background: "var(--divider)" }}>
                      <th className="px-2 py-1.5 text-xs" style={{ color: "var(--text-strong)", textAlign: "center" }}>#</th>
                      <th className="px-2 py-1.5 text-xs" style={{ color: "var(--text-strong)", textAlign: "center" }}>رقم السند</th>
                      <th className="px-2 py-1.5 text-xs" style={{ color: "var(--text-strong)", textAlign: "center" }}>النوع</th>
                      <th className="px-2 py-1.5 text-xs" style={{ color: "var(--text-strong)", textAlign: "center" }}>مدين</th>
                      <th className="px-2 py-1.5 text-xs" style={{ color: "var(--text-strong)", textAlign: "center" }}>دائن</th>
                      <th className="px-2 py-1.5 text-xs" style={{ color: "var(--text-strong)", textAlign: "center" }}>التاريخ</th>
                      <th className="px-2 py-1.5 text-xs" style={{ color: "var(--text-strong)", textAlign: "center" }}>رصيد المدين</th>
                      <th className="px-2 py-1.5 text-xs" style={{ color: "var(--text-strong)", textAlign: "center" }}>رصيد الدائن</th>
                      <th className="px-2 py-1.5 text-xs" style={{ color: "var(--text-strong)", textAlign: "center" }}>الرصيد</th>
                      <th className="px-2 py-1.5 text-xs" style={{ color: "var(--text-strong)", textAlign: "center" }}>ملاحظات</th>
                    </tr>
                  </thead>
                  <tbody>
                    {(() => {
                      const rowsFiltered = [...transactions].filter((row) => (!statementStart || (row.date || "") >= statementStart) && (!statementEnd || (row.date || "") <= statementEnd)).sort((a, b) => (a.date || "").localeCompare(b.date || ""));
                      let runningDebitTotal = 0;
                      let runningCreditTotal = 0;
                      let runningBalanceValue = 0;
                      return rowsFiltered.length === 0 ? (
                        <tr><td colSpan="10" className="px-2 py-3 text-xs text-center" style={{ color: "var(--text-muted)" }}>لا توجد حركات في هذه المدة</td></tr>
                      ) : rowsFiltered.map((row, index) => {
                        const debit = row.type === "debit" ? Number(row.amount || 0) : 0;
                        const credit = row.type === "credit" ? Number(row.amount || 0) : 0;
                        runningDebitTotal += debit;
                        runningCreditTotal += credit;
                        runningBalanceValue += debit - credit;
                        return (
                          <tr key={row.id || index} style={{ borderTop: "1px solid var(--divider)" }}>
                            <td className="px-2 py-1.5 text-xs text-center" style={{ color: "var(--text-body)" }}>{index + 1}</td>
                            <td className="px-2 py-1.5 text-xs text-center" style={{ color: "var(--text-body)" }}>{row.id || "-"}</td>
                            <td className="px-2 py-1.5 text-xs text-center" style={{ color: "var(--text-body)" }}>{row.customerPayment ? "قبض" : row.supplierPayment ? "صرف" : row.type === "debit" ? "مدين" : "دائن"}</td>
                            <td className="px-2 py-1.5 text-xs text-center" style={{ color: "var(--text-body)" }}>{fmt(debit)}</td>
                            <td className="px-2 py-1.5 text-xs text-center" style={{ color: "var(--text-body)" }}>{fmt(credit)}</td>
                            <td className="px-2 py-1.5 text-xs text-center" style={{ color: "var(--text-body)" }}>{row.date || "-"}</td>
                            <td className="px-2 py-1.5 text-xs text-center" style={{ color: "var(--text-body)" }}>{fmt(runningDebitTotal)}</td>
                            <td className="px-2 py-1.5 text-xs text-center" style={{ color: "var(--text-body)" }}>{fmt(runningCreditTotal)}</td>
                            <td className="px-2 py-1.5 text-xs text-center" style={{ color: "var(--text-body)" }}>{fmt(runningBalanceValue)}</td>
                            <td className="px-2 py-1.5 text-xs text-center" style={{ color: "var(--text-body)" }}>{row.note || "-"}</td>
                          </tr>
                        );
                      });
                    })()}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>

        <div className="flex flex-col gap-2">
          <div className="text-sm font-medium" style={{ color: "var(--text-body)" }}>سجل حركة {label === "موردون" ? "المورد" : "العميل"}</div>
          {transactions.length === 0 ? <div className="text-xs" style={{ color: "var(--text-muted)" }}>لا توجد حركات بعد</div> : (
            <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
              {transactions.map((t) => (
                <div key={t.id} className="flex items-center justify-between py-2.5 text-right" style={{ borderColor: "var(--divider)" }}>
                  <div className="flex items-center gap-2 min-w-0">
                    <Icon name={t.type === "debit" ? "trendUp" : "trendDown"} size={14} color={t.type === "debit" ? "#A34632" : "#4B6350"} />
                    <div className="min-w-0"><div className="text-sm truncate" style={{ color: "var(--text-body)" }}>{t.note || (t.type === "debit" ? "زيادة دين" : "تسديد")}</div><div className="text-xs" style={{ color: "var(--text-muted)" }}>{t.date}{t.invoiceId ? " · فاتورة" : ""}</div></div>
                  </div>
                  <span className="font-medium" style={{ color: t.type === "debit" ? "#A34632" : "#4B6350" }}>{t.type === "debit" ? "+" : "−"}{fmt(t.amount)}</span>
                </div>
              ))}
            </div>
          )}
        </div>

        {linkedInvoices.length > 0 && (
          <div className="rounded-xl border p-3 flex flex-col gap-3" style={{ borderColor: "var(--card-border)" }}>
            <div className="text-sm font-medium" style={{ color: "var(--text-body)" }}>الفواتير المرتبطة</div>
            <div className="flex flex-col gap-2">
              {linkedInvoices.map((invoice) => (
                <button key={invoice.id} onClick={() => setExpandedInvoiceId(invoice.id)} className="rounded-lg border p-3 text-right" style={{ borderColor: "var(--card-border)", background: "var(--card-bg)" }}>
                  <div className="flex items-center justify-between gap-2">
                    <div className="text-sm font-medium" style={{ color: "var(--text-strong)" }}>#{invoice.invoiceNumber || invoice.id} · {invoice.date}</div>
                    <Badge bg={getInvoicePaymentStatus(invoice, invoices) === "paid" ? "var(--good-bg)" : "var(--warn-bg)"} fg={getInvoicePaymentStatus(invoice, invoices) === "paid" ? "#4B6350" : "#A34632"}>{getInvoicePaymentStatus(invoice, invoices) === "paid" ? "مسددة" : getInvoicePaymentStatus(invoice, invoices) === "partial" ? "جزئية" : "غير مسددة"}</Badge>
                  </div>
                  <div className="text-xs mt-1" style={{ color: "var(--text-muted)" }}>{invoice.isReturn ? "مرتجع" : invoice.direction === "purchase" ? "شراء" : "بيع"} · {fmt(invoice.amount)}</div>
                </button>
              ))}
            </div>
          </div>
        )}

        {expandedInvoice && (
          <div className="rounded-xl border p-3 flex flex-col gap-3" style={{ borderColor: "var(--card-border)" }}>
            <div className="flex items-center justify-between gap-2 flex-wrap">
              <div className="text-sm font-semibold" style={{ color: "var(--text-strong)" }}>تفاصيل الفاتورة #{expandedInvoice.invoiceNumber || expandedInvoice.id}</div>
              <div className="flex gap-2">
                <button onClick={() => printInvoiceDocument(expandedInvoice, invoices)} className="text-xs" style={{ color: "var(--accent)" }}>طباعة الفاتورة</button>
                <button onClick={() => setExpandedInvoiceId(null)} className="text-xs" style={{ color: "var(--text-muted)" }}>إغلاق</button>
              </div>
            </div>
            <div className="grid sm:grid-cols-2 gap-2 text-xs" style={{ color: "var(--text-body)" }}>
              <div className="rounded-lg p-2" style={{ background: "var(--divider)" }}><div style={{ color: "var(--text-muted)" }}>التاريخ</div><strong>{expandedInvoice.date}</strong></div>
              <div className="rounded-lg p-2" style={{ background: "var(--divider)" }}><div style={{ color: "var(--text-muted)" }}>الحالة</div><strong>{getInvoicePaymentStatus(expandedInvoice, invoices) === "paid" ? "مسددة" : getInvoicePaymentStatus(expandedInvoice, invoices) === "partial" ? "جزئية" : "غير مسددة"}</strong></div>
              <div className="rounded-lg p-2" style={{ background: "var(--divider)" }}><div style={{ color: "var(--text-muted)" }}>النوع</div><strong>{expandedInvoice.isReturn ? "مرتجع" : expandedInvoice.direction === "purchase" ? "شراء" : "بيع"}</strong></div>
              <div className="rounded-lg p-2" style={{ background: "var(--divider)" }}><div style={{ color: "var(--text-muted)" }}>المبلغ</div><strong>{fmt(expandedInvoice.amount)}</strong></div>
            </div>
            <div className="rounded-lg border overflow-hidden" style={{ borderColor: "var(--card-border)" }}>
              <div className="grid grid-cols-4 text-xs font-medium px-3 py-2" style={{ background: "var(--divider)", color: "var(--text-strong)" }}>
                <span>الصنف</span><span>الكمية</span><span>السعر</span><span>الإجمالي</span>
              </div>
              {(expandedInvoice.items || []).length === 0 ? <div className="px-3 py-2 text-xs" style={{ color: "var(--text-muted)" }}>لا توجد بنود</div> : (expandedInvoice.items || []).map((item, idx) => (
                <div key={idx} className="grid grid-cols-4 px-3 py-2 text-xs border-t" style={{ borderColor: "var(--divider)", color: "var(--text-body)" }}>
                  <span>{item.name}</span><span>{item.quantity} {item.unit}</span><span>{fmt(item.unitPrice)}</span><span>{fmt(item.total)}</span>
                </div>
              ))}
            </div>
            {expandedInvoice.description && <div className="text-xs rounded-lg p-2" style={{ background: "var(--divider)", color: "var(--text-body)" }}>{expandedInvoice.description}</div>}
          </div>
        )}

        {relatedProjects != null && (
          <div className="rounded-xl border p-3 flex flex-col gap-2" style={{ borderColor: "var(--card-border)" }}>
            <FieldLabel>مشاريع هذا العميل ({relatedProjects.length})</FieldLabel>
            <div className="rounded-lg p-3 flex items-center justify-between" style={{ background: grandTotal > 0 ? "var(--warn-bg)" : "var(--good-bg)" }}>
              <span className="text-sm" style={{ color: "var(--text-body)" }}>الإجمالي الكلي المستحق (الرصيد + باقي المشاريع)</span>
              <span className="font-bold text-lg" style={{ color: grandTotal > 0 ? "#A34632" : "#4B6350" }}>{grandTotal > 0 ? fmt(grandTotal) : grandTotal < 0 ? "رصيد للعميل " + fmt(-grandTotal) : "لا يوجد"}</span>
            </div>
            <div className="text-xs" style={{ color: "var(--text-muted)" }}>الرصيد اليدوي أعلاه لا يشمل دفعات المشاريع، وتُحتسب دفعات المشاريع في الملخص أدناه بشكل منفصل.</div>
            <div className="grid grid-cols-3 gap-2 text-xs">
              <div className="rounded-lg p-2" style={{ background: "var(--divider)" }}><div style={{ color: "var(--text-muted)" }}>تكلفة المشاريع</div><strong style={{ color: "var(--text-strong)" }}>{fmt(projectTotals.cost)}</strong></div>
              <div className="rounded-lg p-2" style={{ background: "var(--good-bg)" }}><div style={{ color: "var(--text-muted)" }}>مجموع الواصل</div><strong style={{ color: "#4B6350" }}>{fmt(projectTotals.paid)}</strong></div>
              <div className="rounded-lg p-2" style={{ background: projectRemaining ? "var(--warn-bg)" : "var(--good-bg)" }}><div style={{ color: "var(--text-muted)" }}>{projectRemaining ? "الباقي العام" : "الحالة"}</div><strong style={{ color: projectRemaining ? "#A34632" : "#4B6350" }}>{projectRemaining ? fmt(projectRemaining) : "خالص"}</strong></div>
            </div>
            {projectTotals.surplus > 0 && <div className="text-xs" style={{ color: "#4B6350" }}>زيادة مدفوعة في مشاريع مكتملة (رصيد للعميل): {fmt(projectTotals.surplus)}</div>}
            {relatedProjects.length === 0 ? (
              <div className="text-xs" style={{ color: "var(--text-muted)" }}>لا توجد مشاريع مرتبطة بهذا العميل بعد</div>
            ) : (
              <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
                {relatedProjects.map((p) => {
                  const m = getProjectSummary(p, income);
                  const total = m.cost;
                  return (
                    <button key={p.id} onClick={() => { onOpenProject(p.id); onClose(); }} className="flex items-center justify-between py-2 text-right" style={{ borderColor: "var(--divider)" }}>
                      <div><div className="text-sm" style={{ color: "var(--text-body)" }}>{p.location || "بدون موقع"}</div><div className="text-xs" style={{ color: "var(--text-muted)" }}>{p.dateCreated} · {p.productType}</div></div>
                      <div className="flex items-center gap-2">
                        <Badge bg={STATUS_COLOR[p.status].bg} fg={STATUS_COLOR[p.status].fg}>{p.status}</Badge>
                        <span className="text-xs" style={{ color: m.remaining ? "#A34632" : "#4B6350" }}>{m.remaining ? `باقي ${fmt(m.remaining)}` : m.surplus ? `رصيد ${fmt(m.surplus)}` : m.settled ? "خالص" : "بانتظار الكيل"}</span>
                        <span className="text-sm font-medium" style={{ color: "var(--text-strong)" }}>{fmt(total)}</span>
                      </div>
                    </button>
                  );
                })}
              </div>
            )}
          </div>
        )}

        <div className="pt-3 border-t flex justify-end" style={{ borderColor: "var(--card-border)" }}>
          {!canDelete ? <span className="text-xs" style={{ color: "var(--text-muted)" }}>لا يمكن حذف جهة مرتبطة بفواتير.</span> : confirmDelete ? <ConfirmInline label="حذف نهائيًا؟" onConfirm={onDelete} onCancel={() => setConfirmDelete(false)} /> : <button onClick={() => setConfirmDelete(true)} className="text-xs flex items-center gap-1" style={{ color: "#A34632" }}><Icon name="trash" size={13} /> حذف</button>}
        </div>
      </div>
    </Modal>
  );
}

// ---------- Attendance ----------
function AttendanceTab({ workers, attendance, upsert, remove }) {
  const [date, setDate] = useState(todayISO());
  const dayRecords = attendance.filter((a) => a.date === date);
  const getStatus = (workerId) => dayRecords.find((a) => a.workerId === workerId)?.status;
  const setStatus = (worker, status) => upsert("attendance", { id: worker.id + "_" + date, workerId: worker.id, workerName: worker.name, date, status });

  const month = monthKey(date);
  const monthRecords = attendance.filter((a) => monthKey(a.date) === month);
  const summary = workers.map((w) => ({
    name: w.name,
    present: monthRecords.filter((a) => a.workerId === w.id && a.status === "حاضر").length,
    half: monthRecords.filter((a) => a.workerId === w.id && a.status === "نصف يوم").length,
    absent: monthRecords.filter((a) => a.workerId === w.id && a.status === "غائب").length,
  }));

  return (
    <div className="flex flex-col gap-5">
      <div><h1 className="text-xl font-bold" style={{ fontFamily: "'El Messiri', sans-serif", color: "var(--text-strong)" }}>حضور العمال</h1><p className="text-sm mt-0.5" style={{ color: "var(--text-muted)" }}>تسجيل الحضور اليومي ومتابعة الملخص الشهري</p></div>

      <div className="flex items-center gap-2"><FieldLabel>التاريخ</FieldLabel></div>
      <TextInput type="date" value={date} onChange={(e) => setDate(e.target.value)} className="max-w-[200px]" />

      {workers.length === 0 ? (
        <EmptyState icon="users" title="لا يوجد عمال مسجّلون بعد" sub="أضف العمال من قسم «الحسابات والديون» ثم عد هنا لتسجيل حضورهم" />
      ) : (
        <div className="rounded-2xl border overflow-hidden" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
          <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
            {workers.map((w) => {
              const st = getStatus(w.id);
              return (
                <div key={w.id} className="flex items-center justify-between px-4 py-3 gap-2 flex-wrap" style={{ borderColor: "var(--divider)" }}>
                  <div className="text-sm font-medium flex items-center gap-1.5" style={{ color: "var(--text-strong)" }}><Icon name="user" size={14} /> {w.name}</div>
                  <div className="flex gap-1.5">
                    {ATTENDANCE_STATUSES.map((s) => (
                      <button key={s} onClick={() => setStatus(w, s)} className="text-xs px-3 py-1.5 rounded-lg border transition" style={st === s ? { background: ATT_COLOR[s].bg, borderColor: ATT_COLOR[s].fg, color: ATT_COLOR[s].fg } : { background: "var(--card-bg)", borderColor: "var(--card-border)", color: "var(--text-muted)" }}>{s}</button>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {workers.length > 0 && (
        <div className="rounded-2xl border p-4" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
          <h3 className="font-semibold text-sm mb-3" style={{ color: "var(--text-body)" }}>ملخص شهر {month}</h3>
          <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
            <div className="flex items-center justify-between py-2 text-xs font-medium" style={{ color: "var(--text-muted)" }}><span>العامل</span><span>حاضر / نصف يوم / غائب</span></div>
            {summary.map((s) => (
              <div key={s.name} className="flex items-center justify-between py-2 text-sm" style={{ color: "var(--text-body)", borderColor: "var(--divider)" }}>
                <span>{s.name}</span>
                <span className="flex items-center gap-2">
                  <Badge bg="var(--good-bg)" fg="#4B6350">{s.present}</Badge>
                  <Badge bg="var(--warn-bg)" fg="#8A6A32">{s.half}</Badge>
                  <Badge bg="var(--divider)" fg="var(--text-muted)">{s.absent}</Badge>
                </span>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- Reports ----------
function ReportsTab({ month, setMonth, projects, invoices, expenses, income, attendance, workers, customers, suppliers, downloadsNs }) {
  const inMonth = (arr, field) => arr.filter((x) => monthKey(x[field || "date"]) === month);
  const allIncome = getAllProjectIncome(projects, income);
  const mIncome = inMonth(allIncome);
  const mExpenses = inMonth(expenses);
  const mInvoices = inMonth(invoices);
  const totalIncome = mIncome.reduce((s, x) => s + Number(x.amount || 0), 0);
  const totalExpenses = mExpenses.reduce((s, x) => s + Number(x.amount || 0), 0);
  const totalInvoices = mInvoices.reduce((s, x) => s + Number(x.amount || 0), 0);
  const net = totalIncome - totalExpenses - totalInvoices;

  const completedProjects = projects.filter((p) => p.completedAt && monthKey(p.completedAt) === month);
  const newProjects = projects.filter((p) => monthKey(p.dateCreated) === month);

  const expenseByType = EXPENSE_TYPES.map((t) => ({ label: t, total: mExpenses.filter((e) => e.type === t).reduce((s, e) => s + Number(e.amount || 0), 0) })).filter((r) => r.total > 0);
  const invoiceByType = ["purchase", "sale"].map((direction) => ({ label: direction === "purchase" ? "مشتريات" : "مبيعات", total: mInvoices.filter((i) => i.direction === direction).reduce((s, i) => s + Number(i.amount || 0), 0) })).filter((r) => r.total > 0);

  const monthAttendance = attendance.filter((a) => monthKey(a.date) === month);
  const attSummary = workers.map((w) => ({
    name: w.name,
    present: monthAttendance.filter((a) => a.workerId === w.id && a.status === "حاضر").length,
    half: monthAttendance.filter((a) => a.workerId === w.id && a.status === "نصف يوم").length,
    absent: monthAttendance.filter((a) => a.workerId === w.id && a.status === "غائب").length,
  })).filter((s) => s.present + s.half + s.absent > 0);

  const customerDebts = customers
    .map((c) => { const o = getCustomerOutstanding(c, projects, income); return { name: c.name, phone: c.phone, ledger: o.ledger, projectsRemaining: o.projectsRemaining, projectsSurplus: o.projectsSurplus, total: o.total }; })
    .filter((c) => c.total > 0)
    .sort((a, b) => b.total - a.total);
  const supplierDebts = suppliers
    .map((s) => { const statement = getSupplierStatement(s, invoices); return { name: s.name, phone: s.phone, total: statement.owed, credit: statement.credit }; })
    .filter((s) => s.total > 0)
    .sort((a, b) => b.total - a.total);
  const totalCustomerDebt = customerDebts.reduce((s, c) => s + c.total, 0);
  const totalSupplierDebt = supplierDebts.reduce((s, c) => s + c.total, 0);
  const totalSupplierCredit = suppliers.reduce((sum, supplier) => sum + getSupplierStatement(supplier, invoices).credit, 0);

  const exportMonth = async () => {
    if (!window.XLSX) { notify("ميزة التصدير غير متاحة هنا حاليًا."); return; }
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{ الشهر: month, الواردات: totalIncome, المصاريف: totalExpenses, الفواتير: totalInvoices, الصافي: net }]), "ملخص");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(mIncome.map((x) => ({ الزبون: x.customerName, المشروع: projects.find((p) => p.id === x.projectId)?.customerName || "", "معرف المشروع": x.projectId || "", المبلغ: x.amount, التاريخ: x.date, الوصف: x.description }))), "الواردات");
