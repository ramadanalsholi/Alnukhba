    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(mExpenses.map((x) => ({ النوع: x.type, المبلغ: x.amount, التاريخ: x.date }))), "المصاريف");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(mInvoices.map((x) => ({ النوع: x.type, المورد: x.supplierName, المبلغ: x.amount, التاريخ: x.date }))), "الفواتير");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(completedProjects.map((p) => ({ الزبون: p.customerName, الموقع: p.location, الحالة: p.status, "تاريخ المشروع": p.dateCreated, "تاريخ الإكمال": p.completedAt, الإجمالي: projectCost(p) }))), "مشاريع مكتملة");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(Array.from(new Map(projects.flatMap((project) => getProjectPayments(project, income).filter((payment) => monthKey(payment.date) === month).map((payment) => [payment.paymentId || payment.id, { الزبون: project.customerName, "معرف المشروع": project.id, "تاريخ الدفعة": payment.date, المبلغ: payment.amount, "وصف الدفعة": payment.description || "" }]))).values())), "دفعات المشاريع");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(workers.map((w) => { const records = monthAttendance.filter((a) => a.workerId === w.id); return { العامل: w.name, حاضر: records.filter((a) => a.status === "حاضر").length, "نصف يوم": records.filter((a) => a.status === "نصف يوم").length, غائب: records.filter((a) => a.status === "غائب").length }; })), "حضور العمال");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(customerDebts.length ? customerDebts.map((c) => ({ العميل: c.name, الهاتف: c.phone || "", "رصيد يدوي": c.ledger, "باقي مشاريع": c.projectsRemaining, "رصيد فائض المشاريع": c.projectsSurplus || 0, "الإجمالي المستحق": c.total })) : [{ "لا توجد مستحقات": "" }]), "مستحقات العملاء");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(supplierDebts.length ? supplierDebts.map((s) => ({ المورد: s.name, الهاتف: s.phone || "", "المبلغ المستحق": s.total })) : [{ "لا توجد مستحقات": "" }]), "مستحقات للموردين");
    const buf = XLSX.write(wb, { type: "array", bookType: "xlsx" });
    const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const filename = `تقرير-${month}.xlsx`;
    if (downloadsNs) { try { await downloadsNs.save({ filename, data: blob }); } catch (e) { console.error(e); } }
    else downloadBlob(blob, filename);
  };

  return (
    <div className="flex flex-col gap-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div><h1 className="text-xl font-bold" style={{ fontFamily: "'El Messiri', sans-serif", color: "var(--text-strong)" }}>التقارير الشهرية</h1><p className="text-sm mt-0.5" style={{ color: "var(--text-muted)" }}>ملخص شامل لأي شهر تختاره — صافي الحركة النقدية = الواردات − المصاريف − الفواتير</p></div>
        <div className="flex items-center gap-2">
          <TextInput type="month" value={month} onChange={(e) => setMonth(e.target.value)} className="max-w-[170px]" />
          <PrimaryButton onClick={exportMonth}><Icon name="download" size={16} /> تصدير التقرير</PrimaryButton>
        </div>
      </div>

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <StatCard icon="trendUp" label="واردات الشهر" value={fmt(totalIncome)} accent="#4B6350" />
        <StatCard icon="trendDown" label="مصاريف الشهر" value={fmt(totalExpenses)} accent="#A34632" />
        <StatCard icon="receipt" label="فواتير الشهر" value={fmt(totalInvoices)} accent="#8A6A32" />
        <StatCard icon={net >= 0 ? "trendUp" : "trendDown"} label="صافي الحركة النقدية" value={fmt(net)} accent={net >= 0 ? "#4B6350" : "#A34632"} />
      </div>

      <div>
        <h2 className="text-sm font-semibold mb-3" style={{ color: "var(--text-body)" }}>المستحقات حتى اليوم — عملاء وموردون</h2>
        <div className="grid grid-cols-2 lg:grid-cols-3 gap-3 mb-3">
          <StatCard icon="users" label="إجمالي مستحق على العملاء (لنا)" value={fmt(totalCustomerDebt)} sub={customerDebts.length + " عميل مدين"} accent="#A6673B" />
          <StatCard icon="briefcase" label="إجمالي مستحق للموردين (علينا)" value={fmt(totalSupplierDebt)} sub={supplierDebts.length + " مورّد له مستحقات"} accent="#5C4A38" />
          <StatCard icon="wallet" label="إجمالي مستحق لنا من الموردين" value={fmt(totalSupplierCredit)} sub="دفعات زائدة أو أرصدة دائنة" accent="#4B6350" />
        </div>
        <div className="grid lg:grid-cols-2 gap-4">
          <div className="rounded-2xl border p-4" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
            <h3 className="font-semibold text-sm mb-3" style={{ color: "var(--text-body)" }}>تفصيل مستحقات العملاء</h3>
            {customerDebts.length === 0 ? <EmptyState icon="users" title="لا توجد مستحقات على العملاء حاليًا" /> : (
              <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
                {customerDebts.map((c) => (
                  <div key={c.name} className="flex items-center justify-between py-2 text-sm" style={{ borderColor: "var(--divider)" }}>
                    <div>
                      <div style={{ color: "var(--text-body)" }}>{c.name}</div>
                      {c.phone && <div className="text-xs" style={{ color: "var(--text-muted)" }}>{c.phone}</div>}
                    </div>
                    <span className="font-semibold" style={{ color: "#A34632" }}>{fmt(c.total)}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
          <div className="rounded-2xl border p-4" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
            <h3 className="font-semibold text-sm mb-3" style={{ color: "var(--text-body)" }}>تفصيل مستحقات الموردين</h3>
            {supplierDebts.length === 0 ? <EmptyState icon="briefcase" title="لا توجد مستحقات للموردين حاليًا" /> : (
              <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
                {supplierDebts.map((s) => (
                  <div key={s.name} className="flex items-center justify-between py-2 text-sm" style={{ borderColor: "var(--divider)" }}>
                    <div>
                      <div style={{ color: "var(--text-body)" }}>{s.name}</div>
                      {s.phone && <div className="text-xs" style={{ color: "var(--text-muted)" }}>{s.phone}</div>}
                    </div>
                    <span className="font-semibold" style={{ color: "#A34632" }}>{fmt(s.total)}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
        <div className="text-xs mt-2" style={{ color: "var(--text-muted)" }}>مستحقات العملاء تشمل الرصيد اليدوي + باقي كل مشاريعهم غير المسددة بالكامل. هذه الأرقام لحظية (حتى اليوم) وليست خاصة بالشهر المختار فقط.</div>
      </div>

      <div className="grid lg:grid-cols-2 gap-4">
        <div className="rounded-2xl border p-4" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
          <h3 className="font-semibold text-sm mb-3" style={{ color: "var(--text-body)" }}>المصاريف حسب النوع</h3>
          {expenseByType.length === 0 ? <EmptyState icon="wallet" title="لا توجد مصاريف هذا الشهر" /> : <BarBreakdown rows={expenseByType} />}
        </div>
        <div className="rounded-2xl border p-4" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
          <h3 className="font-semibold text-sm mb-3" style={{ color: "var(--text-body)" }}>الفواتير حسب النوع</h3>
          {invoiceByType.length === 0 ? <EmptyState icon="receipt" title="لا توجد فواتير هذا الشهر" /> : <BarBreakdown rows={invoiceByType} />}
        </div>
      </div>

      <div className="rounded-2xl border p-4" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
        <h3 className="font-semibold text-sm mb-3" style={{ color: "var(--text-body)" }}>مشاريع اكتملت هذا الشهر ({completedProjects.length})</h3>
        {completedProjects.length === 0 ? <EmptyState icon="factory" title="لا توجد مشاريع مكتملة هذا الشهر" /> : (
          <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
            {completedProjects.map((p) => (
              <div key={p.id} className="flex items-center justify-between py-2.5" style={{ borderColor: "var(--divider)" }}>
                <div><div className="text-sm" style={{ color: "var(--text-body)" }}>{p.customerName}</div><div className="text-xs" style={{ color: "var(--text-muted)" }}>{p.location}</div></div>
                <span className="font-semibold" style={{ color: "var(--text-strong)" }}>{fmt((p.measurements || []).reduce((s, m) => s + Number(m.totalAmount || 0), 0))}</span>
              </div>
            ))}
          </div>
        )}
        <div className="text-xs mt-3" style={{ color: "var(--text-muted)" }}>مشاريع جديدة بدأت هذا الشهر: {newProjects.length}</div>
      </div>

      {attSummary.length > 0 && (
        <div className="rounded-2xl border p-4" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
          <h3 className="font-semibold text-sm mb-3" style={{ color: "var(--text-body)" }}>أيام حضور العمال هذا الشهر</h3>
          <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
            {attSummary.map((s) => <div key={s.name} className="flex items-center justify-between py-2 text-sm" style={{ color: "var(--text-body)", borderColor: "var(--divider)" }}><span>{s.name}</span><span className="flex items-center gap-2"><Badge bg="var(--good-bg)" fg="#4B6350">حاضر {s.present}</Badge><Badge bg="var(--warn-bg)" fg="#8A6A32">نصف يوم {s.half}</Badge><Badge bg="var(--divider)" fg="var(--text-muted)">غائب {s.absent}</Badge></span></div>)}
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- Personal log ----------
function PersonalLogTab({ data, upsert, remove }) {
  const [showAdd, setShowAdd] = useState(false);
  const [pendingDelete, setPendingDelete] = useState(null);
  const sorted = [...data].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const totalIn = data.filter((x) => x.type === "واصل").reduce((s, x) => s + Number(x.amount || 0), 0);
  const totalOut = data.filter((x) => x.type === "مصروف").reduce((s, x) => s + Number(x.amount || 0), 0);
  return (
    <div className="flex flex-col gap-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div><h1 className="text-xl font-bold" style={{ fontFamily: "'El Messiri', sans-serif", color: "var(--text-strong)" }}>سجلي الشخصي</h1><p className="text-sm mt-0.5" style={{ color: "var(--text-muted)" }}>ما وصلك من مبالغ وما صرفته — سجل خاص بك</p></div>
        <PrimaryButton onClick={() => setShowAdd(true)}><Icon name="plus" size={16} /> تسجيل حركة</PrimaryButton>
      </div>
      <div className="grid grid-cols-3 gap-3">
        <StatCard icon="trendUp" label="إجمالي الواصل" value={fmt(totalIn)} accent="#4B6350" />
        <StatCard icon="trendDown" label="إجمالي المصروف" value={fmt(totalOut)} accent="#A34632" />
        <StatCard icon="wallet" label="المتبقي بيدي" value={fmt(totalIn - totalOut)} accent="#8A6A32" />
      </div>
      {sorted.length === 0 ? <EmptyState icon="wallet" title="لا توجد حركات مسجّلة بعد" /> : (
        <div className="rounded-2xl border overflow-hidden" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
          <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
            {sorted.map((x) => (
              <div key={x.id} className="flex items-center justify-between px-4 py-3 gap-2" style={{ borderColor: "var(--divider)" }}>
                <div className="min-w-0"><div className="text-sm font-medium" style={{ color: "var(--text-body)" }}>{x.type}</div><div className="text-xs mt-0.5" style={{ color: "var(--text-muted)" }}>{x.date} {x.description ? "· " + x.description : ""}</div></div>
                <div className="flex items-center gap-3 shrink-0">
                  <span className="font-semibold" style={{ color: x.type === "واصل" ? "#4B6350" : "#A34632" }}>{x.type === "واصل" ? "+" : "−"}{fmt(x.amount)}</span>
                  {pendingDelete === x.id ? <ConfirmInline onConfirm={() => { remove("personalLog", x.id); setPendingDelete(null); }} onCancel={() => setPendingDelete(null)} /> : <button onClick={() => setPendingDelete(x.id)} style={{ color: "var(--text-muted)" }}><Icon name="trash" size={14} /></button>}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
      {showAdd && <Modal title="تسجيل حركة" onClose={() => setShowAdd(false)}><AddPersonalForm onAdd={(e) => { upsert("personalLog", e); setShowAdd(false); }} /></Modal>}
    </div>
  );
}
function AddPersonalForm({ onAdd }) {
  const [type, setType] = useState("واصل");
  const [amount, setAmount] = useState("");
  const [date, setDate] = useState(todayISO());
  const [description, setDescription] = useState("");
  const submit = () => { if (!positiveNumber(amount) || Number(amount) < 0) { notify("المبلغ يجب أن يكون موجبًا."); return; } onAdd({ id: uid(), type, amount: roundMoney(Number(amount)), date, description: description.trim() }); };
  return (
    <div className="flex flex-col gap-3">
      <div><FieldLabel>النوع</FieldLabel><Select value={type} onChange={(e) => setType(e.target.value)}><option value="واصل">واصل (مبلغ استلمته)</option><option value="مصروف">مصروف (صرفته)</option></Select></div>
      <div className="grid grid-cols-2 gap-3"><div><FieldLabel>المبلغ</FieldLabel><TextInput type="number" value={amount} onChange={(e) => setAmount(e.target.value)} /></div><div><FieldLabel>التاريخ</FieldLabel><TextInput type="date" value={date} onChange={(e) => setDate(e.target.value)} /></div></div>
      <div><FieldLabel>وصف (اختياري)</FieldLabel><TextInput value={description} onChange={(e) => setDescription(e.target.value)} /></div>
      <PrimaryButton onClick={submit} full disabled={!amount}><Icon name="plus" size={16} /> حفظ</PrimaryButton>
    </div>
  );
}

// ---------- Daily expenses ----------
function DailyExpensesTab({ expenses, treasury, upsert, remove }) {
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [pendingDelete, setPendingDelete] = useState(null);
  const total = expenses.reduce((sum, item) => sum + Number(item.amount || 0), 0);
  const save = (expense) => {
    const currentTreasury = treasury?.[0] || { id: "main", openingBalance: 0, transactions: [] };
    const transaction = { id: uid(), date: expense.date, direction: "out", amount: roundMoney(Number(expense.amount)), expenseId: expense.id, note: expense.category + (expense.description ? " · " + expense.description : "") };
    const retainedTransactions = (currentTreasury.transactions || []).filter((item) => item.expenseId !== expense.id);
    const nextBalance = Number(currentTreasury.openingBalance || 0) + [...retainedTransactions, transaction].reduce((sum, item) => sum + Number(item.direction === "in" ? item.amount : -item.amount), 0);
    if (nextBalance < 0) { notify("لا يمكن تسجيل المصروف: رصيد الخزينة لا يكفي."); return; }
    upsert("expenses", expense);
    upsert("treasury", { ...currentTreasury, transactions: [transaction, ...retainedTransactions] });
    setShowForm(false); setEditing(null);
  };
  const deleteExpense = (expense) => {
    remove("expenses", expense.id);
    const currentTreasury = treasury?.[0];
    if (currentTreasury) upsert("treasury", { ...currentTreasury, transactions: (currentTreasury.transactions || []).filter((item) => item.expenseId !== expense.id) });
    setPendingDelete(null);
  };
  const sorted = [...expenses].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  return <div className="flex flex-col gap-5">
    <div className="flex items-center justify-between flex-wrap gap-3"><div><h1 className="text-xl font-bold" style={{ fontFamily: "'El Messiri', sans-serif", color: "var(--text-strong)" }}>المصروفات اليومية</h1><p className="text-sm mt-0.5" style={{ color: "var(--text-muted)" }}>الكهرباء والإيجار والرواتب والصيانة وغيرها من مصروفات المطحنة</p></div><PrimaryButton onClick={() => setShowForm(true)}><Icon name="plus" size={16} /> تسجيل مصروف</PrimaryButton></div>
    <StatCard icon="trendDown" label="إجمالي المصروفات" value={fmt(total)} accent="#A34632" />
    {sorted.length === 0 ? <EmptyState icon="wallet" title="لا توجد مصروفات مسجلة" /> : <div className="rounded-2xl border overflow-hidden" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>{sorted.map((expense) => <div key={expense.id} className="flex items-center justify-between gap-3 px-4 py-3 border-b" style={{ borderColor: "var(--divider)" }}><div><div className="text-sm font-medium" style={{ color: "var(--text-body)" }}>{expense.category}</div><div className="text-xs" style={{ color: "var(--text-muted)" }}>{expense.date}{expense.description ? " · " + expense.description : ""}</div></div><div className="flex items-center gap-3"><span className="font-semibold" style={{ color: "#A34632" }}>−{fmt(expense.amount)}</span>{pendingDelete === expense.id ? <ConfirmInline onConfirm={() => deleteExpense(expense)} onCancel={() => setPendingDelete(null)} /> : <><button onClick={() => setEditing(expense)} className="text-xs" style={{ color: "var(--accent)" }}>تعديل</button><button onClick={() => setPendingDelete(expense.id)} style={{ color: "var(--text-muted)" }}><Icon name="trash" size={14} /></button></>}</div></div>)}</div>}
    {(showForm || editing) && <Modal title={editing ? "تعديل مصروف" : "مصروف يومي جديد"} onClose={() => { setShowForm(false); setEditing(null); }}><DailyExpenseForm initial={editing} onSave={save} /></Modal>}
  </div>;
}

function DailyExpenseForm({ initial, onSave }) {
  const [category, setCategory] = useState(initial?.category || EXPENSE_TYPES[0]);
  const [amount, setAmount] = useState(initial?.amount ? String(initial.amount) : "");
  const [date, setDate] = useState(initial?.date || todayISO());
  const [description, setDescription] = useState(initial?.description || "");
  const submit = () => { if (!positiveNumber(amount)) { notify("أدخل مبلغًا موجبًا."); return; } onSave({ id: initial?.id || uid(), category, amount: roundMoney(Number(amount)), date, description: description.trim() }); };
  return <div className="flex flex-col gap-3"><div><FieldLabel>بند المصروف</FieldLabel><Select value={category} onChange={(e) => setCategory(e.target.value)}>{EXPENSE_TYPES.map((item) => <option key={item}>{item}</option>)}</Select></div><div className="grid grid-cols-2 gap-3"><div><FieldLabel>المبلغ</FieldLabel><TextInput type="number" value={amount} onChange={(e) => setAmount(e.target.value)} /></div><div><FieldLabel>التاريخ</FieldLabel><TextInput type="date" value={date} onChange={(e) => setDate(e.target.value)} /></div></div><div><FieldLabel>البيان (اختياري)</FieldLabel><TextInput value={description} onChange={(e) => setDescription(e.target.value)} /></div><PrimaryButton onClick={submit} full disabled={!amount}>حفظ المصروف</PrimaryButton></div>;
}

// ---------- Monthly reports ----------
function MillReportsTab({ month, setMonth, invoices, expenses, customers, suppliers, inventory, inventoryMovements, treasury }) {
  const inMonth = (items) => items.filter((item) => monthKey(item.date) === month);
  const monthInvoices = inMonth(invoices);
  const monthExpenses = inMonth(expenses);
  const purchases = roundMoney(monthInvoices.filter((item) => item.direction === "purchase").reduce((sum, item) => sum + Number(item.amount || 0) * (item.isReturn ? -1 : 1), 0));
  const sales = roundMoney(monthInvoices.filter((item) => item.direction === "sale").reduce((sum, item) => sum + Number(item.amount || 0) * (item.isReturn ? -1 : 1), 0));
  const expenseTotal = monthExpenses.reduce((sum, item) => sum + Number(item.amount || 0), 0);
  const costOfGoodsSold = roundMoney(monthInvoices.filter((item) => item.direction === "sale").reduce((sum, invoice) => sum + (invoice.items || []).reduce((itemSum, line) => itemSum + Number(line.quantity || 0) * Number(line.costUnitPrice || 0) * (invoice.isReturn ? -1 : 1), 0), 0));
  const netProfit = roundMoney(sales - costOfGoodsSold - expenseTotal);
  const inventoryValue = roundMoney(inventory.reduce((sum, item) => sum + Number(item.quantity || 0) * Number(item.averageCost || 0), 0));
  const customerDebts = customers.map((item) => ({ ...item, balance: contactBalance(item) })).filter((item) => item.balance > 0).sort((a, b) => b.balance - a.balance);
  const supplierStatements = suppliers.map((item) => ({ ...item, statement: getSupplierStatement(item, invoices) })).filter((item) => item.statement.owed > 0 || item.statement.credit > 0);
  const currentTreasury = treasury?.[0] || { openingBalance: 0, transactions: [] };
  const cashBalance = Number(currentTreasury.openingBalance || 0) + (currentTreasury.transactions || []).reduce((sum, item) => sum + Number(item.direction === "in" ? item.amount : -item.amount), 0);
  const lowStock = inventory.filter((item) => Number(item.quantity) <= Number(item.minThreshold || 0));
  return <div className="flex flex-col gap-5"><div className="flex items-center justify-between flex-wrap gap-3"><div><h1 className="text-xl font-bold" style={{ fontFamily: "'El Messiri', sans-serif", color: "var(--text-strong)" }}>التقارير الشهرية</h1><p className="text-sm mt-0.5" style={{ color: "var(--text-muted)" }}>ملخص المبيعات والمشتريات والمصروفات والمستحقات والخزينة</p></div><TextInput type="month" value={month} onChange={(e) => setMonth(e.target.value)} className="max-w-[170px]" /></div>
    <div className="grid grid-cols-2 lg:grid-cols-3 gap-3"><StatCard icon="trendUp" label="مبيعات الشهر" value={fmt(sales)} accent="#4B6350" /><StatCard icon="truck" label="مشتريات الشهر" value={fmt(purchases)} accent="#8A6A32" /><StatCard icon="package" label="تكلفة البضاعة المباعة" value={fmt(costOfGoodsSold)} accent="#8A6A32" /><StatCard icon="trendDown" label="المصروفات" value={fmt(expenseTotal)} accent="#A34632" /><StatCard icon={netProfit >= 0 ? "trendUp" : "trendDown"} label="صافي الربح التقريبي" value={fmt(netProfit)} accent={netProfit >= 0 ? "#4B6350" : "#A34632"} /><StatCard icon="wallet" label="رصيد الخزينة" value={fmt(cashBalance)} accent="#6E8F72" /></div>
    <div className="grid lg:grid-cols-2 gap-4"><ReportList title="مستحقات العملاء لنا" empty="لا توجد مستحقات على العملاء" items={customerDebts.map((item) => ({ name: item.name, value: fmt(item.balance) }))} /><ReportList title="حسابات الموردين" empty="لا توجد مستحقات للموردين" items={supplierStatements.map((item) => ({ name: item.name, value: item.statement.owed > 0 ? "علينا " + fmt(item.statement.owed) : "لنا " + fmt(item.statement.credit) }))} /></div>
    <div className="rounded-2xl border p-4" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}><h3 className="font-semibold text-sm mb-3" style={{ color: "var(--text-body)" }}>ملخص المخزون</h3><div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm"><div><span className="text-xs" style={{ color: "var(--text-muted)" }}>عدد الأصناف</span><strong className="block mt-1" style={{ color: "var(--text-strong)" }}>{inventory.length}</strong></div><div><span className="text-xs" style={{ color: "var(--text-muted)" }}>قيمة المخزون بالتكلفة</span><strong className="block mt-1" style={{ color: "var(--text-strong)" }}>{fmt(inventoryValue)}</strong></div><div><span className="text-xs" style={{ color: "var(--text-muted)" }}>أصناف منخفضة</span><strong className="block mt-1" style={{ color: lowStock.length ? "#A34632" : "#4B6350" }}>{lowStock.length}</strong></div><div><span className="text-xs" style={{ color: "var(--text-muted)" }}>حركات الشهر</span><strong className="block mt-1" style={{ color: "var(--text-strong)" }}>{inMonth(inventoryMovements).length}</strong></div></div></div>
  </div>;
}

function ReportList({ title, empty, items }) { return <div className="rounded-2xl border p-4" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}><h3 className="font-semibold text-sm mb-3" style={{ color: "var(--text-body)" }}>{title}</h3>{items.length === 0 ? <EmptyState icon="users" title={empty} /> : <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>{items.map((item) => <div key={item.name} className="flex items-center justify-between py-2 text-sm" style={{ borderColor: "var(--divider)" }}><span style={{ color: "var(--text-body)" }}>{item.name}</span><strong style={{ color: "#A34632" }}>{item.value}</strong></div>)}</div>}</div>; }

const CASHFLOW_PAYMENT_MODES = {
  customerReceipt: { partyType: "customer", cashDirection: "in", ledgerType: "credit", transactionFlag: "customerPayment", title: "سند قبض من عميل", action: "قبض من عميل", partyLabel: "العميل", ledgerLabel: "قبض من العميل", notePlaceholder: "مثال: سداد دفعة الفاتورة", allocationMethod: "customer", success: "تم تسجيل القبض وتحديث حساب العميل والخزينة." },
  supplierPayment: { partyType: "supplier", cashDirection: "out", ledgerType: "credit", transactionFlag: "supplierPayment", title: "سند صرف إلى مورد", action: "صرف إلى مورد", partyLabel: "المورد", ledgerLabel: "صرف إلى المورد", notePlaceholder: "مثال: دفعة للمورد", allocationMethod: "supplier", success: "تم تسجيل الصرف وتحديث حساب المورد والخزينة." },
  customerRefund: { partyType: "customer", cashDirection: "out", ledgerType: "debit", transactionFlag: "customerRefund", title: "سند صرف إلى عميل", action: "صرف إلى عميل", partyLabel: "العميل", ledgerLabel: "صرف إلى العميل", notePlaceholder: "مثال: رد دفعة أو مبلغ مرتجع", allocationMethod: null, success: "تم تسجيل الصرف للعميل وتحديث حسابه والخزينة." },
  supplierReceipt: { partyType: "supplier", cashDirection: "in", ledgerType: "credit", transactionFlag: "supplierReceipt", title: "سند قبض من مورد", action: "قبض من مورد", partyLabel: "المورد", ledgerLabel: "قبض من المورد", notePlaceholder: "مثال: استرداد مبلغ مرتجع أو دفعة زائدة", allocationMethod: "supplier", success: "تم تسجيل القبض من المورد وتحديث حسابه وفواتيره والخزينة." },
};

function CashflowPaymentForm({ customers, suppliers, invoices, paymentType, record, upsertBatch, onClose }) {
  const config = CASHFLOW_PAYMENT_MODES[paymentType];
  const parties = config.partyType === "customer" ? customers : suppliers;
  const [partyId, setPartyId] = useState("");
  const [amount, setAmount] = useState("");
  const [date, setDate] = useState(todayISO());
  const [note, setNote] = useState("");
  const [saving, setSaving] = useState(false);
  const party = parties.find((item) => item.id === partyId);
  const cashBalance = Number(record.openingBalance || 0) + (record.transactions || []).reduce((sum, tx) => sum + Number(tx.direction === "in" ? tx.amount : -tx.amount), 0);
  const getAllocations = (value) => {
    if (!party || !config.allocationMethod) return [];
    return config.allocationMethod === "customer" ? allocateCustomerPayment(party, invoices, value) : allocateSupplierPayment(party, invoices, value);
  };
  const submit = async () => {
    const value = roundMoney(Number(amount));
    if (!party) { notify(`اختر ${config.partyLabel} أولًا.`); return; }
    if (!positiveNumber(value)) { notify("أدخل مبلغًا موجبًا صحيحًا."); return; }
    if (!date) { notify("أدخل تاريخ الحركة."); return; }
    if (config.cashDirection === "out" && value > cashBalance) { notify("لا يمكن صرف مبلغ أكبر من رصيد الخزينة."); return; }

    const allocations = getAllocations(value);
    const paymentId = uid();
    const paymentNote = note.trim() || config.ledgerLabel;
    const payment = {
      id: paymentId, date, type: config.ledgerType, amount: value, note: paymentNote,
      [config.transactionFlag]: true,
      allocations,
      ...(allocations.length === 1 ? { invoiceId: allocations[0].invoiceId } : {}),
    };
    const updatedParty = { ...party, transactions: [payment, ...(party.transactions || [])] };
    const cashTransaction = {
      id: uid(), paymentId, date, direction: config.cashDirection, amount: value, source: "contact-payment", paymentType,
      partyId: party.id, partyType: config.partyType, partyName: party.name,
      note: `${config.ledgerLabel} ${party.name} · ${paymentNote}`,
    };
    const updatedTreasury = { ...record, id: record.id || "main", transactions: [cashTransaction, ...(record.transactions || [])] };
    const changedInvoices = new Map();
    allocations.forEach((allocation) => {
      const invoice = invoices.find((item) => item.id === allocation.invoiceId);
      if (!invoice) return;
      const currentPaid = getInvoicePaidAmount(invoice);
      const currentOutstanding = getInvoiceOutstanding(invoice, invoices);
      const isFullySettled = Number(allocation.amount || 0) >= currentOutstanding;
      const amountAfterPayment = isFullySettled
        ? Math.max(0, roundMoney(Number(invoice.amount || 0) - getInvoiceReturnedAmount(invoice.id, invoices)))
        : roundMoney(Math.min(Number(invoice.amount || 0), currentPaid + Number(allocation.amount || 0)));
      changedInvoices.set(invoice.id, {
        ...invoice,
        paidAmount: amountAfterPayment,
        initialPaidAmount: getInvoiceInitialPaidAmount(invoice, customers, suppliers),
        paymentStatus: getInvoicePaymentStatus({ ...invoice, paidAmount: amountAfterPayment }, invoices),
      });
    });

    setSaving(true);
    try {
      const records = [
        { collection: config.partyType === "customer" ? "customers" : "suppliers", record: updatedParty },
        { collection: "treasury", record: updatedTreasury },
        ...Array.from(changedInvoices.values()).map((invoice) => ({ collection: "invoices", record: invoice })),
      ];
      const saved = await upsertBatch(records);
      if (!saved) { notify("تعذر حفظ السند كاملًا. لم تُحفظ أي من قيوده؛ راجع إعداد قاعدة البيانات وحاول مجددًا."); return; }
      notify(config.success, "success");
      onClose();
    } catch (error) {
      console.error("Payment posting failed", error);
      notify("تعذر حفظ السند: " + (error?.message || "خطأ غير معروف"));
    } finally {
      setSaving(false);
    }
  };
  const allocationsPreview = party && positiveNumber(amount) ? getAllocations(Number(amount)) : [];
  return <div className="flex flex-col gap-3">
    <div><FieldLabel>{config.partyLabel}</FieldLabel><SearchablePicker items={parties} value={partyId} onSelect={setPartyId} placeholder={`اختر ${config.partyLabel} بالاسم أو الهاتف...`} getLabel={(item) => item.name + (item.phone ? " — " + item.phone : "")} getSearchText={(item) => [item.name, item.phone].filter(Boolean).join(" ")} /></div>
    <div className="grid grid-cols-2 gap-3"><div><FieldLabel>المبلغ</FieldLabel><TextInput type="number" min="0.01" step="0.01" value={amount} onChange={(event) => setAmount(event.target.value)} placeholder="0.00" /></div><div><FieldLabel>التاريخ</FieldLabel><TextInput type="date" value={date} onChange={(event) => setDate(event.target.value)} /></div></div>
    <div><FieldLabel>البيان (اختياري)</FieldLabel><TextInput value={note} onChange={(event) => setNote(event.target.value)} placeholder={config.notePlaceholder} /></div>
    <div className="rounded-lg p-3 text-xs leading-6" style={{ background: "var(--divider)", color: "var(--text-body)" }}>
      {config.cashDirection === "out" && <div><strong>رصيد الخزينة المتاح:</strong> {fmt(cashBalance)}</div>}
      {config.allocationMethod ? <div>سيتم توزيع المبلغ على أقدم الفواتير المستحقة{config.partyType === "customer" ? " للعميل" : " للمورد"}. والفائض يسوّي أي رصيد يدوي قائم أولًا، ثم يظهر رصيدًا دائنًا للجهة.</div> : <div>سيُسجّل المبلغ كصرف للعميل، فيُخصم من رصيده الدائن إن وجد. لا يغيّر هذا السند سداد فاتورة بيع مباشرة.</div>}
      {party && config.allocationMethod && <div><strong>الفواتير التي سيُخصّص لها المبلغ:</strong> {allocationsPreview.length ? allocationsPreview.map((allocation) => {
        const invoice = invoices.find((item) => item.id === allocation.invoiceId);
        return `#${invoice?.invoiceNumber || invoice?.id}: ${fmt(allocation.amount)}`;
      }).join(" · ") : "لا توجد فواتير مستحقة؛ سيُسجّل المبلغ في حساب الجهة."}</div>}
    </div>
    <div className="flex flex-wrap gap-2"><PrimaryButton onClick={submit} disabled={saving || !partyId || !positiveNumber(amount)}><Icon name={config.cashDirection === "in" ? "plus" : "minus"} size={15} /> {saving ? "جارٍ الحفظ..." : `تسجيل ${config.action}`}</PrimaryButton><GhostButton onClick={onClose}>إلغاء</GhostButton></div>
  </div>;
}

// ---------- Cashflow overview ----------
function CashflowTab({ customers = [], suppliers = [], invoices = [], treasury = [], upsertBatch }) {
  const [paymentType, setPaymentType] = useState(null);
  const record = treasury?.[0] || { id: "main", openingBalance: 0, transactions: [] };
  const treasuryRows = [...(record.transactions || [])].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const customerRows = customers.flatMap((contact) => (contact.transactions || []).map((tx) => ({ ...tx, partyName: contact.name, partyLabel: "عميل", kindLabel: tx.customerPayment ? "قبض من العميل" : tx.customerRefund ? "صرف للعميل" : tx.type === "debit" ? "زيادة دين" : "تسديد" }))).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const supplierRows = suppliers.flatMap((contact) => (contact.transactions || []).map((tx) => ({ ...tx, partyName: contact.name, partyLabel: "مورد", kindLabel: tx.supplierPayment ? "صرف للمورد" : tx.supplierReceipt ? "قبض من المورد" : tx.type === "credit" ? "تسوية" : "زيادة رصيد" }))).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const totalIn = treasuryRows.filter((tx) => tx.direction === "in").reduce((sum, tx) => sum + Number(tx.amount || 0), 0);
  const totalOut = treasuryRows.filter((tx) => tx.direction === "out").reduce((sum, tx) => sum + Number(tx.amount || 0), 0);
  const balance = Number(record.openingBalance || 0) + totalIn - totalOut;

  return (
    <div className="flex flex-col gap-5">
      <div className="flex items-center justify-between flex-wrap gap-3"><div><h1 className="text-xl font-bold" style={{ fontFamily: "'El Messiri', sans-serif", color: "var(--text-strong)" }}>القبض والصرف</h1><p className="text-sm mt-0.5" style={{ color: "var(--text-muted)" }}>ملخص الحركة النقدية وحركات العملاء والموردين</p></div><div className="flex flex-wrap justify-end gap-2"><PrimaryButton onClick={() => setPaymentType("customerReceipt")}><Icon name="plus" size={15} /> قبض من عميل</PrimaryButton><GhostButton onClick={() => setPaymentType("supplierPayment")}><Icon name="minus" size={15} /> صرف إلى مورد</GhostButton><GhostButton onClick={() => setPaymentType("customerRefund")}><Icon name="minus" size={15} /> صرف إلى عميل</GhostButton><PrimaryButton onClick={() => setPaymentType("supplierReceipt")}><Icon name="plus" size={15} /> قبض من مورد</PrimaryButton></div></div>
      <div className="grid sm:grid-cols-3 gap-3">
        <StatCard icon="wallet" label="الرصيد الحالي" value={fmt(balance)} accent={balance >= 0 ? "#4B6350" : "#A34632"} />
        <StatCard icon="trendUp" label="إجمالي القبض" value={fmt(totalIn)} accent="#6E8F72" />
        <StatCard icon="trendDown" label="إجمالي الصرف" value={fmt(totalOut)} accent="#A34632" />
      </div>

      <div className="rounded-2xl border p-4" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
        <div className="mb-3 text-sm font-semibold" style={{ color: "var(--text-body)" }}>سجل الخزينة</div>
        {treasuryRows.length === 0 ? <EmptyState icon="wallet" title="لا توجد حركات خزينة بعد" /> : (
          <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
            {treasuryRows.map((tx) => (
              <div key={tx.id} className="flex items-center justify-between py-2.5 gap-3" style={{ borderColor: "var(--divider)" }}>
                <div className="min-w-0">
                  <div className="text-sm" style={{ color: "var(--text-body)" }}>{tx.note || (tx.direction === "in" ? "قبض" : "صرف")}</div>
                  <div className="text-xs" style={{ color: "var(--text-muted)" }}>{tx.date || "-"} · {tx.source === "contact-payment" ? "سند عميل/مورد" : tx.source === "invoice" ? "فاتورة" : tx.source === "invoice-return" ? "مرتجع" : tx.source === "manual" ? "يدوي" : tx.source || "حركة يدوية"}</div>
                </div>
                <span className="font-medium" style={{ color: tx.direction === "in" ? "#4B6350" : "#A34632" }}>{tx.direction === "in" ? "+" : "−"}{fmt(tx.amount)}</span>
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="grid lg:grid-cols-2 gap-4">
        <div className="rounded-2xl border p-4" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
          <div className="mb-3 text-sm font-semibold" style={{ color: "var(--text-body)" }}>حركات العملاء</div>
          {customerRows.length === 0 ? <EmptyState icon="users" title="لا توجد حركات عملاء" /> : (
            <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
              {customerRows.slice(0, 12).map((tx) => (
                <div key={tx.id} className="flex items-center justify-between py-2.5 gap-3" style={{ borderColor: "var(--divider)" }}>
                  <div className="min-w-0">
                    <div className="text-sm" style={{ color: "var(--text-body)" }}>{tx.partyName}</div>
                    <div className="text-xs" style={{ color: "var(--text-muted)" }}>{tx.date || "-"}</div>
                  </div>
                  <span className="font-medium" style={{ color: tx.type === "credit" ? "#4B6350" : "#A34632" }}>{tx.kindLabel} {fmt(tx.amount)}</span>
                </div>
              ))}
            </div>
          )}
        </div>

        <div className="rounded-2xl border p-4" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
          <div className="mb-3 text-sm font-semibold" style={{ color: "var(--text-body)" }}>حركات الموردين</div>
          {supplierRows.length === 0 ? <EmptyState icon="briefcase" title="لا توجد حركات موردين" /> : (
            <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
              {supplierRows.slice(0, 12).map((tx) => (
                <div key={tx.id} className="flex items-center justify-between py-2.5 gap-3" style={{ borderColor: "var(--divider)" }}>
                  <div className="min-w-0">
                    <div className="text-sm" style={{ color: "var(--text-body)" }}>{tx.partyName}</div>
                    <div className="text-xs" style={{ color: "var(--text-muted)" }}>{tx.date || "-"}</div>
                  </div>
                  <span className="font-medium" style={{ color: tx.type === "credit" ? "#4B6350" : "#A34632" }}>{tx.kindLabel} {fmt(tx.amount)}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
      {paymentType && <Modal title={CASHFLOW_PAYMENT_MODES[paymentType].title} onClose={() => setPaymentType(null)}><CashflowPaymentForm customers={customers} suppliers={suppliers} invoices={invoices} paymentType={paymentType} record={record} upsertBatch={upsertBatch} onClose={() => setPaymentType(null)} /></Modal>}
    </div>
  );
}

// ---------- Main treasury ----------
function TreasuryTab({ treasury, upsert }) {
  const record = treasury?.[0] || { id: "main", openingBalance: 0, transactions: [] };
  const [openingBalance, setOpeningBalance] = useState(String(record.openingBalance || 0));
  const [manualDirection, setManualDirection] = useState("in");
  const [manualAmount, setManualAmount] = useState("");
  const [manualDate, setManualDate] = useState(todayISO());
  const [manualNote, setManualNote] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [pendingDelete, setPendingDelete] = useState(null);
  const balance = Number(record.openingBalance || 0) + (record.transactions || []).reduce((sum, tx) => sum + Number(tx.direction === "in" ? tx.amount : -tx.amount), 0);
  const saveOpening = () => {
    if (!nonNegativeNumber(openingBalance)) { notify("أدخل مبلغًا أساسيًا غير سالب."); return; }
    const movements = (record.transactions || []).reduce((sum, tx) => sum + Number(tx.direction === "in" ? tx.amount : -tx.amount), 0);
    if (Number(openingBalance) + movements < 0) { notify("لا يمكن حفظ مبلغ أساسي يجعل رصيد الخزينة سالبًا."); return; }
    upsert("treasury", { ...record, openingBalance: roundMoney(Number(openingBalance)) });
    notify("تم حفظ المبلغ الأساسي للخزينة.", "success");
  };
  const addManualTransaction = () => {
    if (!positiveNumber(manualAmount)) { notify("أدخل مبلغًا موجبًا للحركة."); return; }
    const transaction = { id: editingId || uid(), date: manualDate || todayISO(), direction: manualDirection, amount: roundMoney(Number(manualAmount)), source: "manual", note: manualNote.trim() || (manualDirection === "in" ? "قبض يدوي" : "صرف يدوي") };
    const transactions = [transaction, ...(record.transactions || []).filter((tx) => tx.id !== editingId)];
    const nextBalance = Number(record.openingBalance || 0) + transactions.reduce((sum, tx) => sum + Number(tx.direction === "in" ? tx.amount : -tx.amount), 0);
    if (nextBalance < 0) { notify("لا يمكن تسجيل الحركة: رصيد الخزينة سيصبح سالبًا."); return; }
    upsert("treasury", { ...record, transactions });
    setEditingId(null); setManualAmount(""); setManualNote(""); setManualDate(todayISO());
    notify(editingId ? "تم تعديل حركة الخزينة." : "تم تسجيل حركة الخزينة.", "success");
  };
  const editManualTransaction = (transaction) => {
    setEditingId(transaction.id); setManualDirection(transaction.direction); setManualAmount(String(transaction.amount));
    setManualDate(transaction.date || todayISO()); setManualNote(transaction.note || "");
  };
  const deleteManualTransaction = (id) => {
    upsert("treasury", { ...record, transactions: (record.transactions || []).filter((tx) => tx.id !== id) });
    setPendingDelete(null);
  };
  return <div className="flex flex-col gap-5">
    <div><h1 className="text-xl font-bold" style={{ fontFamily: "'El Messiri', sans-serif", color: "var(--text-strong)" }}>الخزينة الرئيسية</h1><p className="text-sm mt-0.5" style={{ color: "var(--text-muted)" }}>المبلغ الأساسي وجميع حركات القبض والصرف</p></div>
    <div className="grid sm:grid-cols-3 gap-3"><StatCard icon="wallet" label="الرصيد الحالي" value={fmt(balance)} accent={balance >= 0 ? "#4B6350" : "#A34632"} /> <StatCard icon="trendUp" label="إجمالي القبض" value={fmt((record.transactions || []).filter((tx) => tx.direction === "in").reduce((sum, tx) => sum + Number(tx.amount || 0), 0))} accent="#6E8F72" /><StatCard icon="trendDown" label="إجمالي الصرف" value={fmt((record.transactions || []).filter((tx) => tx.direction === "out").reduce((sum, tx) => sum + Number(tx.amount || 0), 0))} accent="#A34632" /></div>
    <div className="rounded-2xl border p-4 flex flex-col gap-3" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}><FieldLabel>المبلغ الأساسي للخزينة</FieldLabel><div className="flex gap-2"><TextInput type="number" value={openingBalance} onChange={(e) => setOpeningBalance(e.target.value)} /><PrimaryButton onClick={saveOpening}>حفظ المبلغ الأساسي</PrimaryButton></div></div>
    <div className="rounded-2xl border p-4 flex flex-col gap-3" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}><FieldLabel>{editingId ? "تعديل حركة يدوية" : "إضافة حركة يدوية"}</FieldLabel><div className="grid sm:grid-cols-4 gap-2"><Select value={manualDirection} onChange={(e) => setManualDirection(e.target.value)}><option value="in">قبض</option><option value="out">صرف</option></Select><TextInput type="number" placeholder="المبلغ" value={manualAmount} onChange={(e) => setManualAmount(e.target.value)} /><TextInput type="date" value={manualDate} onChange={(e) => setManualDate(e.target.value)} /><TextInput placeholder="البيان" value={manualNote} onChange={(e) => setManualNote(e.target.value)} /></div><div className="flex gap-2"><PrimaryButton onClick={addManualTransaction} disabled={!manualAmount}><Icon name="plus" size={15} /> {editingId ? "حفظ التعديل" : "تسجيل الحركة"}</PrimaryButton>{editingId && <GhostButton onClick={() => { setEditingId(null); setManualAmount(""); setManualNote(""); }}>إلغاء</GhostButton>}</div></div>
    {(record.transactions || []).length === 0 ? <EmptyState icon="wallet" title="لا توجد حركات خزينة بعد" /> : <div className="rounded-2xl border overflow-hidden" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>{[...(record.transactions || [])].sort((a, b) => (b.date || "").localeCompare(a.date || "")).map((tx) => <div key={tx.id} className="flex items-center justify-between px-4 py-3 border-b gap-3" style={{ borderColor: "var(--divider)" }}><div><div className="text-sm" style={{ color: "var(--text-body)" }}>{tx.note || (tx.direction === "in" ? "قبض" : "صرف")}</div><div className="text-xs" style={{ color: "var(--text-muted)" }}>{tx.date}</div></div><div className="flex items-center gap-3"><span className="font-semibold" style={{ color: tx.direction === "in" ? "#4B6350" : "#A34632" }}>{tx.direction === "in" ? "+" : "−"}{fmt(tx.amount)}</span>{tx.source === "manual" && (pendingDelete === tx.id ? <ConfirmInline onConfirm={() => deleteManualTransaction(tx.id)} onCancel={() => setPendingDelete(null)} /> : <><button onClick={() => editManualTransaction(tx)} className="text-xs" style={{ color: "var(--accent)" }}>تعديل</button><button onClick={() => setPendingDelete(tx.id)} style={{ color: "var(--text-muted)" }}><Icon name="trash" size={13} /></button></>)}</div></div>)}</div>}
  </div>;
}

// ---------- Inventory ----------
function InventoryTab({ inventory, inventoryMovements, invoices, upsert, remove }) {
  const [showAdd, setShowAdd] = useState(false);
  const [pendingDelete, setPendingDelete] = useState(null);
  const adjust = (item, delta) => {
    const current = Number(item.quantity);
    if (!Number.isFinite(current)) return;
    if (current + delta < 0) { notify(`لا يمكن خفض مخزون «${item.name}» إلى أقل من صفر.`); return; }
    upsert("inventory", { ...item, quantity: Math.max(0, current + delta) });
    upsert("inventoryMovements", { id: uid(), date: todayISO(), itemId: item.id, itemName: item.name, direction: delta > 0 ? "in" : "out", quantity: Math.abs(delta), source: "manual", note: "تعديل يدوي" });
  };
  const deleteItem = (item) => {
    if (invoices.some((invoice) => (invoice.items || []).some((line) => line.inventoryId === item.id || (!line.inventoryId && normalizeName(line.name) === normalizeName(item.name))))) {
      notify(`لا يمكن حذف «${item.name}» لارتباطه بفواتير.`);
      setPendingDelete(null);
      return;
    }
    remove("inventory", item.id);
    setPendingDelete(null);
  };
  return (
    <div className="flex flex-col gap-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div><h1 className="text-xl font-bold" style={{ fontFamily: "'El Messiri', sans-serif", color: "var(--text-strong)" }}>المخزون</h1><p className="text-sm mt-0.5" style={{ color: "var(--text-muted)" }}>بضاعة مخزّنة في المكتب ومتابعة نقصها</p></div>
        <PrimaryButton onClick={() => setShowAdd(true)}><Icon name="plus" size={16} /> مادة جديدة</PrimaryButton>
      </div>
      {inventory.length === 0 ? <EmptyState icon="package" title="لا توجد مواد مسجّلة في المخزون" /> : (
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
          {inventory.map((i) => {
            const low = Number(i.quantity) <= Number(i.minThreshold || 0);
            return (
              <div key={i.id} className="rounded-2xl border p-4 flex flex-col gap-3" style={{ borderColor: low ? "var(--warn-border)" : "var(--card-border)", background: low ? "var(--warn-bg)" : "var(--card-bg)" }}>
                <div className="flex items-start justify-between">
                  <div><div className="font-medium" style={{ color: "var(--text-strong)" }}>{i.name}</div>{low && <div className="text-xs flex items-center gap-1 mt-0.5" style={{ color: "#A34632" }}><Icon name="alert" size={11} /> منخفض</div>}</div>
                  {pendingDelete === i.id ? <ConfirmInline onConfirm={() => deleteItem(i)} onCancel={() => setPendingDelete(null)} /> : <button onClick={() => setPendingDelete(i.id)} style={{ color: "var(--text-muted)" }}><Icon name="trash" size={14} /></button>}
                </div>
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <button onClick={() => adjust(i, -1)} className="w-7 h-7 rounded-lg border flex items-center justify-center" style={{ borderColor: "var(--card-border)", color: "var(--text-body)" }}>−</button>
                    <span className="text-lg font-bold min-w-[50px] text-center" style={{ color: "var(--text-strong)" }}>{fmt(i.quantity)}</span>
                    <button onClick={() => adjust(i, 1)} className="w-7 h-7 rounded-lg border flex items-center justify-center" style={{ borderColor: "var(--card-border)", color: "var(--text-body)" }}>+</button>
                  </div>
                  <span className="text-xs" style={{ color: "var(--text-muted)" }}>{i.unit}</span>
                </div>
                <div className="text-xs" style={{ color: "var(--text-muted)" }}>التكلفة: {fmt(i.averageCost || 0)} للوحدة · الحد الأدنى: {fmt(i.minThreshold)} {i.unit}</div>
              </div>
            );
          })}
        </div>
      )}
      <div className="rounded-2xl border p-4" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}><h3 className="font-semibold text-sm mb-3" style={{ color: "var(--text-body)" }}>آخر حركات المخزن</h3>{(inventoryMovements || []).length === 0 ? <div className="text-xs" style={{ color: "var(--text-muted)" }}>لا توجد حركات مسجلة بعد</div> : [...inventoryMovements].sort((a, b) => (b.date || "").localeCompare(a.date || "")).slice(0, 10).map((movement) => <div key={movement.id} className="flex items-center justify-between py-2 border-b text-xs" style={{ borderColor: "var(--divider)" }}><span style={{ color: "var(--text-body)" }}>{movement.itemName} · {movement.note}</span><span style={{ color: movement.direction === "in" ? "#4B6350" : "#A34632" }}>{movement.direction === "in" ? "+" : "−"}{fmt(movement.quantity)} · {movement.date}</span></div>)}</div>
      {showAdd && <Modal title="مادة جديدة في المخزون" onClose={() => setShowAdd(false)}><AddInventoryForm existing={inventory} onAdd={(item) => { upsert("inventory", item); setShowAdd(false); }} /></Modal>}
    </div>
  );
}
function AddInventoryForm({ onAdd, existing = [] }) {
  const [name, setName] = useState("");
  const [quantity, setQuantity] = useState("");
  const [unit, setUnit] = useState("كيس");
  const [minThreshold, setMinThreshold] = useState("");
  const [averageCost, setAverageCost] = useState("0");
  const submit = () => {
    if (!name.trim() || !nonNegativeNumber(quantity || 0) || !nonNegativeNumber(minThreshold || 0) || !nonNegativeNumber(averageCost || 0)) { notify("أدخل كميات وتكلفة غير سالبة."); return; }
    if (hasDuplicateName(existing, name)) { notify("هذه المادة موجودة مسبقًا."); return; }
    onAdd({ id: uid(), name: name.trim(), quantity: Number(quantity || 0), unit, minThreshold: Number(minThreshold || 0), averageCost: roundMoney(Number(averageCost || 0)) });
  };
  return (
    <div className="flex flex-col gap-3">
      <div><FieldLabel>اسم المادة</FieldLabel><TextInput list="item-suggestions-2" value={name} onChange={(e) => setName(e.target.value)} /><datalist id="item-suggestions-2">{ITEM_SUGGESTIONS.map((s) => <option key={s} value={s} />)}</datalist></div>
      <div className="grid grid-cols-2 gap-3"><div><FieldLabel>الكمية الحالية</FieldLabel><TextInput type="number" value={quantity} onChange={(e) => setQuantity(e.target.value)} /></div><div><FieldLabel>الوحدة</FieldLabel><Select value={unit} onChange={(e) => setUnit(e.target.value)}><option>كيس</option><option>كجم</option><option>طن</option><option>لتر</option><option>م</option><option>قطعة</option></Select></div></div>
      <div><FieldLabel>تكلفة الوحدة</FieldLabel><TextInput type="number" min="0" value={averageCost} onChange={(e) => setAverageCost(e.target.value)} /></div>
      <div><FieldLabel>حد التنبيه عند النقص</FieldLabel><TextInput type="number" value={minThreshold} onChange={(e) => setMinThreshold(e.target.value)} /></div>
      <PrimaryButton onClick={submit} full disabled={!name.trim()}><Icon name="plus" size={16} /> إضافة إلى المخزون</PrimaryButton>
    </div>
  );
}

function App() {
  const auth = useAuth();
  if (!hasSupabaseConfig) return <><ToastHost /><FactoryApp /></>;
  if (auth.loading) return <><ToastHost /><div dir="rtl" className="min-h-screen flex items-center justify-center text-sm" style={{ background: "var(--bg)", color: "var(--text-muted)", fontFamily: "'Cairo', sans-serif" }}>جارٍ التحقق من الحساب...</div></>;
  if (!auth.session) return <><ToastHost /><AuthScreen auth={auth} /></>;
  if (auth.error || !auth.organization) return <><ToastHost /><div dir="rtl" className="min-h-screen flex flex-col items-center justify-center gap-4 p-4 text-sm" style={{ background: "var(--bg)", color: "#A34632", fontFamily: "'Cairo', sans-serif" }}><div>تعذر تجهيز مساحة الشركة: {auth.error || "لم يتم العثور على المنظمة"}</div><button onClick={auth.signOut} className="rounded-lg border px-4 py-2" style={{ color: "var(--text-body)", borderColor: "var(--card-border)", background: "var(--card-bg)" }}>تسجيل الخروج</button></div></>;
  return <><ToastHost /><FactoryApp organizationId={auth.organization.organization_id || auth.organization.id} organizationCode={auth.organization.invite_code} email={auth.session.user.email} onSignOut={auth.signOut} /></>;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
